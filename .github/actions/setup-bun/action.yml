name: Setup Bun dependencies
description: Set up the repository Bun toolchain and install the locked workspace dependencies.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.23
    - name: Install dependencies and generate Prisma Client
      shell: bash
      run: bun install --frozen-lockfile
