name: Patch issue 302 completion graduation outcomes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-302-completion-graduation-outcomes
      - run: python .github/patch-issue-302.py
      - name: Commit generated feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma \
            apps/backend/prisma/migrations/20260818030000_add_completion_graduation_outcomes/migration.sql \
            apps/backend/scripts/verify-db-security.ts \
            apps/backend/src/plugins/students/cohort-service.ts \
            apps/backend/src/plugins/students/cohort-router.ts \
            apps/backend/src/plugins/students/completion-outcomes-db.test.ts \
            apps/backend/src/plugins/qa/analysis/evidence-semantics.ts \
            apps/backend/src/plugins/qa/analysis/deterministic-engine.ts \
            apps/backend/src/plugins/qa/evidence/registry.ts \
            apps/backend/src/plugins/qa/evidence/service.ts \
            packages/shared-types/src/student-progression.ts \
            packages/shared-types/src/qa-evidence-candidates.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(qa): add completion and graduation outcome evidence (#302)"
          git pull --rebase origin agent/issue-302-completion-graduation-outcomes
          git push origin HEAD:agent/issue-302-completion-graduation-outcomes
