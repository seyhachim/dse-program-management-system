name: Patch issue 230 SAR files

on:
  push:
    branches: [agent/issue-230-structured-sar-editor]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-230-structured-sar-editor
      - run: python .github/patch-issue-230-schema.py
      - run: python .github/patch-issue-230-workspace.py
      - name: Commit generated patches if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma apps/frontend/app/'(shell)'/aun-qa/workspace-client.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: wire structured SAR editor into workspace"
          git push origin HEAD:agent/issue-230-structured-sar-editor
