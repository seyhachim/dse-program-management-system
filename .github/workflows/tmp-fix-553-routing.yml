name: Apply issue 553 routing fix
on:
  push:
    branches:
      - fix/public-telegram-individual-button-routing-553
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-telegram-individual-button-routing-553
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch router and tests
        shell: python
        run: |
          from pathlib import Path

          router_path = Path('apps/backend/src/plugins/telegram/public-bot/router.ts')
          text = router_path.read_text()

          text = text.replace(
          '''  listFaqs(\n    programmeId: string,\n    filters?: {\n      category?: ProgrammeFaqCategory;\n      featured?: boolean;\n      locale?: PublicProgrammeLocale;\n    },\n  ): Promise<PublicProgrammeFaq[]>;\n''',
          '''  listFaqs(\n    programmeId: string,\n    filters?: {\n      category?: ProgrammeFaqCategory;\n      featured?: boolean;\n      locale?: PublicProgrammeLocale;\n    },\n  ): Promise<PublicProgrammeFaq[]>;\n  getFaqBySlug(\n    programmeId: string,\n    slug: string,\n    locale?: PublicProgrammeLocale,\n  ): Promise<PublicProgrammeFaq>;\n''')

          text = text.replace(
          '''  listImportantDates(\n    programmeId: string,\n    filters?: { locale?: PublicProgrammeLocale },\n  ): Promise<PublicProgrammeImportantDate[]>;\n''',
          '''  listImportantDates(\n    programmeId: string,\n    filters?: {\n      kind?:\n        | "ApplicationOpen"\n        | "ApplicationDeadline"\n        | "EntranceExam"\n        | "Interview"\n        | "Results"\n        | "Registration"\n        | "SemesterStart";\n      locale?: PublicProgrammeLocale;\n    },\n  ): Promise<PublicProgrammeImportantDate[]>;\n''')

          marker = '''const CATEGORY_BY_PREFIX: Array<[string, ProgrammeFaqCategory]> = [\n  ["about:", "About"],\n  ["admission:", "Admission"],\n  ["curriculum:", "Curriculum"],\n  ["careers:", "Careers"],\n  ["career:", "Careers"],\n  ["fees:", "FeesScholarships"],\n  ["scholarships:", "FeesScholarships"],\n  ["studentlife:", "StudentLife"],\n  ["facility:", "Facilities"],\n  ["lecturers:", "Lecturers"],\n  ["lecturer:", "Lecturers"],\n];\n'''
          addition = marker + '''\nconst FAQ_SLUG_BY_CALLBACK: Record<string, string> = {\n  "about:what_is_dse": "what-is-dse",\n  "about:why_dse": "why-dse",\n  "about:what_learn": "what-will-i-study",\n  "about:duration": "programme-duration",\n  "about:who_should_join": "who-should-join-dse",\n  "about:vs_cs": "dse-vs-computer-science",\n  "about:vs_it": "dse-vs-information-technology",\n  "admission:eligibility": "admission-eligibility",\n  "admission:requirements": "admission-requirements",\n  "admission:how_to_apply": "how-to-apply",\n  "admission:documents": "admission-documents",\n  "admission:exam": "entrance-exam",\n  "admission:english": "english-requirement",\n  "admission:programming": "programming-requirement",\n  "admission:math": "mathematics-requirement",\n  "curriculum:overview": "what-will-i-study",\n  "curriculum:topic:programming": "curriculum-programming",\n  "curriculum:topic:data": "curriculum-data",\n  "curriculum:topic:ai_ml": "curriculum-ai-ml",\n  "curriculum:topic:math": "curriculum-math-statistics",\n  "curriculum:projects": "curriculum-projects",\n  "curriculum:internship": "curriculum-internship",\n  "curriculum:final_project": "final-year-options",\n  "careers:jobs": "career-opportunities",\n  "careers:explorer": "career-opportunities",\n  "career:data_analyst": "career-data-analyst",\n  "career:data_scientist": "career-data-scientist",\n  "career:ml_engineer": "career-ml-engineer",\n  "career:data_engineer": "career-data-engineer",\n  "career:software_engineer": "career-software-engineer",\n  "career:bi_analyst": "career-bi-analyst",\n  "career:research": "career-research",\n  "career:government": "career-government",\n  "career:agritech": "career-agritech",\n  "fees:tuition": "tuition-fee",\n  "fees:other_costs": "other-study-costs",\n  "fees:payment_schedule": "payment-schedule",\n  "fees:support": "financial-support",\n  "scholarships:available": "scholarships-available",\n  "scholarships:eligibility": "scholarship-eligibility",\n  "scholarships:apply": "scholarship-how-to-apply",\n  "scholarships:deadline": "scholarship-deadline",\n  "studentlife:experience": "student-life-experience",\n  "studentlife:projects": "student-life-projects",\n  "studentlife:internships": "student-life-internships",\n  "studentlife:clubs": "student-life-clubs",\n  "studentlife:competitions": "student-life-competitions",\n  "studentlife:workload": "student-life-workload",\n  "studentlife:team_projects": "student-life-team-projects",\n  "studentlife:support": "student-life-support",\n  "facility:computer_labs": "facility-computer-labs",\n  "facility:data_computing": "facility-data-computing-lab",\n  "facility:smart_agriculture": "facility-smart-agriculture-systems-lab",\n  "facility:software": "facility-software-tools",\n  "facility:research": "facility-research",\n  "lecturers:leadership": "programme-leadership",\n  "lecturers:list:1": "lecturers",\n  "lecturers:expertise": "lecturer-expertise",\n  "lecturers:research": "lecturer-research",\n  "fit:q1:programming": "fit-programming",\n  "fit:q1:data": "fit-data-numbers",\n  "fit:q1:ai": "fit-ai-technology",\n  "fit:q1:research": "fit-research",\n  "fit:q1:unsure": "fit-not-sure",\n  "fit:q2:love": "fit-math-love",\n  "fit:q2:okay": "fit-math-okay",\n  "fit:q2:difficult": "fit-math-difficult",\n  "fit:q3:yes": "fit-programming-yes",\n  "fit:q3:little": "fit-programming-little",\n  "fit:q3:never": "fit-programming-never",\n};\n\ntype ImportantDateKind = NonNullable<\n  Parameters<PublicReadService["listImportantDates"]>[1]\n>["kind"];\n\nconst DATE_KIND_BY_CALLBACK: Record<string, ImportantDateKind> = {\n  "dates:application_open": "ApplicationOpen",\n  "dates:application_deadline": "ApplicationDeadline",\n  "dates:exam": "EntranceExam",\n  "dates:interview": "Interview",\n  "dates:results": "Results",\n  "dates:registration": "Registration",\n  "dates:semester_start": "SemesterStart",\n};\n'''
          assert marker in text
          text = text.replace(marker, addition)

          text = text.replace(
          '''function formatFaqs(title: string, faqs: PublicProgrammeFaq[]): string {\n''',
          '''function formatFaq(faq: PublicProgrammeFaq): string {\n  return `${faq.question}\\n\\n${faq.shortAnswer || faq.answer}`;\n}\n\nfunction formatMissingPublishedTopic(slug: string): string {\n  return `DSE Information\\n\\nNo published information is available yet for “${slug.replaceAll("-", " ")}”.`;\n}\n\nfunction formatFaqs(title: string, faqs: PublicProgrammeFaq[]): string {\n''')

          text = text.replace(
          '''async function renderStaticCallback(\n  data: string,\n  programmeId: string,\n  publicRead: PublicReadService,\n  locale: PublicProgrammeLocale = "en",\n''',
          '''async function renderStaticCallback(\n  data: string,\n  programmeId: string,\n  publicRead: PublicReadService,\n  publicCurriculumRead: PublicCurriculumReadService,\n  locale: PublicProgrammeLocale = "en",\n''')

          old = '''  if (data.startsWith("dates:")) {\n    return {\n      text: formatDates(\n        await publicRead.listImportantDates(programmeId, { locale }),\n      ),\n      replyMarkup: inlineKeyboard("dates"),\n    };\n  }\n  if (data.startsWith("contact:")) {\n    return {\n      text: formatContact(await publicRead.getContact(programmeId, locale)),\n      replyMarkup: inlineKeyboard("contact"),\n    };\n  }\n  const category = CATEGORY_BY_PREFIX.find(([prefix]) =>\n'''
          new = '''  if (data === "curriculum:courses:page:1") {\n    return {\n      text: formatCourseList(await publicCurriculumRead.listCourses(programmeId)),\n      replyMarkup: inlineKeyboard("curriculum"),\n    };\n  }\n\n  const yearMatch = data.match(/^curriculum:year:([1-4])$/);\n  if (yearMatch) {\n    const yearLevel = Number(yearMatch[1]);\n    const [first, second] = await Promise.all([\n      publicCurriculumRead.getStudyPlan(programmeId, yearLevel, "First"),\n      publicCurriculumRead.getStudyPlan(programmeId, yearLevel, "Second"),\n    ]);\n    return {\n      text: `${formatStudyPlan(first)}\\n\\n${formatStudyPlan(second)}`,\n      replyMarkup: inlineKeyboard("curriculum"),\n    };\n  }\n\n  const faqSlug = FAQ_SLUG_BY_CALLBACK[data];\n  if (faqSlug) {\n    try {\n      return {\n        text: formatFaq(await publicRead.getFaqBySlug(programmeId, faqSlug, locale)),\n        replyMarkup: inlineKeyboard(\n          data.startsWith("about:")\n            ? "about"\n            : data.startsWith("admission:")\n              ? "admission"\n              : data.startsWith("curriculum:")\n                ? "curriculum"\n                : data.startsWith("career")\n                  ? "careers"\n                  : data.startsWith("fees:") || data.startsWith("scholarships:")\n                    ? "fees"\n                    : data.startsWith("studentlife:")\n                      ? "studentLife"\n                      : data.startsWith("facility:")\n                        ? "facilities"\n                        : data.startsWith("lecturers:")\n                          ? "lecturers"\n                          : "fit",\n        ),\n      };\n    } catch {\n      return {\n        text: formatMissingPublishedTopic(faqSlug),\n        replyMarkup: inlineKeyboard(\n          data.startsWith("about:")\n            ? "about"\n            : data.startsWith("admission:")\n              ? "admission"\n              : data.startsWith("curriculum:")\n                ? "curriculum"\n                : data.startsWith("career")\n                  ? "careers"\n                  : data.startsWith("fees:") || data.startsWith("scholarships:")\n                    ? "fees"\n                    : data.startsWith("studentlife:")\n                      ? "studentLife"\n                      : data.startsWith("facility:")\n                        ? "facilities"\n                        : data.startsWith("lecturers:")\n                          ? "lecturers"\n                          : "fit",\n        ),\n      };\n    }\n  }\n\n  const dateKind = DATE_KIND_BY_CALLBACK[data];\n  if (dateKind) {\n    return {\n      text: formatDates(\n        await publicRead.listImportantDates(programmeId, { kind: dateKind, locale }),\n      ),\n      replyMarkup: inlineKeyboard("dates"),\n    };\n  }\n  if (data.startsWith("contact:")) {\n    const contact = await publicRead.getContact(programmeId, locale);\n    const valueByCallback: Record<string, string | null | undefined> = {\n      "contact:location": contact.campusAddress,\n      "contact:phone": contact.phone,\n      "contact:email": contact.admissionEmail,\n      "contact:website": contact.websiteUrl,\n      "contact:admissions": contact.applicationUrl ?? contact.admissionEmail ?? contact.phone,\n    };\n    const labelByCallback: Record<string, string> = {\n      "contact:location": "Location",\n      "contact:phone": "Phone",\n      "contact:email": "Email",\n      "contact:website": "Website",\n      "contact:admissions": "Admissions contact",\n    };\n    const value = valueByCallback[data];\n    return {\n      text: value\n        ? `${labelByCallback[data]}\\n\\n${value}`\n        : `${labelByCallback[data] ?? "Contact"}\\n\\nNo published information is available yet.`,\n      replyMarkup: inlineKeyboard("contact"),\n    };\n  }\n  const category = CATEGORY_BY_PREFIX.find(([prefix]) =>\n'''
          assert old in text
          text = text.replace(old, new)

          text = text.replace(
          '''              publicRead,\n              locale,\n            );\n''',
          '''              publicRead,\n              publicCurriculumRead,\n              locale,\n            );\n''', 1)

          router_path.write_text(text)

          test_path = Path('apps/backend/src/plugins/telegram/public-bot/router.test.ts')
          t = test_path.read_text()
          insert_after = '''    async listFaqs(_programmeId: string, filters?: { category?: string; featured?: boolean }) {\n      if (filters?.featured) {\n        return [{\n          slug: "what-is-dse",\n          category: "About" as const,\n          question: "What is DSE?",\n          answer: "Published DSE answer.",\n          shortAnswer: "Published DSE answer.",\n          isFeatured: true,\n          sourceLabel: null,\n          sourceUrl: null,\n        }];\n      }\n      return [{\n        slug: "admission-requirements",\n        category: (filters?.category ?? "Admission") as "Admission",\n        question: "What are the admission requirements?",\n        answer: "Published admission answer.",\n        shortAnswer: null,\n        isFeatured: false,\n        sourceLabel: null,\n        sourceUrl: null,\n      }];\n    },\n'''
          replacement = insert_after + '''    async getFaqBySlug(_programmeId: string, slug: string) {\n      if (slug === "why-dse") {\n        return {\n          slug,\n          category: "About" as const,\n          question: "Why DSE?",\n          answer: "Specific published Why DSE answer.",\n          shortAnswer: null,\n          isFeatured: false,\n          sourceLabel: null,\n          sourceUrl: null,\n        };\n      }\n      if (slug === "admission-requirements") {\n        return {\n          slug,\n          category: "Admission" as const,\n          question: "What are the admission requirements?",\n          answer: "Specific published admission requirements.",\n          shortAnswer: null,\n          isFeatured: false,\n          sourceLabel: null,\n          sourceUrl: null,\n        };\n      }\n      throw new Error("FAQ not found");\n    },\n'''
          assert insert_after in t
          t = t.replace(insert_after, replacement)

          t = t.replace(
          '''    async listImportantDates() { return []; },\n    async getContact() {\n      return {\n        admissionEmail: "admission@example.edu",\n        phone: null,\n        websiteUrl: null,\n        facebookUrl: null,\n        campusAddress: null,\n        mapUrl: null,\n        applicationUrl: null,\n      };\n    },\n''',
          '''    async listImportantDates(_programmeId: string, filters?: { kind?: string }) {\n      if (filters?.kind === "ApplicationDeadline") {\n        return [{\n          kind: "ApplicationDeadline" as const,\n          title: "Application deadline",\n          description: "Published deadline",\n          date: "2026-09-30",\n          endDate: null,\n        }];\n      }\n      return [];\n    },\n    async getContact() {\n      return {\n        admissionEmail: "admission@example.edu",\n        phone: "+855 93 222 380",\n        websiteUrl: "https://example.edu/dse",\n        facebookUrl: null,\n        campusAddress: "Room 302, STEM Building",\n        mapUrl: null,\n        applicationUrl: null,\n      };\n    },\n''')

          tests_marker = '''  test("malformed callback fails safely without editing content", async () => {\n'''
          added_tests = '''  test("individual About callback renders one DB-backed FAQ instead of the full category", async () => {\n    const response = await webhook({\n      update_id: 40,\n      callback_query: {\n        id: "cb-about",\n        data: "about:why_dse",\n        message: { message_id: 50, chat: { id: 21 } },\n      },\n    });\n    expect(response.status).toBe(200);\n    expect(client.edited.at(-1)?.text).toContain("Specific published Why DSE answer.");\n    expect(client.edited.at(-1)?.text).not.toContain("Published admission answer.");\n  });\n\n  test("missing individual FAQ fails safely with a topic-specific published-content message", async () => {\n    const response = await webhook({\n      update_id: 41,\n      callback_query: {\n        id: "cb-missing",\n        data: "about:vs_cs",\n        message: { message_id: 51, chat: { id: 21 } },\n      },\n    });\n    expect(response.status).toBe(200);\n    expect(client.edited.at(-1)?.text).toContain("No published information is available yet");\n    expect(client.edited.at(-1)?.text).toContain("dse vs computer science");\n  });\n\n  test("curriculum year callback uses canonical published curriculum data", async () => {\n    const response = await webhook({\n      update_id: 42,\n      callback_query: {\n        id: "cb-year",\n        data: "curriculum:year:1",\n        message: { message_id: 52, chat: { id: 21 } },\n      },\n    });\n    expect(response.status).toBe(200);\n    expect(client.edited.at(-1)?.text).toContain("Year 2 · Semester 1");\n    expect(client.edited.at(-1)?.text).toContain("Year 2 · Semester 2");\n  });\n\n  test("all-courses callback uses canonical published curriculum list", async () => {\n    const response = await webhook({\n      update_id: 43,\n      callback_query: {\n        id: "cb-courses",\n        data: "curriculum:courses:page:1",\n        message: { message_id: 53, chat: { id: 21 } },\n      },\n    });\n    expect(response.status).toBe(200);\n    expect(client.edited.at(-1)?.text).toContain("PAN202 — Predictive Analytics");\n  });\n\n  test("date callback requests only the selected published date kind", async () => {\n    const response = await webhook({\n      update_id: 44,\n      callback_query: {\n        id: "cb-date",\n        data: "dates:application_deadline",\n        message: { message_id: 54, chat: { id: 21 } },\n      },\n    });\n    expect(response.status).toBe(200);\n    expect(client.edited.at(-1)?.text).toContain("Application deadline: 2026-09-30");\n  });\n\n  test("contact callback returns only the selected published contact field", async () => {\n    const response = await webhook({\n      update_id: 45,\n      callback_query: {\n        id: "cb-phone",\n        data: "contact:phone",\n        message: { message_id: 55, chat: { id: 21 } },\n      },\n    });\n    expect(response.status).toBe(200);\n    expect(client.edited.at(-1)?.text).toBe("Phone\\n\\n+855 93 222 380");\n    expect(client.edited.at(-1)?.text).not.toContain("admission@example.edu");\n  });\n\n'''
          assert tests_marker in t
          t = t.replace(tests_marker, added_tests + tests_marker)
          test_path.write_text(t)
      - name: Format targeted files
        run: bunx prettier --write apps/backend/src/plugins/telegram/public-bot/router.ts apps/backend/src/plugins/telegram/public-bot/router.test.ts
      - name: Run focused tests
        run: bun test apps/backend/src/plugins/telegram/public-bot/router.test.ts
      - name: Commit product changes and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-fix-553-routing.yml
          git add apps/backend/src/plugins/telegram/public-bot/router.ts apps/backend/src/plugins/telegram/public-bot/router.test.ts
          git commit -m "fix(telegram): route individual buttons to published content (#553)"
          git push origin HEAD:fix/public-telegram-individual-button-routing-553