name: Patch issue 306 improvement followup traceability

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-306-improvement-followup-traceability
      - run: python .github/patch-issue-306.py
      - name: Commit generated feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared-types/src/qa-actions.ts \
            packages/shared-types/src/qa-evidence-candidates.ts \
            apps/backend/prisma/migrations/20260818050000_add_qa_improvement_followup_links/migration.sql \
            apps/backend/scripts/verify-db-security.ts \
            apps/backend/src/plugins/qa/actions/follow-up-service.ts \
            apps/backend/src/plugins/qa/actions/router.ts \
            apps/backend/src/plugins/qa/evidence/continuous-improvement-evidence.ts \
            apps/backend/src/plugins/qa/evidence/continuous-improvement-evidence.test.ts \
            apps/backend/src/plugins/qa/evidence/service.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(qa): add explicit improvement follow-up traceability (#306)"
          git pull --rebase origin agent/issue-306-improvement-followup-traceability
          git push origin HEAD:agent/issue-306-improvement-followup-traceability
