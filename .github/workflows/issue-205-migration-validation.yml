name: Issue 205 migration validation

on:
  push:
    branches:
      - agent/issue-205-academic-version-schema

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - name: Fresh database migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
        run: |
          bun run --cwd apps/backend db:generate
          bun run --cwd apps/backend db:migrate:deploy
          bunx prisma validate --schema apps/backend/prisma/schema.prisma
      - name: Prepare existing pre-versioning database
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          createdb -h localhost -U postgres existing_versioning
          mv apps/backend/prisma/migrations/20260815050000_add_course_spec_academic_versions /tmp/academic-version-migration
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/existing_versioning?schema=public' bunx prisma migrate deploy --schema apps/backend/prisma/schema.prisma
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d existing_versioning <<'SQL'
          INSERT INTO "Programme" ("id", "code", "name", "status", "createdAt", "updatedAt")
          VALUES ('dse', 'DSE', 'Data Science and Engineering', 'active', NOW(), NOW())
          ON CONFLICT ("id") DO NOTHING;
          INSERT INTO "Course" ("id", "code", "title", "programmeId", "createdAt")
          VALUES ('00000000-0000-0000-0000-000000000001', 'VER101', 'Version Migration Test', 'dse', NOW());
          INSERT INTO "User" ("id", "email", "name", "createdAt")
          VALUES ('00000000-0000-0000-0000-000000000002', 'reviewer@example.test', 'Reviewer', NOW());
          INSERT INTO "CourseSpec" (
            "id", "courseId", "reviewStatus", "submissionVersion", "submissionNote", "createdAt", "updatedAt"
          ) VALUES (
            '00000000-0000-0000-0000-000000000003',
            '00000000-0000-0000-0000-000000000001',
            'Approved', 2, '', NOW() - INTERVAL '1 year', NOW()
          );
          INSERT INTO "CourseSpecReviewAction" (
            "id", "courseSpecId", "submissionVersion", "action", "actorId", "note", "createdAt"
          ) VALUES (
            '00000000-0000-0000-0000-000000000004',
            '00000000-0000-0000-0000-000000000003',
            2, 'Approved', '00000000-0000-0000-0000-000000000002', '',
            TIMESTAMP '2026-01-15 00:00:00'
          );
          SQL
          mv /tmp/academic-version-migration apps/backend/prisma/migrations/20260815050000_add_course_spec_academic_versions
      - name: Upgrade existing database and assert semantics
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/existing_versioning?schema=public
          PGPASSWORD: postgres
        shell: bash
        run: |
          bunx prisma migrate deploy --schema apps/backend/prisma/schema.prisma
          psql -h localhost -U postgres -d existing_versioning -Atc \
            "SELECT \"versionMajor\" || '.' || \"versionMinor\" || '|' || \"submissionVersion\" || '|' || to_char(\"approvedAt\", 'YYYY-MM-DD') || '|' || to_char(\"nextReviewDueAt\", 'YYYY-MM-DD') FROM \"CourseSpec\" WHERE \"id\"='00000000-0000-0000-0000-000000000003'" \
            | grep -Fx '1.0|2|2026-01-15|2029-01-15'
          psql -h localhost -U postgres -d existing_versioning -Atc \
            "SELECT COUNT(*) FROM \"CourseSpecReviewAction\" WHERE \"courseSpecId\"='00000000-0000-0000-0000-000000000003'" \
            | grep -Fx '1'
