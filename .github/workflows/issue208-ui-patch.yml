name: Apply issue 208 UI test integration

on:
  push:
    branches:
      - agent/issue-208-revision-impact-assessment

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-208-revision-impact-assessment
      - run: python .github/scripts/issue208_ui_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(course-spec): wire revision workspace decision coverage (#208)"
          git push origin HEAD:agent/issue-208-revision-impact-assessment
