name: Issue 333 DB fixture fix

on:
  push:
    branches:
      - agent/issue-333-finalized-result-corrections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-333-finalized-result-corrections
      - run: python scripts/issue-333-db-fixture-fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-333-db-fixture-fix.yml scripts/issue-333-db-fixture-fix.py
          git add apps/backend/src/plugins/student-portal/results-lifecycle-db.test.ts
          git diff --cached --check
          git commit -m "test(results): select an active approved assessment fixture"
          git push origin HEAD:agent/issue-333-finalized-result-corrections
