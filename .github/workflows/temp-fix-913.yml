name: Apply Telegram concise-menu fix

on:
  push:
    branches:
      - fix/913-telegram-concise-topic-menus

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/913-telegram-concise-topic-menus
      - name: Patch topic landing routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/backend/src/plugins/telegram/public-bot/router.ts')
          s = p.read_text()

          start = s.index('  if (route === "admission") {')
          end = s.index('  if (route === "dates") {', start)
          replacement = '''  if (route === "admission" || route === "fees" || route === "scholarships") {
            return {
              text: `${MENUS[route].title}\\n\\nChoose an option below.`,
              replyMarkup: inlineKeyboard(route),
            };
          }
          '''
          s = s[:start] + replacement + s[end:]

          start = s.index('  const categoryByRoute: Partial<Record<RouteKey, ProgrammeFaqCategory>> = {')
          end = s.index('  return {\n    text: `${MENUS[route].title}\\n\\nChoose an option below.`,', start)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
      - name: Commit root fix
        shell: bash
        run: |
          git rm .github/workflows/temp-fix-913.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/backend/src/plugins/telegram/public-bot/router.ts
          git commit -m "fix(telegram): keep topic landing menus concise"
          git push origin HEAD:fix/913-telegram-concise-topic-menus
