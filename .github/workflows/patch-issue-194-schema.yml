name: Patch issue 194 Prisma schema

on:
  push:
    branches:
      - agent/issue-194-aun-qa-pilot-evaluation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-194-aun-qa-pilot-evaluation
      - run: python .github/patch-issue-194-schema.py
      - run: |
          git config user.name "seyhachim"
          git config user.email "32429415+seyhachim@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extend QA pilot evidence Prisma model"
          git push origin HEAD:agent/issue-194-aun-qa-pilot-evaluation
