name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: issue-449-typefix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-typefix:
    if: github.event.pull_request.head.ref == 'agent/issue-449-group-assessment-results' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-449-group-assessment-results
          fetch-depth: 0
      - name: Apply guarded frontend type fixes
        run: python .github/scripts/apply_issue_449_typefix.py
      - name: Commit product fixes only
        run: |
          git restore --source=HEAD -- .github/scripts/apply_issue_449_typefix.py .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(results): repair group assessment frontend types"
          git push origin HEAD:agent/issue-449-group-assessment-results
