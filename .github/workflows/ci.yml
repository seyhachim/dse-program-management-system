name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Validate Prisma schema
        run: bunx prisma validate --schema apps/backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_ci?schema=public

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_AUTH_MODE: supabase
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key

      - name: Lint status
        run: |
          echo "Lint is intentionally not a required CI gate yet."
          echo "Issue #127 tracks replacing the broken Next.js 'next lint' command with a reliable ESLint command."

  database:
    name: Fresh database migration and seed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Apply migrations
        run: bun run db:migrate:deploy

      - name: Seed clean database
        run: bun run seed
