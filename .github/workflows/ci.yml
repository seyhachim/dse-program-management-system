name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies and generate Prisma Client
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client explicitly
        run: bun run db:generate

      - name: Validate Prisma schema
        run: bunx prisma validate --schema apps/backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_ci?schema=public

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test all suites
        run: bun run test

      - name: Verify backend test discovery
        run: bun run test:backend

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_AUTH_MODE: supabase
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key

  database:
    name: Fresh database migration, seed, and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies and generate Prisma Client
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client explicitly
        run: bun run db:generate

      - name: Simulate Supabase Data API roles and defaults
        run: |
          cat <<'SQL' | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN;
            END IF;
          END
          $$;

          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON FUNCTIONS TO anon, authenticated, service_role;

          CREATE SCHEMA IF NOT EXISTS telegram_security;
          GRANT USAGE, CREATE ON SCHEMA telegram_security TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA telegram_security
            GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA telegram_security
            GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA telegram_security
            GRANT ALL PRIVILEGES ON FUNCTIONS TO anon, authenticated, service_role;
          SQL

      - name: Apply migrations
        run: bun run db:migrate:deploy

      - name: Reapply committed migrations safely
        run: bun run db:migrate:deploy

      - name: Reject backend startup when migration fails
        run: |
          set +e
          DATABASE_URL='postgresql://ci:ci@127.0.0.1:1/dse_ci?schema=public&connect_timeout=2' \
            timeout 30s bun run --cwd apps/backend start > startup-failure.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ] || grep -q 'DSE-PMS backend listening' startup-failure.log; then
            cat startup-failure.log
            exit 1
          fi


      - name: Seed clean database
        run: bun run seed

      - name: Verify curriculum database invariants
        run: bun test apps/backend/src/plugins/programme/curriculum-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify curriculum revision and read service
        run: bun test apps/backend/src/plugins/programme/curriculum-service-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify curriculum draft mutations
        run: bun test apps/backend/src/plugins/programme/curriculum-draft-service-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify curriculum lifecycle workflow
        run: bun test apps/backend/src/plugins/programme/curriculum-workflow-service-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify curriculum history ordering
        run: bun test apps/backend/src/plugins/programme/curriculum-history-service-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify curriculum CourseSpec bindings
        run: bun test apps/backend/src/plugins/programme/curriculum-course-spec-service-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify curriculum competency framework history
        run: bun test apps/backend/src/plugins/programme/competency-framework-service-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify curriculum course-competency map integrity
        run: bun test apps/backend/src/plugins/programme/curriculum-competency-map-service-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify CourseSpec programme competency context resolution
        run: bun test apps/backend/src/plugins/programme/course-competency-context-service-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify CourseSpec competency evidence and revision provenance
        run: bun test apps/backend/src/plugins/courses/competency-evidence-service-db.test.ts
        env:
          COURSE_SPEC_COMPETENCY_DB_TESTS: "1"

      - name: Verify programme grading-scale history and CourseSpec binding integrity
        run: bun test apps/backend/src/plugins/programme/grading-scale-db.test.ts
        env:
          CURRICULUM_DB_TESTS: "1"

      - name: Verify Telegram identity and revocation security
        run: bun test apps/backend/src/plugins/telegram/telegram-security-db.test.ts
        env:
          TELEGRAM_DB_TESTS: "1"
          JWT_SECRET: telegram-ci-security-secret-at-least-32-characters

      - name: Verify criterion evidence database invariants and revision provenance
        run: bun test apps/backend/src/plugins/student-portal/criterion-evidence-db.test.ts
        env:
          CRITERION_EVIDENCE_DB_TESTS: "1"

      - name: Verify class responsibility integrity and revocation
        run: bun test apps/backend/src/plugins/offerings/class-responsibility-db.test.ts
        env:
          CLASS_RESPONSIBILITY_DB_TESTS: "1"

      - name: Verify lecturer arrival confirmation persistence and idempotence
        run: bun test apps/backend/src/plugins/offerings/class-delivery-db.test.ts
        env:
          CLASS_DELIVERY_DB_TESTS: "1"

      - name: Verify exact teaching session occurrence integrity
        run: bun test apps/backend/src/plugins/offerings/teaching-session-occurrence-db.test.ts
        env:
          CLASS_DELIVERY_DB_TESTS: "1"

      - name: Verify unassigned teaching request integrity
        run: bun test apps/backend/src/plugins/offerings/unassigned-teaching-request-db.test.ts
        env:
          UNASSIGNED_TEACHING_DB_TESTS: "1"

      - name: Verify historical attendance correction
        run: bun test apps/backend/src/plugins/offerings/attendance-service-db.test.ts
        env:
          ATTENDANCE_DB_TESTS: "1"

      - name: Verify provisional attendance identity and warning evaluation
        run: bun test apps/backend/src/plugins/offerings/attendance-provisional-student-db.test.ts
        env:
          ATTENDANCE_DB_TESTS: "1"

      - name: Verify Offering CourseSpec binding and historical result stability
        run: bun test apps/backend/src/plugins/offerings/course-spec-binding-db.test.ts
        env:
          OFFERING_COURSE_SPEC_DB_TESTS: "1"
          JWT_SECRET: issue-211-course-spec-binding-ci-secret-at-least-32-characters

      - name: Verify Enrollment academic-evidence protection
        run: bun test apps/backend/src/plugins/offerings/enrollment-integrity-db.test.ts
        env:
          ENROLLMENT_INTEGRITY_DB_TESTS: "1"

      - name: Verify Academic Calendar revision and Offering history integrity
        run: bun test apps/backend/src/plugins/programme/academic-calendar-integrity-db.test.ts
        env:
          ACADEMIC_CALENDAR_DB_TESTS: "1"

      - name: Verify Student Portal Academic Calendar publication boundary
        run: bun test apps/backend/src/plugins/student-portal/academic-calendar-db.test.ts
        env:
          ACADEMIC_CALENDAR_DB_TESTS: "1"

      - name: Verify CourseSpec Course Information snapshot stability
        run: bun test apps/backend/src/plugins/courses/course-info-snapshot-db.test.ts
        env:
          COURSE_INFO_SNAPSHOT_DB_TESTS: "1"

      - name: Verify immutable CourseSpec revision request metadata
        run: bun test apps/backend/src/plugins/courses/revision-request-db.test.ts
        env:
          COURSE_SPEC_REVISION_REQUEST_DB_TESTS: "1"

      - name: Verify provisional result access and finalized-result visibility
        run: bun test apps/backend/src/plugins/student-portal/result-access-policy-db.test.ts
        env:
          RESULT_ACCESS_POLICY_DB_TESTS: "1"
          JWT_SECRET: pr-289-result-access-ci-secret-at-least-32-characters

      - name: Verify finalized result correction integrity
        run: bun test apps/backend/src/plugins/student-portal/results-lifecycle-db.test.ts
        env:
          RESULT_CORRECTION_DB_TESTS: "1"

      - name: Verify group assessment provenance and audit integrity
        run: bun test apps/backend/src/plugins/student-portal/group-assessment-db.test.ts
        env:
          GROUP_ASSESSMENT_DB_TESTS: "1"

      - name: Verify database security
        run: bun run --cwd apps/backend db:security:verify

      - name: Prove verifier ignores managed-role default grants
        run: |
          cat <<'SQL' | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin
          CREATE ROLE supabase_managed_probe NOLOGIN;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_managed_probe IN SCHEMA public
            GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_managed_probe IN SCHEMA public
            GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_managed_probe IN SCHEMA public
            GRANT ALL PRIVILEGES ON FUNCTIONS TO anon, authenticated, service_role;
          SQL

          bun run --cwd apps/backend db:security:verify

          cat <<'SQL' | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_managed_probe IN SCHEMA public
            REVOKE ALL PRIVILEGES ON TABLES FROM anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_managed_probe IN SCHEMA public
            REVOKE ALL PRIVILEGES ON SEQUENCES FROM anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_managed_probe IN SCHEMA public
            REVOKE ALL PRIVILEGES ON FUNCTIONS FROM anon, authenticated, service_role;
          DROP ROLE supabase_managed_probe;
          SQL

      - name: Prove verifier rejects an unclassified public table
        run: |
          echo 'CREATE TABLE public."SecurityVerifierProbe" ("id" text PRIMARY KEY);' \
            | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin

          if bun run --cwd apps/backend db:security:verify; then
            echo "Verifier unexpectedly accepted an unclassified public table."
            exit 1
          fi

          echo 'DROP TABLE public."SecurityVerifierProbe";' \
            | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin

      - name: Prove verifier rejects an unclassified Telegram security table
        run: |
          echo 'CREATE TABLE telegram_security."SecurityVerifierProbe" ("id" text PRIMARY KEY);' \
            | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin

          if bun run --cwd apps/backend db:security:verify; then
            echo "Verifier unexpectedly accepted an unclassified Telegram security table."
            exit 1
          fi

          echo 'DROP TABLE telegram_security."SecurityVerifierProbe";' \
            | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin

      - name: Prove verifier rejects a forbidden Data API grant
        run: |
          echo 'GRANT SELECT ON TABLE public."User" TO authenticated;' \
            | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin

          if bun run --cwd apps/backend db:security:verify; then
            echo "Verifier unexpectedly accepted a forbidden authenticated grant."
            exit 1
          fi

          echo 'REVOKE SELECT ON TABLE public."User" FROM authenticated;' \
            | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin

      - name: Prove verifier rejects a forbidden protected-schema grant
        run: |
          echo 'GRANT USAGE ON SCHEMA telegram_security TO authenticated;' \
            | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin

          if bun run --cwd apps/backend db:security:verify; then
            echo "Verifier unexpectedly accepted a forbidden Telegram schema grant."
            exit 1
          fi

          echo 'REVOKE USAGE ON SCHEMA telegram_security FROM authenticated;' \
            | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin

      - name: Verify database security after fail-closed probes
        run: bun run --cwd apps/backend db:security:verify

  browser-smoke:
    name: Authenticated browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_browser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/dse_browser?schema=public
      AUTH_MODE: dev
      JWT_SECRET: issue-823-browser-smoke-secret-at-least-32-characters
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned browser-smoke dependencies
        run: bun install --cwd tests/browser --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Apply migrations to isolated browser database
        run: bun run db:migrate:deploy

      - name: Seed isolated browser database
        run: bun run seed

      - name: Mint role-scoped dev tokens
        run: |
          echo "BROWSER_SMOKE_ADMIN_TOKEN=$(bun run gen-token --role admin | tail -n 1)" >> "$GITHUB_ENV"
          echo "BROWSER_SMOKE_COORDINATOR_TOKEN=$(bun run gen-token --role program_coordinator | tail -n 1)" >> "$GITHUB_ENV"
          echo "BROWSER_SMOKE_LECTURER_TOKEN=$(bun run gen-token --role lecturer | tail -n 1)" >> "$GITHUB_ENV"
          echo "BROWSER_SMOKE_READONLY_TOKEN=$(bun run gen-token --role program_secretary | tail -n 1)" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: cd tests/browser && bunx playwright install --with-deps chromium

      - name: Run authenticated Chromium smoke
        run: bun run --cwd tests/browser test

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure-${{ github.run_id }}
          path: |
            tests/browser/test-results
            tests/browser/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  backend-integration:
    name: Backend integration authorization
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_integration"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_integration?schema=public
      AUTH_MODE: dev
      JWT_SECRET: issue-130-ci-integration-secret-at-least-32-characters
      BACKEND_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies and generate Prisma Client
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client explicitly
        run: bun run db:generate

      - name: Apply migrations to isolated integration database
        run: bun run db:migrate:deploy

      - name: Seed isolated integration database
        run: bun run seed

      - name: Run backend route/database authorization integration suite
        run: bun run test:backend:integration
