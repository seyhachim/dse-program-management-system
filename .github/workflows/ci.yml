name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  lecturer-portfolio-schema-sync:
    if: github.head_ref == 'agent/issue-584-lecturer-portfolio-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Synchronize Prisma schema and fail-closed security inventory
        shell: python
        run: |
          from pathlib import Path

          schema = Path("apps/backend/prisma/schema.prisma")
          text = schema.read_text()

          relation_anchor = "  lecturerProfile                  LecturerProfile?\n"
          relation_insert = relation_anchor + "  lecturerPortfolioItems             LecturerPortfolioItem[]         @relation(\"LecturerPortfolioItems\")\n  lecturerPortfolioVerificationEvents LecturerPortfolioVerification[] @relation(\"LecturerPortfolioVerificationActor\")\n"
          if "lecturerPortfolioItems" not in text:
              if relation_anchor not in text:
                  raise SystemExit("User lecturerProfile relation anchor not found")
              text = text.replace(relation_anchor, relation_insert, 1)

          model_anchor = '''model LecturerProfile {
            id                    String   @id @default(uuid())
            userId                String   @unique
            user                  User     @relation(fields: [userId], references: [id], onDelete: Cascade)
            gender                String?
            employmentType        String?
            fieldOfSpecialization String?
            yearsOfExperience     Int?
            legacyCoursesTaught   String?
            createdAt             DateTime @default(now())
            updatedAt             DateTime @updatedAt
          }
          '''.replace("          ", "")

          portfolio_models = model_anchor + '''

enum LecturerPortfolioItemKind {
  Qualification
  ResearchInterest
  ResearchProject
  Publication
  ProfessionalDevelopment
  Certification
  Membership
  ExternalProfile
  Supervision
  AcademicService
  Other
}

enum LecturerPortfolioVerificationStatus {
  SelfDeclared
  Verified
  Rejected
}

enum LecturerPortfolioVerificationAction {
  Verified
  Rejected
  Reset
}

/// Lecturer-owned professional evidence. It is private by default and never
/// replaces canonical teaching, CourseSpec, result, curriculum, or QA records.
model LecturerPortfolioItem {
  id                 String                               @id @default(uuid())
  lecturerId         String
  lecturer           User                                 @relation("LecturerPortfolioItems", fields: [lecturerId], references: [id], onDelete: Cascade)
  kind               LecturerPortfolioItemKind
  title              String
  organization       String                               @default("")
  description        String                               @default("")
  role               String                               @default("")
  identifier         String                               @default("")
  url                String                               @default("")
  startDate          DateTime?                            @db.Date
  endDate            DateTime?                            @db.Date
  tags               String[]                             @default([])
  isPublic           Boolean                              @default(false)
  isFeatured         Boolean                              @default(false)
  verificationStatus LecturerPortfolioVerificationStatus @default(SelfDeclared)
  createdAt          DateTime                             @default(now())
  updatedAt          DateTime                             @updatedAt

  verificationEvents LecturerPortfolioVerification[]

  @@index([lecturerId, kind])
  @@index([lecturerId, verificationStatus])
}

/// Append-only verification provenance for lecturer professional evidence.
model LecturerPortfolioVerification {
  id        String                              @id @default(uuid())
  itemId    String
  item      LecturerPortfolioItem               @relation(fields: [itemId], references: [id], onDelete: Cascade)
  action    LecturerPortfolioVerificationAction
  note      String                              @default("")
  actorId   String
  actor     User                                @relation("LecturerPortfolioVerificationActor", fields: [actorId], references: [id], onDelete: Restrict)
  createdAt DateTime                            @default(now())

  @@index([itemId, createdAt])
  @@index([actorId])
}
'''

          if "model LecturerPortfolioItem" not in text:
              if model_anchor not in text:
                  raise SystemExit("LecturerProfile model anchor not found")
              text = text.replace(model_anchor, portfolio_models, 1)
          schema.write_text(text)

          security = Path("apps/backend/scripts/verify-db-security.ts")
          secure_text = security.read_text()
          security_anchor = '  "LecturerProfile",\n'
          security_insert = security_anchor + '  "LecturerPortfolioItem",\n  "LecturerPortfolioVerification",\n'
          if '"LecturerPortfolioItem"' not in secure_text:
              if security_anchor not in secure_text:
                  raise SystemExit("security inventory LecturerProfile anchor not found")
              secure_text = secure_text.replace(security_anchor, security_insert, 1)
          security.write_text(secure_text)

      - name: Restore normal CI workflow and remove one-shot helper
        run: |
          git checkout HEAD^ -- .github/workflows/ci.yml
          if [ -f .github/workflows/lecturer-portfolio-schema-patch.yml ]; then
            git rm .github/workflows/lecturer-portfolio-schema-patch.yml
          fi

      - name: Validate and push synchronized branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma apps/backend/scripts/verify-db-security.ts .github/workflows/ci.yml
          bun install --frozen-lockfile
          bunx prisma validate --schema apps/backend/prisma/schema.prisma
          git commit -m "fix(lecturer-portfolio): sync Prisma and security inventory"
          git push origin HEAD:${{ github.head_ref }}
