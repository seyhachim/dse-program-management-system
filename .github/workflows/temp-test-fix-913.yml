name: Align Telegram concise-menu test

on:
  push:
    branches: [fix/913-telegram-concise-topic-menus]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/913-telegram-concise-topic-menus
      - name: Patch test
        env:
          REPLACEMENT_B64: 
        run: python -c "import os,base64,pathlib; p=pathlib.Path('apps/backend/src/plugins/telegram/public-bot/router.test.ts'); s=p.read_text(); a=s.index('  test(\"primary Admission selection renders PMS-owned published FAQ content\"'); b=s.index('  test(\"/courses lists curriculum-backed published courses\"',a); r=base64.b64decode(os.environ['REPLACEMENT_B64']).decode(); p.write_text(s[:a]+r+s[b:])"
      - name: Commit
        run: |
          git rm .github/workflows/temp-test-fix-913.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/backend/src/plugins/telegram/public-bot/router.test.ts
          git commit -m "test(telegram): expect concise Admission landing menu"
          git push origin HEAD:fix/913-telegram-concise-topic-menus
