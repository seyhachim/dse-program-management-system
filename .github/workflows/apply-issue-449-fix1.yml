name: Apply Issue 449 Fix 1

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/apply_issue_449_fix1.py"
      - ".github/workflows/apply-issue-449-fix1.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-449-group-assessment-results
          fetch-depth: 0
      - name: Apply guarded source fixes
        run: python .github/scripts/apply_issue_449_fix1.py
      - name: Commit product fix only
        run: |
          git restore --source=HEAD -- .github/scripts/apply_issue_449_fix1.py .github/workflows/apply-issue-449-fix1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(results): repair group assessment contracts"
          git push origin HEAD:agent/issue-449-group-assessment-results
