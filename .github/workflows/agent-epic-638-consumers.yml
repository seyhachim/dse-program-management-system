name: Agent Epic 638 Consumers

on:
  push:
    branches:
      - agent/epic-638-academic-calendar
    paths:
      - scripts/agent-epic-638-backend-consumers.ts
      - scripts/agent-epic-638-consumer-fixes.ts
      - scripts/agent-epic-638-offering-security.ts
      - .github/workflows/agent-epic-638-consumers.yml

permissions:
  contents: write

concurrency:
  group: agent-epic-638-consumers
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dse_pms
      NEXT_PUBLIC_AUTH_MODE: supabase
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic-638-academic-calendar
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Apply backend and contract consumers
        run: |
          bun scripts/agent-epic-638-backend-consumers.ts
          bun scripts/agent-epic-638-consumer-fixes.ts
          bun scripts/agent-epic-638-offering-security.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Prisma
        run: |
          bunx prisma format --schema apps/backend/prisma/schema.prisma
          bunx prisma validate --schema apps/backend/prisma/schema.prisma
          bun run --cwd apps/backend db:generate
      - name: Targeted calendar tests
        run: bun test apps/backend/src/plugins/programme/academic-calendar-domain.test.ts apps/backend/src/plugins/programme/academic-calendar-router.test.ts apps/backend/src/plugins/offerings/academic-calendar-contract.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Commit verified consumer integration
        run: |
          rm scripts/agent-epic-638-backend-consumers.ts
          rm scripts/agent-epic-638-consumer-fixes.ts
          rm scripts/agent-epic-638-offering-security.ts
          rm .github/workflows/agent-epic-638-consumers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(calendar): integrate offerings and student consumers (#638)"
          git push origin HEAD:agent/epic-638-academic-calendar
