name: Issue 1006 DB security classification

on:
  push:
    branches:
      - feature/1006-final-project-supervisor-discovery

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply classification
        run: python3 scripts/issue-1006-security-classification.py
      - name: Commit classification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(final-project): classify DB security tables"
          git push origin HEAD:feature/1006-final-project-supervisor-discovery
