name: Issue 540 Typecheck Fix

on:
  push:
    branches:
      - feat/issue-540-student-roster-import
    paths:
      - ".github/issue-540-fix-typecheck.py"
      - ".github/workflows/issue-540-fix-typecheck.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-540-student-roster-import
          fetch-depth: 0
      - run: python .github/issue-540-fix-typecheck.py
      - run: rm .github/issue-540-fix-typecheck.py .github/workflows/issue-540-fix-typecheck.yml
      - run: git diff --check
      - name: Commit typecheck fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/plugins/student-portal/service.ts apps/backend/scripts/student-roster-import.ts .github/issue-540-fix-typecheck.py .github/workflows/issue-540-fix-typecheck.yml
          git commit -m "fix(student): preserve portal email invariant (#540)"
          git push origin HEAD:feat/issue-540-student-roster-import
