name: Student Opportunities isolated staging HTTP smoke (one-shot)

on:
  push:
    branches:
      - feat/student-opportunities-manual-mvp-1284
    paths:
      - .github/workflows/staging-live-smoke-1285.yml

permissions:
  contents: read

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify matching live staging API, authentication denial and restrictive CORS
        env:
          API: https://dse-pms-staging-isolated-free.onrender.com
          PREVIEW: https://dse-m5gfjfk33-seyhachims-projects.vercel.app
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 12 --retry-all-errors --retry-delay 8 --max-time 90 "$API/health" > /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          echo "PASS: staging HTTPS /health 200"
          curl --silent --show-error --fail --retry 5 --retry-delay 5 --max-time 60 "$API/api/registry" > /tmp/registry.json
          grep -q '"opportunities"' /tmp/registry.json
          echo "PASS: staging registry includes opportunities"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 40 "$API/api/opportunities")
          test "$status" = "401"
          echo "PASS: unauthenticated opportunity feed denied (401)"
          headers=$(mktemp)
          curl --silent --show-error --output /dev/null --dump-header "$headers" --max-time 40 -H 'Origin: https://attacker.invalid' "$API/health"
          if grep -qi '^access-control-allow-origin:' "$headers"; then
            echo "FAIL: unauthorized origin received CORS header"
            exit 1
          fi
          echo "PASS: untrusted origin not granted CORS access"
          curl --silent --show-error --output /dev/null --dump-header "$headers" --max-time 40 -H "Origin: $PREVIEW" "$API/health"
          grep -Fqi "access-control-allow-origin: $PREVIEW" "$headers"
          echo "PASS: exact preview origin allowed"
