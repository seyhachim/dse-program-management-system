name: One-shot Section 14 split-table fix
on:
  push:
    branches:
      - fix/issue-766-inline-course-synopsis
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
          fetch-depth: 0
      - name: Apply Section 14 patch
        run: python tmp/fix_section14_split_tables.py
      - name: Commit
        run: |
          rm .github/workflows/tmp-fix-section14-split-tables.yml
          rm tmp/fix_section14_split_tables.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(course-spec): keep CLO C A P columns aligned"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
