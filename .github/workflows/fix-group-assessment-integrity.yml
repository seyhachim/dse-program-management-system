name: Apply group assessment integrity follow-up

on:
  push:
    branches:
      - fix/group-assessment-integrity-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Apply integrity patch and regressions
        shell: python
        run: |
          from pathlib import Path

          lifecycle = Path("apps/backend/src/plugins/student-portal/results-lifecycle.ts")
          text = lifecycle.read_text()

          helper_marker = "export function publicationReadiness(\n"
          helper = '''export function assertGenericFinalizedCorrectionMode(\n  mode: "Individual" | "Group" | "GroupIndividual",\n) {\n  if (mode !== "Individual") {\n    throw new PortalConflictError(\n      "Group and Group + Individual results must be corrected through the group assessment source correction workflow",\n    );\n  }\n}\n\n'''
          assert helper_marker in text, "publication readiness marker not found"
          assert "assertGenericFinalizedCorrectionMode" not in text, "generic correction guard already present"
          text = text.replace(helper_marker, helper + helper_marker, 1)

          old_include = '              offering: { include: { coLecturers: true } },'
          new_include = '''              offering: {\n                include: {\n                  coLecturers: true,\n                  courseSpec: {\n                    select: {\n                      id: true,\n                      assessmentItems: { select: { id: true, mode: true } },\n                    },\n                  },\n                },\n              },'''
          assert old_include in text, "generic correction offering include not found"
          text = text.replace(old_include, new_include, 1)

          old_guard = '''      if (!result.finalizedAt || !result.finalizedById || !result.publishedAt) {\n        throw new PortalConflictError("Only finalized results can use the controlled correction workflow");\n      }\n\n      const expectedUpdatedAt = new Date(input.expectedUpdatedAt).toISOString();'''
          new_guard = '''      if (!result.finalizedAt || !result.finalizedById || !result.publishedAt) {\n        throw new PortalConflictError("Only finalized results can use the controlled correction workflow");\n      }\n\n      const spec = result.enrollment.offering.courseSpec;\n      if (!spec || spec.id !== result.courseSpecId) {\n        throw new PortalConflictError(\n          "Finalized result does not match the Offering's bound CourseSpec version.",\n        );\n      }\n      const assessment = spec.assessmentItems.find((item) => item.id === result.assessmentItemId);\n      if (!assessment) {\n        throw new PortalConflictError(\n          "Finalized result does not match the Offering's bound CourseSpec assessment.",\n        );\n      }\n      assertGenericFinalizedCorrectionMode(assessment.mode);\n\n      const expectedUpdatedAt = new Date(input.expectedUpdatedAt).toISOString();'''
          assert old_guard in text, "generic correction finalized guard not found"
          text = text.replace(old_guard, new_guard, 1)
          lifecycle.write_text(text)

          group_results = Path("apps/backend/src/plugins/student-portal/group-assessment-results.ts")
          text = group_results.read_text()
          context_marker = "async function contextFor(db: Db, offeringId: string, assessmentItemId: string, actorId: string, programmeWide: boolean) {\n"
          rubric_helper = '''export function assertRubricLevelScoreMatches(\n  score: number,\n  selectedLevelPoints: number,\n) {\n  if (Math.abs(selectedLevelPoints - score) > 1e-9) {\n    throw new PortalConflictError("Selected rubric level points do not match the criterion score");\n  }\n}\n\n'''
          assert context_marker in text, "group result context marker not found"
          assert "assertRubricLevelScoreMatches" not in text, "rubric consistency guard already present"
          text = text.replace(context_marker, rubric_helper + context_marker, 1)

          old_level = '''    const level = entry.rubricLevelId ? levelById.get(entry.rubricLevelId) : undefined;\n    if (entry.rubricLevelId && !level) throw new PortalConflictError("Unknown rubric level");\n    return { rubricId: context.assessment.rubricId!, criterionId: criterion.id, criterionName: criterion.name, rubricContentHash: hash, score: entry.score, maxScore, rubricLevelId: level?.id ?? null, rubricLevelLabel: level?.label ?? null };'''
          new_level = '''    const level = entry.rubricLevelId ? levelById.get(entry.rubricLevelId) : undefined;\n    if (entry.rubricLevelId && !level) throw new PortalConflictError("Unknown rubric level");\n    if (level) assertRubricLevelScoreMatches(entry.score, level.points);\n    return { rubricId: context.assessment.rubricId!, criterionId: criterion.id, criterionName: criterion.name, rubricContentHash: hash, score: entry.score, maxScore, rubricLevelId: level?.id ?? null, rubricLevelLabel: level?.label ?? null };'''
          assert old_level in text, "group rubric validation block not found"
          text = text.replace(old_level, new_level, 1)
          group_results.write_text(text)

          regression = Path("apps/backend/src/plugins/student-portal/group-assessment-integrity.test.ts")
          regression.write_text('''import { describe, expect, test } from "bun:test";\nimport { assertRubricLevelScoreMatches } from "./group-assessment-results.ts";\nimport { assertGenericFinalizedCorrectionMode } from "./results-lifecycle.ts";\nimport { PortalConflictError } from "./service.ts";\n\ndescribe("group assessment integrity boundaries", () => {\n  test("generic finalized-result correction remains available only for Individual assessments", () => {\n    expect(() => assertGenericFinalizedCorrectionMode("Individual")).not.toThrow();\n    expect(() => assertGenericFinalizedCorrectionMode("Group")).toThrow(PortalConflictError);\n    expect(() => assertGenericFinalizedCorrectionMode("GroupIndividual")).toThrow(PortalConflictError);\n  });\n\n  test("group rubric criterion score must equal the selected rubric level points", () => {\n    expect(() => assertRubricLevelScoreMatches(4, 4)).not.toThrow();\n    expect(() => assertRubricLevelScoreMatches(3.0000000001, 3)).not.toThrow();\n    expect(() => assertRubricLevelScoreMatches(2, 4)).toThrow(\n      /selected rubric level points do not match the criterion score/i,\n    );\n  });\n});\n''')

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Run focused integrity regressions
        run: bun test apps/backend/src/plugins/student-portal/group-assessment-integrity.test.ts apps/backend/src/plugins/student-portal/group-assessment-results.test.ts apps/backend/src/plugins/student-portal/results-lifecycle.test.ts

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-group-assessment-integrity.yml
          git add -- apps/backend/src/plugins/student-portal/results-lifecycle.ts
          git add -- apps/backend/src/plugins/student-portal/group-assessment-results.ts
          git add -- apps/backend/src/plugins/student-portal/group-assessment-integrity.test.ts
          git commit -m "fix(results): enforce group assessment correction integrity"
          git push origin HEAD:fix/group-assessment-integrity-followup
