name: Agent Epic 638 final integrity

on:
  push:
    branches:
      - agent/epic-638-academic-calendar
    paths:
      - scripts/agent-epic-638-final-integrity.ts
      - .github/workflows/agent-epic-638-final-integrity.yml

permissions:
  contents: write

concurrency:
  group: agent-epic-638-final-integrity
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dse_pms
  NEXT_PUBLIC_AUTH_MODE: supabase
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/epic-638-academic-calendar
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Apply final integrity patch
        run: bun scripts/agent-epic-638-final-integrity.ts
      - name: Verify expected changed files only
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          apps/backend/prisma/migrations/20260825204000_harden_academic_calendar_offering_integrity/migration.sql
          apps/backend/src/plugins/offerings/service.ts
          apps/backend/src/plugins/programme/academic-calendar-integrity-db.test.ts
          apps/backend/src/plugins/programme/academic-calendar-router.test.ts
          apps/backend/src/plugins/programme/academic-calendar-router.ts
          apps/backend/src/plugins/programme/academic-calendar-service.ts
          apps/frontend/app/(shell)/academic-calendar/academic-calendar-simple-client.tsx
          apps/frontend/app/(shell)/offerings/offering-form-page.tsx
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: bun run --cwd apps/backend db:generate
      - name: Validate Prisma schema
        run: bunx prisma validate --schema apps/backend/prisma/schema.prisma
      - name: Focused Academic Calendar tests
        run: >-
          bun test
          apps/backend/src/plugins/programme/academic-calendar-router.test.ts
          apps/backend/src/plugins/programme/academic-calendar-domain.test.ts
          apps/backend/src/plugins/offerings/academic-calendar-contract.test.ts
          packages/shared-types/src/offerings.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test all suites
        run: bun run test
      - name: Verify backend test discovery
        run: bun run test:backend
      - name: Build
        run: bun run build
      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/backend/prisma/migrations/20260825204000_harden_academic_calendar_offering_integrity/migration.sql \
            apps/backend/src/plugins/offerings/service.ts \
            apps/backend/src/plugins/programme/academic-calendar-integrity-db.test.ts \
            apps/backend/src/plugins/programme/academic-calendar-router.test.ts \
            apps/backend/src/plugins/programme/academic-calendar-router.ts \
            apps/backend/src/plugins/programme/academic-calendar-service.ts \
            'apps/frontend/app/(shell)/academic-calendar/academic-calendar-simple-client.tsx' \
            'apps/frontend/app/(shell)/offerings/offering-form-page.tsx'
          git diff --cached --check
          git commit -m "fix(calendar): harden programme and offering boundaries (#638)"
          git push origin HEAD:agent/epic-638-academic-calendar
