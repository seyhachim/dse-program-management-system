name: Issue 540 Bootstrap

on:
  push:
    branches:
      - feat/issue-540-student-roster-import
    paths:
      - ".github/issue-540-bootstrap.py"
      - ".github/workflows/issue-540-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-540-student-roster-import
          fetch-depth: 0
      - run: python .github/issue-540-bootstrap.py
      - run: rm .github/issue-540-bootstrap.py .github/workflows/issue-540-bootstrap.yml
      - run: git diff --check
      - name: Commit schema patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma .github/issue-540-bootstrap.py .github/workflows/issue-540-bootstrap.yml
          git commit -m "feat(student): support optional email and bilingual profile (#540)"
          git push origin HEAD:feat/issue-540-student-roster-import
