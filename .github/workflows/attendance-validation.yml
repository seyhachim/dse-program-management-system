name: Attendance MVP validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:migrate:deploy
      - run: bun run seed
      - name: Verify attendance persistence
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT table_schema, table_name
          FROM information_schema.tables
          WHERE table_schema = 'pms_attendance'
          ORDER BY table_name;

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.tables
              WHERE table_schema = 'pms_attendance' AND table_name = 'AttendanceSession'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.tables
              WHERE table_schema = 'pms_attendance' AND table_name = 'AttendanceRecord'
            ) THEN
              RAISE EXCEPTION 'Attendance persistence tables are missing';
            END IF;
          END $$;
          SQL
