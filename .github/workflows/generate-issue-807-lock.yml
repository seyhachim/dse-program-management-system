name: Generate issue 807 visualization lockfile

on:
  push:
    branches:
      - agent/issue-807-curriculum-credit-chart

permissions:
  contents: write

jobs:
  lockfile:
    name: Refresh Bun lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Resolve dependency lockfile only
        run: bun install --lockfile-only

      - name: Commit generated lockfile and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/generate-issue-807-lock.yml
          git commit -m "chore(frontend): refresh Bun lockfile for visualization"
          git push origin "HEAD:${GITHUB_REF_NAME}"
