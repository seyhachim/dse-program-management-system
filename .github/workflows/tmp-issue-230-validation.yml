name: Validate issue 230 SAR editor

on:
  push:
    branches: [agent/issue-230-structured-sar-editor]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bunx prisma validate --schema apps/backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_ci?schema=public
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  database:
    name: Fresh database migration and seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_ci
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U ci -d dse_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:migrate:deploy
      - run: bun run seed
