name: Staging Auth patched Bun lock refresh (one-shot)
on:
  push:
    branches:
      - feat/1295-neon-staging-auth
    paths:
      - .github/workflows/staging-auth-patched-lock-1295.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1295-neon-staging-auth
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --no-progress
      - name: Assert all Better Auth packages >= 1.7.7
        run: |
          bun -e '
          const raw=await Bun.file("bun.lock").text();
          const lines=raw.split(String.fromCharCode(10));
          for(const name of ["better-auth","@better-auth/core","@better-auth/oauth-provider","@better-auth/drizzle-adapter"]){
            const prefix=String.fromCharCode(34)+name+String.fromCharCode(34)+": ["+String.fromCharCode(34)+name+"@";
            const line=lines.find(l=>l.includes(prefix));
            if(!line) throw new Error("Missing patched package "+name);
            const version=line.split(name+"@")[1].split(String.fromCharCode(34))[0];
            if(version!=="1.7.7")throw new Error("Unpatched "+name+"@"+version);
            console.log("Verified "+name+"@"+version);
          }
          '
      - name: Commit generated Bun lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(staging-auth): resolve patched auth dependencies (#1295)"
            git push origin HEAD:feat/1295-neon-staging-auth
          fi
      - name: Fail-closed production dependency audit
        run: |
          bun audit --production --json > dependency-audit.json || true
          bun scripts/verify-production-dependency-audit.ts dependency-audit.json
      - name: Typecheck
        run: bun run typecheck
