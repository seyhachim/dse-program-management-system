name: tmp-issue-948-apply

on:
  push:
    branches:
      - fix/issue-948-telegram-popular-questions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-948-telegram-popular-questions
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/_tmp_apply_issue_948.py
      - name: Commit scoped implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/plugins/telegram/public-bot/router.ts apps/backend/src/plugins/telegram/public-bot/router.test.ts scripts/_tmp_apply_issue_948.py .github/workflows/tmp-issue-948-apply.yml
          git commit -m "fix(telegram): remove duplicate Popular Questions action (#948)"
          git push
