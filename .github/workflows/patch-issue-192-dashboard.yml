name: Patch issue 192 dashboard
on:
  push:
    branches: [agent/issue-192-qa-cqi-actions]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-192-qa-cqi-actions
      - run: python .github/patch-issue-192-dashboard.py
      - run: |
          git config user.name "seyhachim"
          git config user.email "32429415+seyhachim@users.noreply.github.com"
          git add 'apps/frontend/app/(shell)/qa-dashboard/qa-dashboard-client.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: patch issue 192 dashboard"
          git push origin HEAD:agent/issue-192-qa-cqi-actions
