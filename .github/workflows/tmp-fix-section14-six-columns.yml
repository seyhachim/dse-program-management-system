name: One-shot Section 14 six-column fix

on:
  push:
    branches:
      - fix/issue-766-inline-course-synopsis
    paths:
      - .github/workflows/tmp-fix-section14-six-columns.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
          fetch-depth: 0
      - name: Patch Section 14
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          preview = Path('apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages.tsx')
          source = preview.read_text()
          old = '''        <div className="section14-table"><Table className="text-[10.5px] leading-[1.22]"><colgroup><col className="w-[7%]" /><col className="w-[58%]" /><col className="w-[8%]" /><col className="w-[9%]" /><col className="w-[9%]" /><col className="w-[9%]" /></colgroup><tbody><tr className="section14-header-row"><TH rowSpan={2} colSpan={2} className="bg-[#E2EEDB] text-center font-normal">Description of the course learning outcomes – CLOs. At the end of the course, students will be able to:</TH><TH rowSpan={2} className="bg-[#E2EEDB] text-center font-normal">PLO</TH><TH colSpan={3} className="bg-[#E2EEDB] text-center font-normal">Levels in Learning Domain:<br />Knowledge (Cognitive-C), Attitude<br />(Affective-A), Skills (Psychomotor-P)</TH></tr><tr className="section14-header-row"><TH className="bg-[#E2EEDB] text-center font-normal">C</TH><TH className="bg-[#E2EEDB] text-center font-normal">A</TH><TH className="bg-[#E2EEDB] text-center font-normal">P</TH></tr>{document.clos.length ? document.clos.map((clo) => { const domain = learningDomain(clo.level); return <tr key={clo.code}><TD className="text-center align-middle">{clo.code}</TD><TD className="text-left align-middle">{clo.outcome}</TD><TD className="text-center align-middle">{joinValues(clo.mappedPlos)}</TD><TD className="text-center align-middle">{domain.cognitive || " "}</TD><TD className="text-center align-middle">{domain.affective || " "}</TD><TD className="text-center align-middle">{domain.psychomotor || " "}</TD></tr>; }) : <tr><TD colSpan={6}>No Course Learning Outcomes have been added.</TD></tr>}</tbody></Table></div>'''
          new = '''        <div className="section14-table">
          <Table className="text-[10.5px] leading-[1.22]">
            <colgroup>
              <col style={{ width: "7%" }} />
              <col style={{ width: "58%" }} />
              <col style={{ width: "8%" }} />
              <col style={{ width: "9%" }} />
              <col style={{ width: "9%" }} />
              <col style={{ width: "9%" }} />
            </colgroup>
            <thead>
              <tr className="section14-header-row">
                <TH rowSpan={2} colSpan={2} className="bg-[#E2EEDB] text-center font-normal">
                  Description of the course learning outcomes – CLOs. At the end of the course, students will be able to:
                </TH>
                <TH rowSpan={2} className="bg-[#E2EEDB] text-center font-normal">PLO</TH>
                <TH colSpan={3} className="bg-[#E2EEDB] text-center font-normal">
                  Levels in Learning Domain:<br />Knowledge (Cognitive-C), Attitude<br />(Affective-A), Skills (Psychomotor-P)
                </TH>
              </tr>
              <tr className="section14-header-row">
                <TH className="bg-[#E2EEDB] text-center font-normal">C</TH>
                <TH className="bg-[#E2EEDB] text-center font-normal">A</TH>
                <TH className="bg-[#E2EEDB] text-center font-normal">P</TH>
              </tr>
            </thead>
            <tbody>
              {document.clos.length ? document.clos.map((clo) => {
                const domain = learningDomain(clo.level);
                return <tr key={clo.code}>
                  <TD className="text-center align-middle">{clo.code}</TD>
                  <TD className="text-left align-middle">{clo.outcome}</TD>
                  <TD className="text-center align-middle">{joinValues(clo.mappedPlos)}</TD>
                  <TD className="text-center align-middle">{domain.cognitive || " "}</TD>
                  <TD className="text-center align-middle">{domain.affective || " "}</TD>
                  <TD className="text-center align-middle">{domain.psychomotor || " "}</TD>
                </tr>;
              }) : <tr><TD colSpan={6}>No Course Learning Outcomes have been added.</TD></tr>}
            </tbody>
          </Table>
        </div>'''
          if old not in source:
              raise SystemExit('Section 14 source block not found')
          preview.write_text(source.replace(old, new, 1))

          themed = Path('apps/frontend/app/(shell)/courses/[id]/spec/themed-document-pages.tsx')
          css = themed.read_text()
          old_css = '''        .course-spec-theme-root #clos .section14-table {
          width: 100%;
          max-width: 100%;
          overflow: hidden;
        }

        .course-spec-theme-root #clos .section14-table > table {
          width: 100% !important;
          max-width: 100% !important;
          table-layout: fixed !important;
        }
'''
          new_css = '''        .course-spec-theme-root #clos .section14-table {
          width: 100%;
          max-width: 100%;
          box-sizing: border-box;
        }

        .course-spec-theme-root #clos .section14-table > table {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          table-layout: fixed !important;
          box-sizing: border-box !important;
        }
'''
          if old_css not in css:
              raise SystemExit('Section 14 CSS block not found')
          themed.write_text(css.replace(old_css, new_css, 1))

          layout_test = Path('apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages-layout.test.ts')
          test_source = layout_test.read_text()
          old_test = '''    expect(source).toContain('className="section14-header-row"');
    expect(source).not.toContain('<thead><tr><TH rowSpan={2} colSpan={2}');
'''
          new_test = '''    expect(source).toContain('className="section14-header-row"');
    expect(source).toContain("<thead>");
    expect(source).toContain('<col style={{ width: "7%" }} />');
    expect(source).toContain('<col style={{ width: "58%" }} />');
    expect(source.match(/<col style=\\{\\{ width: "9%" \\}\\} \\/>/g)?.length).toBe(3);
'''
          if old_test not in test_source:
              raise SystemExit('Section 14 layout-test block not found')
          layout_test.write_text(test_source.replace(old_test, new_test, 1))

          style_test = Path('apps/frontend/app/(shell)/courses/[id]/spec/section14-preview-style.test.ts')
          style_source = style_test.read_text()
          old_style_assert = '''    expect(source).toContain("font-size: 8.5pt !important");
'''
          new_style_assert = '''    expect(source).toContain("font-size: 8.5pt !important");
    expect(source).toContain("min-width: 0 !important");
    expect(source).toContain("box-sizing: border-box !important");
'''
          if old_style_assert not in style_source:
              raise SystemExit('Section 14 style-test assertion not found')
          style_test.write_text(style_source.replace(old_style_assert, new_style_assert, 1))
          PY

          git rm .github/workflows/tmp-fix-section14-six-columns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/app/\(shell\)/courses/\[id\]/spec/document-preview-pages.tsx \
                  apps/frontend/app/\(shell\)/courses/\[id\]/spec/themed-document-pages.tsx \
                  apps/frontend/app/\(shell\)/courses/\[id\]/spec/document-preview-pages-layout.test.ts \
                  apps/frontend/app/\(shell\)/courses/\[id\]/spec/section14-preview-style.test.ts
          git commit -m "fix(course-spec): guarantee all six CLO columns"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
