name: One-shot Section 14 six-column fix
on:
  push:
    branches: [fix/issue-766-inline-course-synopsis]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
          fetch-depth: 0
      - name: Patch Section 14 six-column table
        run: |
          python - <<'PY'
          from pathlib import Path

          preview = Path('apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages.tsx')
          source = preview.read_text()
          old = '''        <div className="section14-table"><Table className="text-[10.5px] leading-[1.22]"><colgroup><col className="w-[7%]" /><col className="w-[58%]" /><col className="w-[8%]" /><col className="w-[9%]" /><col className="w-[9%]" /><col className="w-[9%]" /></colgroup><tbody><tr className="section14-header-row"><TH rowSpan={2} colSpan={2} className="bg-[#E2EEDB] text-center font-normal">Description of the course learning outcomes – CLOs. At the end of the course, students will be able to:</TH><TH rowSpan={2} className="bg-[#E2EEDB] text-center font-normal">PLO</TH><TH colSpan={3} className="bg-[#E2EEDB] text-center font-normal">Levels in Learning Domain:<br />Knowledge (Cognitive-C), Attitude<br />(Affective-A), Skills (Psychomotor-P)</TH></tr><tr className="section14-header-row"><TH className="bg-[#E2EEDB] text-center font-normal">C</TH><TH className="bg-[#E2EEDB] text-center font-normal">A</TH><TH className="bg-[#E2EEDB] text-center font-normal">P</TH></tr>{document.clos.length ? document.clos.map((clo) => { const domain = learningDomain(clo.level); return <tr key={clo.code}><TD className="text-center align-middle">{clo.code}</TD><TD className="text-left align-middle">{clo.outcome}</TD><TD className="text-center align-middle">{joinValues(clo.mappedPlos)}</TD><TD className="text-center align-middle">{domain.cognitive || " "}</TD><TD className="text-center align-middle">{domain.affective || " "}</TD><TD className="text-center align-middle">{domain.psychomotor || " "}</TD></tr>; }) : <tr><TD colSpan={6}>No Course Learning Outcomes have been added.</TD></tr>}</tbody></Table></div>'''
          new = '''        <div className="section14-table">
          <Table className="text-[10.5px] leading-[1.22]">
            <colgroup>
              <col style={{ width: "7%" }} />
              <col style={{ width: "58%" }} />
              <col style={{ width: "8%" }} />
              <col style={{ width: "9%" }} />
              <col style={{ width: "9%" }} />
              <col style={{ width: "9%" }} />
            </colgroup>
            <thead>
              <tr className="section14-header-row">
                <TH rowSpan={2} colSpan={2} className="bg-[#E2EEDB] text-center font-normal">Description of the course learning outcomes – CLOs. At the end of the course, students will be able to:</TH>
                <TH rowSpan={2} className="bg-[#E2EEDB] text-center font-normal">PLO</TH>
                <TH colSpan={3} className="bg-[#E2EEDB] text-center font-normal">Levels in Learning Domain:<br />Knowledge (Cognitive-C), Attitude<br />(Affective-A), Skills (Psychomotor-P)</TH>
              </tr>
              <tr className="section14-header-row">
                <TH className="bg-[#E2EEDB] text-center font-normal">C</TH>
                <TH className="bg-[#E2EEDB] text-center font-normal">A</TH>
                <TH className="bg-[#E2EEDB] text-center font-normal">P</TH>
              </tr>
            </thead>
            <tbody>
              {document.clos.length ? document.clos.map((clo) => {
                const domain = learningDomain(clo.level);
                return <tr key={clo.code}><TD className="text-center align-middle">{clo.code}</TD><TD className="text-left align-middle">{clo.outcome}</TD><TD className="text-center align-middle">{joinValues(clo.mappedPlos)}</TD><TD className="text-center align-middle">{domain.cognitive || " "}</TD><TD className="text-center align-middle">{domain.affective || " "}</TD><TD className="text-center align-middle">{domain.psychomotor || " "}</TD></tr>;
              }) : <tr><TD colSpan={6}>No Course Learning Outcomes have been added.</TD></tr>}
            </tbody>
          </Table>
        </div>'''
          if old not in source:
              raise SystemExit('Section 14 source block not found')
          preview.write_text(source.replace(old, new, 1))

          theme = Path('apps/frontend/app/(shell)/courses/[id]/spec/themed-document-pages.tsx')
          css = theme.read_text()
          old_css = '''        .course-spec-theme-root #clos .section14-table {\n          width: 100%;\n          max-width: 100%;\n          overflow: hidden;\n        }\n\n        .course-spec-theme-root #clos .section14-table > table {\n          width: 100% !important;\n          max-width: 100% !important;\n          table-layout: fixed !important;\n        }\n'''
          new_css = '''        .course-spec-theme-root #clos .section14-table {\n          width: 100%;\n          max-width: 100%;\n          box-sizing: border-box;\n        }\n\n        .course-spec-theme-root #clos .section14-table > table {\n          width: 100% !important;\n          max-width: 100% !important;\n          min-width: 0 !important;\n          table-layout: fixed !important;\n          box-sizing: border-box !important;\n        }\n'''
          if old_css not in css:
              raise SystemExit('Section 14 CSS block not found')
          theme.write_text(css.replace(old_css, new_css, 1))

          test = Path('apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages-layout.test.ts')
          t = test.read_text()
          old_test = '''    expect(source).toContain('className="section14-header-row"');\n    expect(source).not.toContain('<thead><tr><TH rowSpan={2} colSpan={2}');\n'''
          new_test = '''    expect(source).toContain('className="section14-header-row"');\n    expect(source).toContain("<thead>");\n    expect(source).toContain('<col style={{ width: "7%" }} />');\n    expect(source).toContain('<col style={{ width: "58%" }} />');\n    expect(source.match(/<col style=\\{\\{ width: "9%" \\}\\} \\/>/g)?.length).toBe(3);\n'''
          if old_test not in t:
              raise SystemExit('Section 14 layout test target not found')
          test.write_text(t.replace(old_test, new_test, 1))

          style_test = Path('apps/frontend/app/(shell)/courses/[id]/spec/section14-preview-style.test.ts')
          st = style_test.read_text()
          marker = '    expect(source).toContain("font-size: 8.5pt !important");\n'
          insert = marker + '    expect(source).toContain("min-width: 0 !important");\n    expect(source).toContain("box-sizing: border-box !important");\n'
          if marker not in st:
              raise SystemExit('Section 14 style test marker not found')
          style_test.write_text(st.replace(marker, insert, 1))
          PY
          rm .github/workflows/tmp-fix-section14-six-columns.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(course-spec): guarantee all six CLO columns"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
