name: Issue 540 Security Patch

on:
  push:
    branches:
      - feat/issue-540-student-roster-import
    paths:
      - ".github/issue-540-security-patch.py"
      - ".github/workflows/issue-540-security-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-540-student-roster-import
          fetch-depth: 0
      - run: python .github/issue-540-security-patch.py
      - run: rm .github/issue-540-security-patch.py .github/workflows/issue-540-security-patch.yml
      - run: git diff --check
      - name: Commit security inventory patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/scripts/verify-db-security.ts .github/issue-540-security-patch.py .github/workflows/issue-540-security-patch.yml
          git commit -m "fix(student): classify StudentProfile in DB security (#540)"
          git push origin HEAD:feat/issue-540-student-roster-import
