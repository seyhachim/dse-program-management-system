name: Issue 703 security inventory patch

on:
  push:
    branches:
      - agent/issue-703-temp-password-recovery

permissions:
  contents: write

jobs:
  patch-security-inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-703-temp-password-recovery
      - name: Classify recovery audit table
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/backend/scripts/verify-db-security.ts')
          text = path.read_text()
          if '  "UserSecurityAuditEvent",\n' not in text:
              marker = '  "User",\n  "LecturerProfile",'
              replacement = '  "User",\n  "UserSecurityAuditEvent",\n  "LecturerProfile",'
              if marker not in text:
                  raise SystemExit('public table inventory marker not found')
              text = text.replace(marker, replacement, 1)
              path.write_text(text)
          PY
      - name: Commit security inventory patch
        run: |
          if git diff --quiet -- apps/backend/scripts/verify-db-security.ts; then
            echo "Inventory already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/scripts/verify-db-security.ts
          git commit -m "fix(security): classify account recovery audit table"
          git push origin HEAD:agent/issue-703-temp-password-recovery
