name: Apply issue 766 Section 16 preview fix

on:
  push:
    branches:
      - fix/issue-766-inline-course-synopsis

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
      - name: Apply Section 16 preview fix
        run: python scripts/issue766-section16-preview-fix.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/app/\(shell\)/courses/\[id\]/spec/document-preview-pages.tsx apps/frontend/app/\(shell\)/courses/\[id\]/spec/themed-document-pages.tsx apps/frontend/app/\(shell\)/courses/\[id\]/spec/document-preview-pages-layout.test.ts apps/frontend/app/\(shell\)/courses/\[id\]/spec/section16-preview-style.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(course-spec): match approved Section 16 SLT layout"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
