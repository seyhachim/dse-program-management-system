name: Issue 333 final tidy

on:
  push:
    branches:
      - agent/issue-333-finalized-result-corrections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-333-finalized-result-corrections
      - name: Wire security inventory and self-contained DB test secret
        run: |
          python - <<'PY'
          from pathlib import Path

          security = Path('apps/backend/scripts/verify-db-security.ts')
          text = security.read_text()
          old = '  "AssessmentResult",\n  "AssessmentCriterionScore",\n'
          new = '  "AssessmentResult",\n  "AssessmentResultCorrection",\n  "AssessmentCriterionScore",\n'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one security inventory marker')
          security.write_text(text.replace(old, new, 1))

          test = Path('apps/backend/src/plugins/student-portal/results-lifecycle-db.test.ts')
          text = test.read_text()
          old = 'const runDbTests = process.env.RESULT_CORRECTION_DB_TESTS === "1";\n'
          new = 'process.env.JWT_SECRET ??= "issue-333-result-correction-test-secret-at-least-32-characters";\n\nconst runDbTests = process.env.RESULT_CORRECTION_DB_TESTS === "1";\n'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one DB test guard marker')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Commit tidy-up and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-333-final-tidy.yml
          git add apps/backend/scripts/verify-db-security.ts apps/backend/src/plugins/student-portal/results-lifecycle-db.test.ts
          git diff --cached --check
          git commit -m "test(results): wire correction security verification"
          git push origin HEAD:agent/issue-333-finalized-result-corrections
