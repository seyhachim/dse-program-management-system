name: PR375 rebase onto current main

on:
  push:
    branches:
      - agent/issue-371-curriculum-import
    paths:
      - .github/workflows/pr375-schema-rebase.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-371-curriculum-import
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase and preserve reconciled DB security inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          GIT_EDITOR=true git rebase origin/main
          status=$?
          set -e

          while [ "$status" -ne 0 ]; do
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort -u)
            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "Rebase failed without merge conflicts"
              exit "$status"
            fi

            unhandled=0
            for file in "${conflicts[@]}"; do
              case "$file" in
                apps/backend/scripts/verify-db-security.ts)
                  # During rebase, --theirs is the #375 commit being replayed.
                  # That version already contains main's QA/CourseSpec/attendance
                  # inventory plus the new pathway/curriculum_artifact entries.
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unhandled rebase conflict: $file"
                  unhandled=1
                  ;;
              esac
            done

            if [ "$unhandled" -ne 0 ]; then
              exit 1
            fi

            set +e
            GIT_EDITOR=true git rebase --continue
            status=$?
            set -e
          done

          git push --force-with-lease origin HEAD:agent/issue-371-curriculum-import
