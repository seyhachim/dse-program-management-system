name: PR375 rebase conflict probe

on:
  push:
    branches:
      - agent/issue-371-curriculum-import
    paths:
      - .github/workflows/pr375-schema-rebase.yml

permissions:
  contents: write

jobs:
  probe-rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-371-curriculum-import
          fetch-depth: 0
          persist-credentials: true

      - name: Probe rebase and publish conflicts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          GIT_EDITOR=true git rebase origin/main
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git push --force-with-lease origin HEAD:agent/issue-371-curriculum-import
            exit 0
          fi

          git diff --name-only --diff-filter=U | sort -u > /tmp/conflicts.txt
          git rebase --abort
          mkdir -p docs
          {
            echo "PR #375 rebase conflict probe"
            echo "main: $(git rev-parse origin/main)"
            echo "branch-before-rebase: $(git rev-parse HEAD)"
            echo "conflicts:"
            cat /tmp/conflicts.txt
          } > docs/pr375-rebase-conflicts.txt
          git add docs/pr375-rebase-conflicts.txt
          git commit -m "chore(curriculum): record rebase conflicts"
          git push origin HEAD:agent/issue-371-curriculum-import
          exit 1
