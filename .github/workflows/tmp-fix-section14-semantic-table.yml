name: One-shot Section 14 semantic table fix
on:
  push:
    branches:
      - fix/issue-766-inline-course-synopsis
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
          fetch-depth: 0
      - name: Move grouped CLO header into thead
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages.tsx')
          text = path.read_text()
          start = '<colgroup><col className="w-[7%]" /><col className="w-[58%]" /><col className="w-[8%]" /><col className="w-[9%]" /><col className="w-[9%]" /><col className="w-[9%]" /></colgroup><tbody><tr className="section14-header-row">'
          start_new = '<colgroup><col className="w-[7%]" /><col className="w-[58%]" /><col className="w-[8%]" /><col className="w-[9%]" /><col className="w-[9%]" /><col className="w-[9%]" /></colgroup><thead><tr className="section14-header-row">'
          split = '<TH className="bg-[#E2EEDB] text-center font-normal">P</TH></tr>{document.clos.length ?'
          split_new = '<TH className="bg-[#E2EEDB] text-center font-normal">P</TH></tr></thead><tbody>{document.clos.length ?'
          if start not in text:
              raise SystemExit('Section 14 header start not found')
          if split not in text:
              raise SystemExit('Section 14 header/body split not found')
          text = text.replace(start, start_new, 1).replace(split, split_new, 1)
          path.write_text(text)

          test = Path('apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages-layout.test.ts')
          t = test.read_text()
          old = "    expect(source).not.toContain('<thead><tr><TH rowSpan={2} colSpan={2}');\n"
          if old in t:
              t = t.replace(old, "    expect(source).toContain('<thead><tr className=\\\"section14-header-row\\\">');\n    expect(source).toContain('</thead><tbody>{document.clos.length ?');\n", 1)
          else:
              marker = "    expect(source).toContain('className=\"section14-header-row\"');\n"
              if marker not in t:
                  raise SystemExit('Section 14 test marker not found')
              t = t.replace(marker, marker + "    expect(source).toContain('<thead><tr className=\\\"section14-header-row\\\">');\n    expect(source).toContain('</thead><tbody>{document.clos.length ?');\n", 1)
          test.write_text(t)
          PY
          git rm .github/workflows/tmp-fix-section14-semantic-table.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(course-spec): render CLO learning domains as six-column table"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
