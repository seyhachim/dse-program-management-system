name: Temporary Dashboard Filter Patch

on:
  push:
    branches:
      - fix/course-spec-part1-plo-row
    paths:
      - .github/workflows/temp-dashboard-filter-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/course-spec-part1-plo-row
          fetch-depth: 0
      - run: python scripts/temp_patch_dashboard_incomplete_filter.py
      - run: git diff --check
      - name: Commit filter helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(dashboard): cover incomplete course filtering"
          git push origin HEAD:fix/course-spec-part1-plo-row
