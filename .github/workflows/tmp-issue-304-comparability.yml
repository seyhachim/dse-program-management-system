name: Harden issue 304 longitudinal comparability

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-304-programme-outcome-indicators
      - name: Require stable definition and calculation version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/backend/src/plugins/qa/analysis/deterministic-engine.ts')
          text = p.read_text()
          old = '''function candidateComparisonKey(candidate: Candidate): string {
            for (const key of ["definitionHash", "definitionVersion", "calculationVersion"] as const) {
              const value = candidate.attributes[key];
              if (typeof value === "string" && value.trim()) return `${key}:${value.trim()}`;
            }
            return "legacy-compatible-definition";
          }'''
          new = '''function candidateComparisonKey(candidate: Candidate): string {
            const definitionHash = candidate.attributes.definitionHash;
            const definitionVersion = candidate.attributes.definitionVersion;
            const calculationVersion = candidate.attributes.calculationVersion;
            const definitionFingerprint =
              typeof definitionHash === "string" && definitionHash.trim()
                ? `hash:${definitionHash.trim()}`
                : typeof definitionVersion === "string" && definitionVersion.trim()
                  ? `version:${definitionVersion.trim()}`
                  : "legacy-definition";
            const calculationFingerprint =
              typeof calculationVersion === "string" && calculationVersion.trim()
                ? calculationVersion.trim()
                : "legacy-calculation";
            return `${definitionFingerprint}|calculation:${calculationFingerprint}`;
          }'''
          if text.count(old) != 1:
              raise SystemExit('candidateComparisonKey anchor not found exactly once')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/plugins/qa/analysis/deterministic-engine.ts
          git commit -m "fix(qa): keep calculation versions longitudinally distinct (#304)"
          git pull --rebase origin agent/issue-304-programme-outcome-indicators
          git push origin HEAD:agent/issue-304-programme-outcome-indicators
