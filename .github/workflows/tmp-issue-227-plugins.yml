name: Patch issue 227 QA manifest

on:
  push:
    branches: [agent/issue-227-aun-qa-workspace]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-227-aun-qa-workspace
      - run: python .github/patch-issue-227-plugins.py
      - name: Commit manifest patch if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared-types/src/plugins.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: expose role-aware AUN-QA workspace navigation"
          git push origin HEAD:agent/issue-227-aun-qa-workspace
