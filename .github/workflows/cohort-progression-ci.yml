name: Cohort Progression Integrity

on:
  pull_request:
    paths:
      - "apps/backend/prisma/schema.prisma"
      - "apps/backend/prisma/migrations/**"
      - "apps/backend/src/plugins/students/**"
      - "apps/backend/src/plugins/qa/evidence/**"
      - "apps/backend/scripts/verify-db-security.ts"
      - "apps/frontend/app/(shell)/students/cohorts/**"
      - "apps/frontend/app/(shell)/programme-management/page.tsx"
      - "apps/frontend/lib/student-cohorts.ts"
      - "packages/shared-types/src/student-progression*"
      - "packages/shared-types/src/qa-evidence-candidates.ts"
      - ".github/actions/setup-bun/action.yml"
      - ".github/workflows/cohort-progression-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/prisma/schema.prisma"
      - "apps/backend/prisma/migrations/**"
      - "apps/backend/src/plugins/students/**"
      - "apps/backend/src/plugins/qa/evidence/**"
      - "apps/backend/scripts/verify-db-security.ts"
      - "apps/frontend/app/(shell)/students/cohorts/**"
      - "apps/frontend/app/(shell)/programme-management/page.tsx"
      - "apps/frontend/lib/student-cohorts.ts"
      - "packages/shared-types/src/student-progression*"
      - "packages/shared-types/src/qa-evidence-candidates.ts"
      - ".github/actions/setup-bun/action.yml"
      - ".github/workflows/cohort-progression-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Cohort/progression DB invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_cohort_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_cohort_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_cohort_ci?schema=public
      COHORT_PROGRESSION_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run db:generate
      - run: bunx prisma validate --schema apps/backend/prisma/schema.prisma
      - run: bun run db:migrate:deploy
      - run: bun run seed
      - run: bun run --cwd apps/backend db:security:verify
      - name: Verify cohort contracts
        run: bun test packages/shared-types/src/student-progression.test.ts
      - name: Verify cohort membership, progression history, promotion, authorization, and QA retrieval
        run: bun test apps/backend/src/plugins/students/cohort-progression-db.test.ts apps/backend/src/plugins/students/cohort-promotion-db.test.ts apps/backend/src/plugins/students/cohort-promotion-authorization.test.ts
