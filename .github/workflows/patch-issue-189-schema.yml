name: Patch issue 189 Prisma schema

on:
  push:
    branches:
      - agent/issue-189-qa-document-retrieval

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-189-qa-document-retrieval
      - run: python .github/patch-issue-189-schema.py
      - name: Commit schema patch if changed
        run: |
          git config user.name "seyhachim"
          git config user.email "32429415+seyhachim@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: patch issue 189 Prisma schema"
          git push origin HEAD:agent/issue-189-qa-document-retrieval
