name: Patch issue 187 Prisma schema

on:
  push:
    branches:
      - agent/issue-187-qa-analysis-provenance

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: patch issue 187 Prisma schema'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-187-qa-analysis-provenance
      - name: Patch schema
        run: python .github/patch-issue-187-schema.py
      - name: Commit schema patch
        run: |
          git config user.name "seyhachim"
          git config user.email "32429415+seyhachim@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma
          git diff --cached --quiet && exit 0
          git commit -m "chore: patch issue 187 Prisma schema"
          git push origin HEAD:agent/issue-187-qa-analysis-provenance
