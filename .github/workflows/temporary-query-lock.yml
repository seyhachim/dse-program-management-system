name: Temporary Query Lock Generator

on:
  push:
    branches:
      - agent/issue-738-query-cache

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Resolve workspace lockfile
        run: bun install --ignore-scripts
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: update Bun lockfile for TanStack Query"
          git push origin HEAD:agent/issue-738-query-cache
