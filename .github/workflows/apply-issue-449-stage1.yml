name: Apply Issue 449 Stage 1

# Temporary same-repo patch runner; the patch deletes this workflow after applying.
on:
  push:
    branches:
      - agent/issue-449-group-assessment-results
    paths:
      - ".github/scripts/apply_issue_449_stage1.py"
      - ".github/workflows/apply-issue-449-stage1.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/apply_issue_449_stage1.py"
      - ".github/workflows/apply-issue-449-stage1.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-449-group-assessment-results
          fetch-depth: 0
      - name: Fix guarded two-location portal mode assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_issue_449_stage1.py')
          text = path.read_text()
          old = '''replace_once(portal, 'mode: "individual" | "group";', 'mode: "individual" | "group" | "group_individual";')
          # The same declaration appears twice (detail and overview). Replace the second too.
          text = read(portal)
          text = text.replace('mode: "individual" | "group";', 'mode: "individual" | "group" | "group_individual";')
          write(portal, text)'''
          new = '''text = read(portal)
          mode_old = 'mode: "individual" | "group";'
          if text.count(mode_old) != 2:
              raise RuntimeError(f"{portal}: expected two assessment mode declarations, found {text.count(mode_old)}")
          text = text.replace(mode_old, 'mode: "individual" | "group" | "group_individual";')
          write(portal, text)'''
          if old not in text:
              raise SystemExit('Expected portal mode patch block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply guarded backend patch
        run: python .github/scripts/apply_issue_449_stage1.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(results): add group assessment backend foundation"
          git push origin HEAD:agent/issue-449-group-assessment-results
