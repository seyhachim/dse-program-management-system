name: Apply Issue 449 Stage 1

# Temporary same-repo patch runner; workflow/script cleanup is performed separately.
on:
  push:
    branches:
      - agent/issue-449-group-assessment-results
    paths:
      - ".github/scripts/apply_issue_449_stage1.py"
      - ".github/workflows/apply-issue-449-stage1.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/apply_issue_449_stage1.py"
      - ".github/workflows/apply-issue-449-stage1.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-449-group-assessment-results
          fetch-depth: 0
      - name: Align guarded patch with current main formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_issue_449_stage1.py')
          text = path.read_text()

          def swap(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Expected {label} patch block not found')
              text = text.replace(old, new, 1)

          swap('''replace_once(portal, 'mode: "individual" | "group";', 'mode: "individual" | "group" | "group_individual";')
          # The same declaration appears twice (detail and overview). Replace the second too.
          text = read(portal)
          text = text.replace('mode: "individual" | "group";', 'mode: "individual" | "group" | "group_individual";')
          write(portal, text)''', '''text = read(portal)
          mode_old = 'mode: "individual" | "group";'
          if text.count(mode_old) != 2:
              raise RuntimeError(f"{portal}: expected two assessment mode declarations, found {text.count(mode_old)}")
          text = text.replace(mode_old, 'mode: "individual" | "group" | "group_individual";')
          write(portal, text)''', 'portal mode')

          swap('''replace_once(
              courses_service,
              '        mode: item.mode === "group" ? ("Group" as const) : ("Individual" as const),\\n',
              '        mode: item.mode === "group" ? ("Group" as const) : item.mode === "group_individual" ? ("GroupIndividual" as const) : ("Individual" as const),\\n'
              '        groupWeight: item.mode === "group_individual" ? item.groupWeight : null,\\n'
              '        individualWeight: item.mode === "group_individual" ? item.individualWeight : null,\\n'
              '        individualCriterionIds: item.mode === "group_individual" ? item.individualCriterionIds : [],\\n',
          )''', '''replace_once(
              courses_service,
              '      mode:\\n        item.mode === "group" ? ("Group" as const) : ("Individual" as const),\\n',
              '      mode:\\n'
              '        item.mode === "group"\\n'
              '          ? ("Group" as const)\\n'
              '          : item.mode === "group_individual"\\n'
              '            ? ("GroupIndividual" as const)\\n'
              '            : ("Individual" as const),\\n'
              '      groupWeight: item.mode === "group_individual" ? item.groupWeight : null,\\n'
              '      individualWeight: item.mode === "group_individual" ? item.individualWeight : null,\\n'
              '      individualCriterionIds: item.mode === "group_individual" ? item.individualCriterionIds : [],\\n',
          )''', 'CourseSpec persistence')

          swap('''replace_once(
              lifecycle,
              '  async publishAssessment(\\n    authorId: string,\\n    programmeWide: boolean,\\n    input: PublishAssessmentResultsInput,\\n  ): Promise<PublishAssessmentResultsResponse> {\\n    return prisma.$transaction(async (tx) => {\\n',
              '  async publishAssessment(\\n    authorId: string,\\n    programmeWide: boolean,\\n    input: PublishAssessmentResultsInput,\\n  ): Promise<PublishAssessmentResultsResponse> {\\n'
              '    if (await groupAssessmentService.modeFor(authorId, programmeWide, input) !== "Individual") {\\n'
              '      return groupAssessmentService.publishAssessment(authorId, programmeWide, input);\\n'
              '    }\\n'
              '    return prisma.$transaction(async (tx) => {\\n',
          )''', '''replace_once(
              lifecycle,
              '  async publishAssessment(\\n    authorId: string,\\n    programmeWide: boolean,\\n    input: PublishAssessmentResultsInput,\\n  ): Promise<PublishAssessmentResultsResponse> {\\n    const { offering, spec, assessment } = await offeringLifecycleContext(\\n',
              '  async publishAssessment(\\n    authorId: string,\\n    programmeWide: boolean,\\n    input: PublishAssessmentResultsInput,\\n  ): Promise<PublishAssessmentResultsResponse> {\\n'
              '    if (await groupAssessmentService.modeFor(authorId, programmeWide, input) !== "Individual") {\\n'
              '      return groupAssessmentService.publishAssessment(authorId, programmeWide, input);\\n'
              '    }\\n'
              '    const { offering, spec, assessment } = await offeringLifecycleContext(\\n',
          )''', 'publish lifecycle')

          swap('''replace_once(
              lifecycle,
              '  async finalizeAssessment(\\n    authorId: string,\\n    programmeWide: boolean,\\n    input: FinalizeAssessmentResultsInput,\\n  ): Promise<FinalizeAssessmentResultsResponse> {\\n    return prisma.$transaction(async (tx) => {\\n',
              '  async finalizeAssessment(\\n    authorId: string,\\n    programmeWide: boolean,\\n    input: FinalizeAssessmentResultsInput,\\n  ): Promise<FinalizeAssessmentResultsResponse> {\\n'
              '    if (await groupAssessmentService.modeFor(authorId, programmeWide, input) !== "Individual") {\\n'
              '      return groupAssessmentService.finalizeAssessment(authorId, programmeWide, input);\\n'
              '    }\\n'
              '    return prisma.$transaction(async (tx) => {\\n',
          )''', '''replace_once(
              lifecycle,
              '  async finalizeAssessment(\\n    authorId: string,\\n    programmeWide: boolean,\\n    input: FinalizeAssessmentResultsInput,\\n  ): Promise<FinalizeAssessmentResultsResponse> {\\n    const { offering, spec, assessment } = await offeringLifecycleContext(\\n',
              '  async finalizeAssessment(\\n    authorId: string,\\n    programmeWide: boolean,\\n    input: FinalizeAssessmentResultsInput,\\n  ): Promise<FinalizeAssessmentResultsResponse> {\\n'
              '    if (await groupAssessmentService.modeFor(authorId, programmeWide, input) !== "Individual") {\\n'
              '      return groupAssessmentService.finalizeAssessment(authorId, programmeWide, input);\\n'
              '    }\\n'
              '    const { offering, spec, assessment } = await offeringLifecycleContext(\\n',
          )''', 'finalize lifecycle')

          path.write_text(text)
          PY
      - name: Apply guarded backend patch
        run: python .github/scripts/apply_issue_449_stage1.py
      - name: Commit product implementation only
        run: |
          # The runner token may push source code but cannot mutate workflow files.
          # Restore temporary staging files and ci.yml; they are cleaned up/updated separately.
          git restore --source=HEAD -- .github/scripts/apply_issue_449_stage1.py .github/workflows/apply-issue-449-stage1.yml .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(results): add group assessment backend foundation"
          git push origin HEAD:agent/issue-449-group-assessment-results
