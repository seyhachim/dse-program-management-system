name: Patch issue 193 clean schema

on:
  push:
    branches:
      - agent/issue-193-qa-research-evaluation-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-193-qa-research-evaluation-clean
      - run: python .github/patch-issue-193-clean.py
      - run: |
          git config user.name "seyhachim"
          git config user.email "32429415+seyhachim@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add QA research evaluation Prisma models"
          git push origin HEAD:agent/issue-193-qa-research-evaluation-clean
