name: Issue 542 Bootstrap

on:
  push:
    branches: [feat/issue-542-student-cohort-promotion]
    paths:
      - ".github/issue-542-bootstrap.py"
      - ".github/workflows/issue-542-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-542-student-cohort-promotion
      - run: python .github/issue-542-bootstrap.py
      - name: Remove bootstrap files
        run: rm .github/issue-542-bootstrap.py .github/workflows/issue-542-bootstrap.yml
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(students): persist promotion programme year"
          git push origin HEAD:feat/issue-542-student-cohort-promotion
