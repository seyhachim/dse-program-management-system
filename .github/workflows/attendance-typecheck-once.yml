name: One-shot attendance typecheck correction
on:
  push:
    branches:
      - fix/1121-attendance-draft-recovery
    paths:
      - .github/workflows/attendance-typecheck-once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1121-attendance-draft-recovery
          persist-credentials: true
      - name: Correct exact failing assertion and remove runner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/backend/src/plugins/offerings/attendance-service-db.test.ts')
          s = p.read_text()
          old = 'expect(["first", "second"]).toContain(stored[0]?.note);'
          assert s.count(old) == 1, 'Expected one assertion to fix'
          p.write_text(s.replace(old, 'expect(["first", "second"]).toContain(stored[0]?.note ?? "");'))
          Path('.github/workflows/attendance-typecheck-once.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(attendance): narrow nullable stored note in concurrency assertion'
          git push origin HEAD:fix/1121-attendance-draft-recovery
