name: Generate issue 809 security lockfile

on:
  push:
    branches:
      - fix/issue-809-dependency-advisories

permissions:
  contents: write

jobs:
  lockfile:
    name: Refresh patched Bun lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Resolve patched dependency lockfile only
        run: bun install --lockfile-only

      - name: Verify patched dependency versions
        shell: bash
        run: |
          grep -q '"browserslist": \["browserslist@4\.28\.[7-9]' bun.lock
          grep -q '"qs": \["qs@6\.16\.0"' bun.lock

      - name: Commit generated lockfile and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/generate-issue-809-lock.yml
          git commit -m "chore(security): refresh patched Bun lockfile (#809)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
