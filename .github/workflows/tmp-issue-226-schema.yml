name: Patch issue 226 Prisma schema

on:
  push:
    branches: [agent/issue-226-qa-requirement-assignments]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-226-qa-requirement-assignments
      - run: python .github/patch-issue-226-schema.py
      - name: Commit schema patch if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: register requirement assignments in Prisma schema"
          git push origin HEAD:agent/issue-226-qa-requirement-assignments
