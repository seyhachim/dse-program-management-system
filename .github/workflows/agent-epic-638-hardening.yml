name: Agent Epic 638 hardening

on:
  push:
    branches:
      - agent/epic-638-academic-calendar
    paths:
      - scripts/agent-epic-638-hardening.ts
      - .github/workflows/agent-epic-638-hardening.yml

permissions:
  contents: write

concurrency:
  group: agent-epic-638-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/dse_ci?schema=public
      NEXT_PUBLIC_AUTH_MODE: supabase
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic-638-academic-calendar
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun scripts/agent-epic-638-hardening.ts
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bunx prisma validate --schema apps/backend/prisma/schema.prisma
      - run: bun test packages/shared-types/src/offerings.test.ts apps/backend/src/plugins/offerings/academic-calendar-contract.test.ts apps/backend/src/plugins/programme/academic-calendar-domain.test.ts apps/backend/src/plugins/programme/academic-calendar-router.test.ts
      - run: bun run typecheck
      - name: Commit hardened implementation and remove bootstrap files
        run: |
          rm scripts/agent-epic-638-hardening.ts .github/workflows/agent-epic-638-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(calendar): harden canonical calendar integrity (#638)"
          git push origin HEAD:agent/epic-638-academic-calendar
