name: CLO Attainment Snapshot Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/prisma/schema.prisma"
      - "apps/backend/prisma/migrations/**"
      - "apps/backend/src/plugins/qa/evidence/**"
      - "apps/backend/scripts/verify-db-security.ts"
      - "packages/shared-types/src/qa-evidence-candidates.ts"
      - ".github/workflows/clo-attainment-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/prisma/schema.prisma"
      - "apps/backend/prisma/migrations/**"
      - "apps/backend/src/plugins/qa/evidence/**"
      - "apps/backend/scripts/verify-db-security.ts"
      - "packages/shared-types/src/qa-evidence-candidates.ts"
      - ".github/workflows/clo-attainment-ci.yml"

permissions:
  contents: read

jobs:
  clo-attainment-db-integrity:
    name: CLO attainment DB invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_clo_attainment_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_clo_attainment_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_clo_attainment_ci?schema=public
      CLO_ATTAINMENT_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:migrate:deploy
      - run: bun run seed
      - name: Verify immutable reproducible CLO attainment snapshots
        run: bun test apps/backend/src/plugins/qa/evidence/clo-attainment-db.test.ts
