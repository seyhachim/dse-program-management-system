name: Issue 678 code patch

on:
  push:
    branches: [agent/issue-678-staff-information-import]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-678-staff-information-import
      - name: Apply focused patches
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'Anchor not found: {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, count))

          # AUN-QA export: derive career-period context rather than storing a flag.
          path = 'apps/backend/src/plugins/lecturers/portfolio-service.ts'
          replace(path,
              '  CreateLecturerPortfolioItemInput,\n',
              '  CreateLecturerPortfolioItemInput,\n  classifyLecturerEvidencePeriod,\n')
          replace(path,
              '        yearsOfExperience: profile.professionalProfile?.yearsOfExperience ?? null,\n',
              '        yearsOfExperience: profile.professionalProfile?.yearsOfExperience ?? null,\n        programmeStartDate: profile.professionalProfile?.programmeStartDate ?? null,\n')
          replace(path,
              '          verification: "authoritative_pms" as const,\n',
              '          verification: "authoritative_pms" as const,\n          periodContext: "during_dse" as const,\n')
          replace(path,
              '            verification: item.verificationStatus === "verified"\n              ? "verified_professional" as const\n              : "self_declared" as const,\n',
              '            verification: item.verificationStatus === "verified"\n              ? "verified_professional" as const\n              : "self_declared" as const,\n            periodContext: classifyLecturerEvidencePeriod(\n              item.startDate,\n              profile.professionalProfile?.programmeStartDate,\n            ),\n')

          # Lecturer-owned portfolio hero/profile fields.
          path = 'apps/frontend/app/(shell)/lecturer-portfolio/lecturer-portfolio-client.tsx'
          replace(path,
              'import { lecturersApi } from "@/lib/lecturers";\n',
              'import { lecturersApi } from "@/lib/lecturers";\nimport { LecturerAvatar } from "@/components/lecturer-avatar";\n')
          replace(path,
              '  const initials = lecturer.name\n    .split(/\\s+/)\n    .filter(Boolean)\n    .slice(0, 2)\n    .map((part) => part[0]?.toUpperCase())\n    .join("");\n',
              '')
          replace(path,
              '          <div className="flex h-20 w-20 shrink-0 items-center justify-center rounded-full border border-primary/15 bg-primary/10 text-xl font-semibold text-primary">\n            {initials || "L"}\n          </div>\n',
              '          <LecturerAvatar name={lecturer.name} imageUrl={lecturer.profileImageUrl} size="lg" />\n')
          replace(path,
              '                      <Detail label="Years of experience"\n                        value={lecturer.professionalProfile?.yearsOfExperience == null ? null : `${lecturer.professionalProfile.yearsOfExperience} years`}\n                      />\n',
              '                      <Detail label="Years of experience"\n                        value={lecturer.professionalProfile?.yearsOfExperience == null ? null : `${lecturer.professionalProfile.yearsOfExperience} years`}\n                      />\n                      <Detail label="DSE programme start date" value={lecturer.professionalProfile?.programmeStartDate} />\n')
          replace(path,
              '                      <div className="sm:col-span-2">\n                        <Detail label="Field of specialization" value={lecturer.professionalProfile?.fieldOfSpecialization} />\n                      </div>\n',
              '                      <div className="sm:col-span-2">\n                        <Detail label="Field of specialization" value={lecturer.professionalProfile?.fieldOfSpecialization} />\n                      </div>\n                      <div className="sm:col-span-2">\n                        <Detail label="Short bio" value={lecturer.professionalProfile?.shortBio} />\n                      </div>\n')

          # Admin/Coordinator lecturer list avatar.
          path = 'apps/frontend/app/(shell)/lecturers/lecturers-client.tsx'
          replace(path,
              'import { ApiError } from "@/lib/api";\n',
              'import { ApiError } from "@/lib/api";\nimport { LecturerAvatar } from "@/components/lecturer-avatar";\n')
          replace(path,
              '      render: (l) => (\n        <div>\n          <span className="font-medium">{formatLecturerDisplayName(l.name, l.honorific)}</span>\n          {canWrite ? (\n            <div>\n              <Link href={`/lecturers/${l.id}/portfolio`} className="text-xs font-medium text-primary hover:underline">\n                Review portfolio evidence\n              </Link>\n            </div>\n          ) : null}\n        </div>\n      ),\n',
              '      render: (l) => (\n        <div className="flex items-center gap-3">\n          <LecturerAvatar name={l.name} imageUrl={l.profileImageUrl} size="sm" />\n          <div>\n            <span className="font-medium">{formatLecturerDisplayName(l.name, l.honorific)}</span>\n            {canWrite ? (\n              <div>\n                <Link href={`/lecturers/${l.id}/portfolio`} className="text-xs font-medium text-primary hover:underline">\n                  Review portfolio evidence\n                </Link>\n              </div>\n            ) : null}\n          </div>\n        </div>\n      ),\n')

          # Governance review header avatar.
          path = 'apps/frontend/app/(shell)/lecturers/[id]/portfolio/review-client.tsx'
          replace(path,
              'import { lecturersApi } from "@/lib/lecturers";\n',
              'import { lecturersApi } from "@/lib/lecturers";\nimport { LecturerAvatar } from "@/components/lecturer-avatar";\n')
          replace(path,
              '        <div className="flex items-start gap-3">\n          <div className="rounded-lg bg-primary/10 p-2 text-primary"><ShieldCheck className="h-5 w-5" /></div>\n          <div>\n',
              '        <div className="flex items-start gap-3">\n          {lecturer ? <LecturerAvatar name={lecturer.name} imageUrl={lecturer.profileImageUrl} size="md" /> : <div className="rounded-lg bg-primary/10 p-2 text-primary"><ShieldCheck className="h-5 w-5" /></div>}\n          <div>\n')
      - name: Commit patches
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/backend/src/plugins/lecturers/portfolio-service.ts apps/frontend
          git commit -m 'feat(staff-import): surface imported profile and period context'
          git push origin HEAD:agent/issue-678-staff-information-import
