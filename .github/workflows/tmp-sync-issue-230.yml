name: Sync issue 230 with main

on:
  push:
    branches: [agent/issue-230-structured-sar-editor]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-230-structured-sar-editor
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "packages/shared-types/src/index.ts" ]; then
              echo "Unexpected merge conflicts:"
              echo "$conflicts"
              exit 1
            fi
            git checkout --ours packages/shared-types/src/index.ts
            grep -q 'qa-actions.ts' packages/shared-types/src/index.ts
            grep -q 'qa-sar.ts' packages/shared-types/src/index.ts
            git add packages/shared-types/src/index.ts
            git commit --no-edit
          fi
          git push origin HEAD:agent/issue-230-structured-sar-editor
