name: Patch issue 231 SAR review files

on:
  push:
    branches: [agent/issue-231-sar-review-approval]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-231-sar-review-approval
      - run: python .github/patch-issue-231-schema.py
      - run: python .github/patch-issue-231-ui.py
      - name: Commit generated patches if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma packages/shared-types/src/plugins.ts apps/frontend/app/'(shell)'/aun-qa/workspace-client.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: wire SAR review lifecycle into workspace"
          git push origin HEAD:agent/issue-231-sar-review-approval
