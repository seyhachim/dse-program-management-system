name: Agent Epic 638 UI Polish

on:
  push:
    branches:
      - agent/epic-638-academic-calendar
    paths:
      - scripts/agent-epic-638-ui-polish.ts
      - .github/workflows/agent-epic-638-ui-polish.yml

permissions:
  contents: write

concurrency:
  group: agent-epic-638-ui-polish
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dse_pms
      NEXT_PUBLIC_AUTH_MODE: supabase
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic-638-academic-calendar
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Repair generated patch-script literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-epic-638-ui-polish.ts')
          source = path.read_text()
          source = source.replace(
              'className={`flex items-center gap-2 rounded-lg px-3 py-2 text-xs font-medium ${step.complete ? "bg-primary/10 text-primary" : "bg-background text-muted-foreground"}`}',
              'className={"flex items-center gap-2 rounded-lg px-3 py-2 text-xs font-medium " + (step.complete ? "bg-primary/10 text-primary" : "bg-background text-muted-foreground")}',
          )
          source = source.replace(
              'className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[11px] font-bold ${step.complete ? "bg-primary text-primary-foreground" : "border border-border bg-card"}`}',
              'className={"flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[11px] font-bold " + (step.complete ? "bg-primary text-primary-foreground" : "border border-border bg-card")}',
          )
          path.write_text(source)
          PY
      - name: Apply UI polish
        run: bun scripts/agent-epic-638-ui-polish.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Commit verified UI polish
        run: |
          rm scripts/agent-epic-638-ui-polish.ts
          rm .github/workflows/agent-epic-638-ui-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(calendar): improve academic calendar UX (#638)"
          git push origin HEAD:agent/epic-638-academic-calendar
