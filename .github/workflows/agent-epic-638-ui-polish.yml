name: Agent Epic 638 UI Polish

on:
  push:
    branches:
      - agent/epic-638-academic-calendar
    paths:
      - scripts/agent-epic-638-backend-consumers.ts
      - scripts/agent-epic-638-consumer-fixes.ts
      - scripts/agent-epic-638-offering-security.ts
      - scripts/agent-epic-638-student-consumers.ts
      - scripts/agent-epic-638-ui-polish.ts
      - .github/workflows/agent-epic-638-ui-polish.yml

permissions:
  contents: write

concurrency:
  group: agent-epic-638-ui-polish
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dse_pms
      NEXT_PUBLIC_AUTH_MODE: supabase
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic-638-academic-calendar
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Prepare canonical consumer patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/shared-types/src/academic-calendar.ts')
          source = path.read_text()
          block = 'export type StudentAcademicCalendarView =\n  | { status: "available"; academicYear: AcademicYearView; studyYear: number; periods: AcademicCalendarPeriodView[]; events: AcademicCalendarEventView[]; nextEvent: AcademicCalendarTimelineEvent | null; }\n  | { status: "unavailable"; academicYear: AcademicYearView | null; studyYear: number | null; reason: "student-context-unavailable" | "academic-year-unavailable" | "calendar-unpublished"; message: string; };\n\n'
          if block not in source:
              raise SystemExit('StudentAcademicCalendarView preparation block not found')
          path.write_text(source.replace(block, '', 1))
          PY
      - name: Apply full Academic Calendar consumers
        run: |
          bun scripts/agent-epic-638-backend-consumers.ts
          bun scripts/agent-epic-638-consumer-fixes.ts
          bun scripts/agent-epic-638-offering-security.ts
      - name: Fix portal calendar narrowing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/frontend/app/(shell)/portal/portal-home.tsx')
          source = path.read_text()
          before = '  const firstCalendarPeriod = calendar.status === "available" ? calendar.periods[0] ?? null : null;\n'
          after = before + '  const unavailableCalendarMessage = calendar.status === "unavailable" ? calendar.message : "No semester period is currently published.";\n'
          if before not in source:
              raise SystemExit('portal-home calendar setup marker not found')
          source = source.replace(before, after, 1)
          source = source.replace('{calendar.message}</p></>}', '{unavailableCalendarMessage}</p></>}', 1)
          path.write_text(source)
          PY
      - name: Repair generated UI patch literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-epic-638-ui-polish.ts')
          source = path.read_text()
          source = source.replace(
              'className={`flex items-center gap-2 rounded-lg px-3 py-2 text-xs font-medium ${step.complete ? "bg-primary/10 text-primary" : "bg-background text-muted-foreground"}`}',
              'className={"flex items-center gap-2 rounded-lg px-3 py-2 text-xs font-medium " + (step.complete ? "bg-primary/10 text-primary" : "bg-background text-muted-foreground")}',
          )
          source = source.replace(
              'className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[11px] font-bold ${step.complete ? "bg-primary text-primary-foreground" : "border border-border bg-card"}`}',
              'className={"flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[11px] font-bold " + (step.complete ? "bg-primary text-primary-foreground" : "border border-border bg-card")}',
          )
          path.write_text(source)
          PY
      - name: Apply UI polish
        run: bun scripts/agent-epic-638-ui-polish.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Prisma
        run: |
          bunx prisma format --schema apps/backend/prisma/schema.prisma
          bunx prisma validate --schema apps/backend/prisma/schema.prisma
          bun run --cwd apps/backend db:generate
      - name: Targeted calendar tests
        run: bun test apps/backend/src/plugins/programme/academic-calendar-domain.test.ts apps/backend/src/plugins/programme/academic-calendar-router.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Commit verified UI polish
        run: |
          rm scripts/agent-epic-638-backend-consumers.ts
          rm scripts/agent-epic-638-consumer-fixes.ts
          rm scripts/agent-epic-638-offering-security.ts
          rm scripts/agent-epic-638-student-consumers.ts
          rm scripts/agent-epic-638-ui-polish.ts
          rm .github/workflows/agent-epic-638-ui-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(calendar): improve academic calendar UX (#638)"
          git push origin HEAD:agent/epic-638-academic-calendar
