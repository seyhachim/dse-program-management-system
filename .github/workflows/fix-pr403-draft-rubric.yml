name: Apply PR 403 draft rubric privacy fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-169-student-portal-mvp
          fetch-depth: 0

      - name: Apply privacy fix
        run: python tools/fix-pr403-draft-rubric.py

      - name: Remove temporary patch script
        run: git rm tools/fix-pr403-draft-rubric.py

      - name: Commit and push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(student-portal): hide draft rubrics from students'
          git push origin HEAD:agent/issue-169-student-portal-mvp
