name: Apply issue 766 fix

on:
  push:
    branches:
      - fix/issue-766-inline-course-synopsis

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
      - name: Apply issue 766 helper
        run: python scripts/issue766-inline-course-info-patch.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/app/\(shell\)/courses/\[id\]/spec/overview-tab.tsx apps/frontend/app/\(shell\)/courses/\[id\]/spec/spec-client.tsx apps/frontend/app/\(shell\)/courses/\[id\]/spec/themed-document-pages.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(course-spec): inline synopsis editing and restore CLO preview"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
