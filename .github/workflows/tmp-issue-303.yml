name: Patch issue 303 CLO attainment snapshots

on:
  push:
    branches: [agent/issue-303-clo-attainment-snapshots]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-303-clo-attainment-snapshots
      - run: python .github/patch-issue-303.py
      - name: Commit generated feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma \
            apps/backend/prisma/migrations/20260818020000_add_clo_attainment_snapshots/migration.sql \
            apps/backend/scripts/verify-db-security.ts \
            apps/backend/src/plugins/qa/evidence/clo-attainment.ts \
            apps/backend/src/plugins/qa/evidence/clo-attainment-db.test.ts \
            apps/backend/src/plugins/qa/evidence/registry.ts \
            apps/backend/src/plugins/qa/evidence/service.ts \
            packages/shared-types/src/qa-evidence-candidates.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(qa): add versioned CLO attainment snapshots (#303)"
          git pull --rebase origin agent/issue-303-clo-attainment-snapshots
          git push origin HEAD:agent/issue-303-clo-attainment-snapshots
