name: Temporary issue 774 patch apply

on:
  push:
    branches:
      - fix/issue-774-telegram-compact-menu-current

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-774-telegram-compact-menu-current
          fetch-depth: 0
      - name: Apply scoped patch
        run: python scripts/_tmp_apply_issue_774.py
      - name: Commit scoped change and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(telegram): keep FAQ lists compact (#774)"
          git push origin HEAD:fix/issue-774-telegram-compact-menu-current
