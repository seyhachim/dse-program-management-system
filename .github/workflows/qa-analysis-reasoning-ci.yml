name: QA Analysis Reasoning Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/prisma/schema.prisma"
      - "apps/backend/prisma/migrations/**"
      - "apps/backend/src/plugins/qa/analysis/**"
      - "packages/shared-types/src/qa-analysis.ts"
      - ".github/workflows/qa-analysis-reasoning-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/prisma/schema.prisma"
      - "apps/backend/prisma/migrations/**"
      - "apps/backend/src/plugins/qa/analysis/**"
      - "packages/shared-types/src/qa-analysis.ts"
      - ".github/workflows/qa-analysis-reasoning-ci.yml"

permissions:
  contents: read

jobs:
  qa-analysis-reasoning-db-integrity:
    name: QA analysis reasoning DB round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_qa_analysis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_qa_analysis_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_qa_analysis_ci?schema=public
      QA_ANALYSIS_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:migrate:deploy
      - run: bun run seed
      - name: Verify reasoning factors persist through create and list
        run: bun test apps/backend/src/plugins/qa/analysis/service-db.test.ts
