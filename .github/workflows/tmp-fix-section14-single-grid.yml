name: One-shot Section 14 single-grid patch
on:
  push:
    branches:
      - fix/issue-766-inline-course-synopsis
    paths:
      - .github/workflows/tmp-fix-section14-single-grid.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
          fetch-depth: 0
      - name: Patch Section 14 to one six-column table
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages.tsx')
          src = path.read_text()
          start = src.index('        <div className="section14-table">')
          end = src.index('        <TaxonomyLegend />', start)
          new = '''        <div className="section14-table">
          <Table className="section14-grid-table text-[10.5px] leading-[1.22]">
            <colgroup>
              <col style={{ width: "7%" }} />
              <col style={{ width: "58%" }} />
              <col style={{ width: "8%" }} />
              <col style={{ width: "9%" }} />
              <col style={{ width: "9%" }} />
              <col style={{ width: "9%" }} />
            </colgroup>
            <thead>
              <tr className="section14-header-row section14-header-primary">
                <TH colSpan={2} className="bg-[#E2EEDB] text-center font-normal border-b-0">Description of the course learning outcomes – CLOs. At the end of the course, students will be able to:</TH>
                <TH className="bg-[#E2EEDB] text-center font-normal border-b-0">PLO</TH>
                <TH colSpan={3} className="bg-[#E2EEDB] text-center font-normal">Levels in Learning Domain:<br />Knowledge (Cognitive-C), Attitude<br />(Affective-A), Skills (Psychomotor-P)</TH>
              </tr>
              <tr className="section14-header-row section14-header-secondary">
                <TH colSpan={2} className="bg-[#E2EEDB] p-0 border-t-0"><span className="sr-only">Course learning outcome description</span></TH>
                <TH className="bg-[#E2EEDB] p-0 border-t-0"><span className="sr-only">PLO</span></TH>
                <TH className="bg-[#E2EEDB] text-center font-normal">C</TH>
                <TH className="bg-[#E2EEDB] text-center font-normal">A</TH>
                <TH className="bg-[#E2EEDB] text-center font-normal">P</TH>
              </tr>
            </thead>
            <tbody>
              {document.clos.length ? document.clos.map((clo) => {
                const domain = learningDomain(clo.level);
                return <tr key={clo.code}>
                  <TD className="text-center align-middle">{clo.code}</TD>
                  <TD className="text-left align-middle">{clo.outcome}</TD>
                  <TD className="text-center align-middle">{joinValues(clo.mappedPlos)}</TD>
                  <TD className="text-center align-middle">{domain.cognitive || " "}</TD>
                  <TD className="text-center align-middle">{domain.affective || " "}</TD>
                  <TD className="text-center align-middle">{domain.psychomotor || " "}</TD>
                </tr>;
              }) : <tr><TD colSpan={6}>No Course Learning Outcomes have been added.</TD></tr>}
            </tbody>
          </Table>
        </div>
'''
          path.write_text(src[:start] + new + src[end:])

          theme = Path('apps/frontend/app/(shell)/courses/[id]/spec/themed-document-pages.tsx')
          css = theme.read_text()
          css = css.replace('''        .course-spec-theme-root #clos .section14-header-table,
        .course-spec-theme-root #clos .section14-body-table {
          margin-top: 0 !important;
          margin-bottom: 0 !important;
        }

        .course-spec-theme-root #clos .section14-body-table {
          margin-top: -1px !important;
        }
''', '')
          css = css.replace('''        .course-spec-theme-root #clos .section14-table .section14-header-row:nth-child(2) {
          height: 18px;
        }
''', '''        .course-spec-theme-root #clos .section14-table .section14-header-secondary {
          height: 18px;
        }

        .course-spec-theme-root #clos .section14-table .section14-header-primary > th:nth-child(1),
        .course-spec-theme-root #clos .section14-table .section14-header-primary > th:nth-child(2) {
          border-bottom-width: 0 !important;
        }

        .course-spec-theme-root #clos .section14-table .section14-header-secondary > th:nth-child(1),
        .course-spec-theme-root #clos .section14-table .section14-header-secondary > th:nth-child(2) {
          border-top-width: 0 !important;
          padding: 0 !important;
          height: 0 !important;
          line-height: 0 !important;
        }
''')
          theme.write_text(css)

          test = Path('apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages-layout.test.ts')
          t = test.read_text()
          t = t.replace("    expect(source).toContain('className=\"section14-header-table');\n    expect(source).toContain('className=\"section14-body-table');\n    expect(source).not.toContain('<thead><tr className=\\\"section14-header-row\\\">');\n", "")
          marker = '    expect(source).toContain(\'className="section14-header-row"\');\n'
          if marker in t:
              t = t.replace(marker, marker + '    expect(source).toContain(\'className="section14-grid-table\');\n    expect(source).toContain(\'section14-header-primary\');\n    expect(source).toContain(\'section14-header-secondary\');\n')
          test.write_text(t)
          PY

          git rm -f .github/workflows/tmp-fix-section14-single-grid.yml .github/workflows/tmp-fix-section14-split-tables.yml .github/workflows/tmp-fix-section14-grid.yml 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(course-spec): align Section 14 header and CLO grid"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
