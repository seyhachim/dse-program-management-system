name: Issue 950 test fix helper

on:
  push:
    branches:
      - fix/issue-950-ask-label-tuition

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-950-ask-label-tuition
      - name: Update Telegram router expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/backend/src/plugins/telegram/public-bot/router.test.ts')
          s = p.read_text()
          old = '["🏠 Home", "❓ Ask DSE"]'
          if old not in s:
              raise SystemExit('English router keyboard expectation not found')
          s = s.replace(old, '["🏠 Home", "❓ Ask a Question"]')
          s = s.replace('"❓ សួរ DSE"', '"❓ សួរសំណួរអំពី DSE"')
          p.write_text(s)
          PY
          echo 'Remaining visible Ask DSE test references:'
          grep -R -n 'Ask DSE' apps/backend/src/plugins/telegram/public-bot/*.test.ts || true
      - name: Remove helper and commit
        run: |
          git rm .github/workflows/issue-950-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/plugins/telegram/public-bot/router.test.ts
          git commit -m "test(telegram): update Ask a Question expectations (#950)"
          git push origin HEAD:fix/issue-950-ask-label-tuition
