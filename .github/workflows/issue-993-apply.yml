name: Apply issue 993 implementation

on:
  push:
    branches:
      - feat/issue-993-offering-building
    paths:
      - .github/workflows/issue-993-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-993-offering-building
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply scoped patch
        run: python .github/issue-993-patch.py
      - name: Verify focused tests and Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          bun install --frozen-lockfile
          bunx prisma validate --schema apps/backend/prisma/schema.prisma
          bun test packages/shared-types/src/offerings.test.ts
          bun test apps/backend/src/plugins/offerings/workload.test.ts
          bun test apps/frontend/lib/offering-list-view.test.ts
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(offerings): add building to weekly meeting location (#993)"
          git push origin HEAD:feat/issue-993-offering-building
