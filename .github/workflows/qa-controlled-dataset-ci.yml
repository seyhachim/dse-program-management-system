name: QA Controlled Dataset Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/prisma/migrations/**"
      - "apps/backend/src/plugins/qa/evaluation/**"
      - "packages/shared-types/src/qa-evaluation.ts"
      - "packages/shared-types/src/qa-evaluation.test.ts"
      - ".github/workflows/qa-controlled-dataset-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/prisma/migrations/**"
      - "apps/backend/src/plugins/qa/evaluation/**"
      - "packages/shared-types/src/qa-evaluation.ts"
      - "packages/shared-types/src/qa-evaluation.test.ts"
      - ".github/workflows/qa-controlled-dataset-ci.yml"

permissions:
  contents: read

jobs:
  qa-controlled-dataset-db-integrity:
    name: Controlled dataset is isolated and reproducible
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_qa_controlled_dataset_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_qa_controlled_dataset_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_qa_controlled_dataset_ci?schema=public
      QA_CONTROLLED_DATASET_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:migrate:deploy
      - run: bun run seed
      - name: Verify controlled dataset taxonomy, isolation, human gold provenance, and deterministic export
        run: bun test apps/backend/src/plugins/qa/evaluation/controlled-dataset-db.test.ts
