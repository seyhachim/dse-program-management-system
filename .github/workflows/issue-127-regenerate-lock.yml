name: Issue 127 regenerate Bun lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.head_ref == 'fix/issue-127-reliable-tooling'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-127-reliable-tooling

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Regenerate lockfile
        run: bun install

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(tooling): refresh Bun lockfile for #127"
          git push origin HEAD:fix/issue-127-reliable-tooling
