# implementation trigger v2
name: Portfolio epic schema patch
on:
  push:
    branches: [feat/epic-570-student-portfolio-completion]
    paths: [.github/workflows/portfolio-epic-schema-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epic-570-student-portfolio-completion
      - name: Patch Prisma, security inventory and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          schema_path = Path('apps/backend/prisma/schema.prisma')
          schema = schema_path.read_text()
          user_anchor = '  studentProfile                   Student?\n  lecturerProfile                  LecturerProfile?\n'
          if 'portfolioVerificationEvents' not in schema:
              schema = schema.replace(user_anchor, user_anchor + '''  portfolioVerificationEvents       StudentPortfolioVerificationEvent[]        @relation("StudentPortfolioVerifier")\n  portfolioSupervisorAssignments   StudentPortfolioSupervisorRelationship[]   @relation("PortfolioSupervisorUser")\n  portfolioSupervisorApprovals     StudentPortfolioSupervisorRelationship[]   @relation("PortfolioSupervisorApprovedBy")\n  portfolioSupervisorRevocations   StudentPortfolioSupervisorRelationship[]   @relation("PortfolioSupervisorRevokedBy")\n''')
          student_anchor = '  portfolioProfile StudentPortfolioProfile?\n  portfolioEvidence StudentPortfolioEvidence[]\n'
          if 'portfolioProfessionalLinks' not in schema:
              schema = schema.replace(student_anchor, student_anchor + '''  portfolioProfessionalLinks StudentPortfolioProfessionalLink[]\n  portfolioSupervisorRelationships StudentPortfolioSupervisorRelationship[]\n''')
          evidence_anchor = '  links                  StudentPortfolioEvidenceLink[]\n\n  @@index([studentId, updatedAt])'
          if 'verificationEvents' not in schema:
              schema = schema.replace(evidence_anchor, '''  links                  StudentPortfolioEvidenceLink[]\n  verificationEvents     StudentPortfolioVerificationEvent[]\n  softSkills             StudentPortfolioEvidenceSoftSkill[]\n\n  @@index([studentId, updatedAt])''')
          insert_anchor = '/// Authoritative programme cohort identity. Cohort membership and progression\n'
          if 'model StudentPortfolioProfessionalLink {' not in schema:
              block = r'''
/// Student-owned external professional presence. URLs are presentation data only
/// and are never treated as academic verification or authentication credentials.
model StudentPortfolioProfessionalLink {
  id        String                               @id @default(uuid())
  studentId String
  student   Student                              @relation(fields: [studentId], references: [id], onDelete: Cascade)
  provider  StudentPortfolioProfessionalProvider
  label     String                               @default("")
  url       String
  isPublic  Boolean                              @default(false)
  createdAt DateTime                             @default(now())
  updatedAt DateTime                             @updatedAt
  @@unique([studentId, provider, url])
  @@index([studentId, isPublic])
}
model StudentPortfolioSupervisorRelationship {
  id               String                           @id @default(uuid())
  studentId        String
  student          Student                          @relation(fields: [studentId], references: [id], onDelete: Cascade)
  supervisorUserId String
  supervisorUser   User                             @relation("PortfolioSupervisorUser", fields: [supervisorUserId], references: [id], onDelete: Restrict)
  status           StudentPortfolioSupervisorStatus @default(Pending)
  approvedById     String?
  approvedBy       User?                            @relation("PortfolioSupervisorApprovedBy", fields: [approvedById], references: [id], onDelete: Restrict)
  approvedAt       DateTime?
  revokedById      String?
  revokedBy        User?                            @relation("PortfolioSupervisorRevokedBy", fields: [revokedById], references: [id], onDelete: Restrict)
  revokedAt        DateTime?
  createdAt        DateTime                         @default(now())
  updatedAt        DateTime                         @updatedAt
  @@unique([studentId, supervisorUserId])
  @@index([supervisorUserId, status])
}
model StudentPortfolioVerificationEvent {
  id            String                              @id @default(uuid())
  evidenceId    String
  evidence      StudentPortfolioEvidence            @relation(fields: [evidenceId], references: [id], onDelete: Restrict)
  actorId       String?
  actor         User?                               @relation("StudentPortfolioVerifier", fields: [actorId], references: [id], onDelete: Restrict)
  actorContext  StudentPortfolioVerificationContext
  previousState StudentPortfolioVerificationState
  newState      StudentPortfolioVerificationState
  reason        String                              @default("")
  snapshot      Json
  snapshotHash  String
  createdAt     DateTime                            @default(now())
  @@index([evidenceId, createdAt])
  @@index([actorId, createdAt])
}
model StudentPortfolioEvidenceSoftSkill {
  evidenceId String
  evidence   StudentPortfolioEvidence @relation(fields: [evidenceId], references: [id], onDelete: Cascade)
  skillCode  String
  createdAt  DateTime                 @default(now())
  @@id([evidenceId, skillCode])
  @@index([skillCode])
}
enum StudentPortfolioProfessionalProvider { GitHub GitLab LinkedIn Kaggle HuggingFace Website ORCID GoogleScholar ResearchGate CodingPractice BIProfile CV Other }
enum StudentPortfolioSupervisorStatus { Pending Approved Revoked }
enum StudentPortfolioVerificationState { Unverified Verified NeedsChanges Revoked }
enum StudentPortfolioVerificationContext { Lecturer Supervisor System }

'''
              schema = schema.replace(insert_anchor, block + insert_anchor)
          schema_path.write_text(schema)
          security_path = Path('apps/backend/scripts/verify-db-security.ts')
          security = security_path.read_text()
          anchor = '  "StudentPortfolioEvidenceLink",\n'
          if 'StudentPortfolioProfessionalLink' not in security:
              security = security.replace(anchor, anchor + '  "StudentPortfolioProfessionalLink",\n  "StudentPortfolioSupervisorRelationship",\n  "StudentPortfolioVerificationEvent",\n  "StudentPortfolioEvidenceSoftSkill",\n')
          security_path.write_text(security)
          plugins_path = Path('packages/shared-types/src/plugins.ts')
          plugins = plugins_path.read_text()
          marker = '''    {\n      label: "Account Settings",\n      path: "/account-settings",\n      icon: "settings",\n      roles: ["lecturer"],\n      group: "Personal",\n    },'''
          if 'Portfolio Evidence Review' not in plugins:
              addition = '''    {\n      label: "Portfolio Evidence Review",\n      path: "/portfolio-verification",\n      icon: "shield-check",\n      roles: ["lecturer"],\n      group: "Delivery",\n    },\n'''
              plugins = plugins.replace(marker, addition + marker)
          plugins_path.write_text(plugins)
          Path('.github/workflows/portfolio-epic-schema-patch.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma apps/backend/scripts/verify-db-security.ts packages/shared-types/src/plugins.ts .github/workflows/portfolio-epic-schema-patch.yml
          git commit -m "feat(portfolio): register complete portfolio schema and navigation [skip ci]"
          git push
