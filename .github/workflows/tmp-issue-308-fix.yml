name: Fix issue 308 compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-research-grade-evidence-matcher
      - name: Preserve optional legacy relationship contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/backend/src/plugins/qa/analysis/deterministic-engine.ts')
          text = p.read_text()
          old = 'expectation.relationshipRequirement.requiredLinks.map((link) =>'
          new = '(expectation.relationshipRequirement?.requiredLinks ?? []).map((link) =>'
          if text.count(old) != 1:
              raise SystemExit('relationship requirement anchor not found exactly once')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/plugins/qa/analysis/deterministic-engine.ts
          git commit -m "fix(qa): preserve legacy optional relationship semantics (#308)"
          git pull --rebase origin agent/issue-308-research-grade-evidence-matcher
          git push origin HEAD:agent/issue-308-research-grade-evidence-matcher
