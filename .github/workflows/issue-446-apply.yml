name: Apply issue 446 feature patch

on:
  push:
    branches:
      - agent/issue-446-course-spec-responsible-lecturers
    paths:
      - .github/workflows/issue-446-apply.yml
      - .github/patch-issue-446.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-446-course-spec-responsible-lecturers
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch-issue-446.py
      - name: Remove temporary patch machinery
        run: rm .github/patch-issue-446.py .github/workflows/issue-446-apply.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add course spec responsible lecturers"
          git push
