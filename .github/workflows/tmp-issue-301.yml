name: Patch issue 301 cohort progression

on:
  push:
    branches: [agent/issue-301-cohort-progression]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-301-cohort-progression
      - run: python .github/patch-issue-301.py
      - name: Commit generated feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma \
            apps/backend/prisma/migrations/20260818010000_add_student_cohort_progression/migration.sql \
            apps/backend/scripts/verify-db-security.ts \
            apps/backend/src/plugins/students/cohort-service.ts \
            apps/backend/src/plugins/students/cohort-router.ts \
            apps/backend/src/plugins/students/cohort-progression-db.test.ts \
            apps/backend/src/plugins/students/router.ts \
            apps/backend/src/plugins/qa/evidence/registry.ts \
            packages/shared-types/src/student-progression.ts \
            packages/shared-types/src/student-progression.test.ts \
            packages/shared-types/src/index.ts \
            packages/shared-types/src/qa-evidence-candidates.ts \
            .github/workflows/ci.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(qa): add authoritative cohort progression records (#301)"
          git push origin HEAD:agent/issue-301-cohort-progression
