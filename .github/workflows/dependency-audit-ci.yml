name: Production Dependency Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/dependency-audit-ci.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/dependency-audit-ci.yml"
  schedule:
    - cron: "17 1 * * 1"

permissions:
  contents: read

jobs:
  production-audit:
    name: Production dependency advisory gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - name: Audit production dependency graph
        shell: bash
        run: |
          set +e
          bun audit --production --json > dependency-audit.json 2>dependency-audit.stderr
          status=$?
          set -e

          cat dependency-audit.stderr || true
          cat dependency-audit.json

          bun -e '
            const report = JSON.parse(await Bun.file("dependency-audit.json").text());
            const packageCount = Object.keys(report).length;
            const advisoryCount = Object.values(report).reduce((count, advisories) => count + advisories.length, 0);
            console.log(`Production audit: ${advisoryCount} advisories across ${packageCount} packages`);
            if (packageCount > 0 || advisoryCount > 0) process.exit(1);
          '

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
