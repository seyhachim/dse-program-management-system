name: Production Dependency Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/dependency-audit-ci.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/dependency-audit-ci.yml"

permissions:
  contents: read

jobs:
  production-audit:
    name: Production dependency advisory inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - name: Record production audit
        shell: bash
        run: |
          set +e
          bun audit --production --json > dependency-audit.json 2>dependency-audit.stderr
          status=$?
          set -e
          cat dependency-audit.stderr || true
          cat dependency-audit.json || true
          echo "audit_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0
