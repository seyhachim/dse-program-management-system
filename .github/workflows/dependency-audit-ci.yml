name: Production Dependency Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/dependency-audit-ci.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/dependency-audit-ci.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/issue-131-dependency-audit'
    name: Refresh Bun lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --lockfile-only
      - name: Commit lockfile refresh when needed
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): refresh bun lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  production-audit:
    name: Production dependency advisory inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - name: Record production audit
        shell: bash
        run: |
          set +e
          bun audit --production --json > dependency-audit.json 2>dependency-audit.stderr
          status=$?
          set -e
          cat dependency-audit.stderr || true
          cat dependency-audit.json || true
          echo "audit_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Trace vulnerable dependency paths
        shell: bash
        run: |
          for package in \
            @hono/node-server \
            brace-expansion \
            hono \
            ip-address \
            js-yaml \
            nanoid \
            postcss \
            sharp \
            undici
          do
            echo "===== $package ====="
            bun pm why "$package" || true
          done
