name: Production Dependency Audit

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/dependency-audit-ci.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/dependency-audit-ci.yml"
  schedule:
    - cron: "17 1 * * 1"

permissions:
  contents: write

jobs:
  normalize-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/issue-131-dependency-audit'
    name: Normalize Bun lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --lockfile-only
      - name: Commit normalized lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): normalize bun lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  production-audit:
    name: Production dependency advisory inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --lockfile-only
      - name: Capture production audit
        shell: bash
        run: |
          set +e
          bun audit --production --json > dependency-audit.json 2>dependency-audit.stderr
          status=$?
          set -e
          cat dependency-audit.stderr || true
          cat dependency-audit.json || true
          echo "audit_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0
