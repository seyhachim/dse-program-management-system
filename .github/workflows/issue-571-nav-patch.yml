name: Issue 571 navigation patch

on:
  push:
    branches:
      - feat/issue-571-student-portfolio-foundation
    paths:
      - .github/workflows/issue-571-nav-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-571-student-portfolio-foundation
          fetch-depth: 0
      - name: Add student portfolio navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/shared-types/src/plugins.ts')
          text = path.read_text()
          old = '''    { label: "Announcements", path: "/portal/announcements", icon: "bell", roles: ["student"], group: "Progress" },
          ],
          permissions: ["student-portal:read", "student-portal:feedback"],
          };'''
          new = '''    { label: "Announcements", path: "/portal/announcements", icon: "bell", roles: ["student"], group: "Progress" },
              { label: "Portfolio", path: "/portal/portfolio", icon: "user-cog", roles: ["student"], group: "Personal" },
          ],
          permissions: ["student-portal:read", "student-portal:feedback"],
          };'''
          if 'path: "/portal/portfolio"' not in text:
              if old not in text:
                  raise SystemExit('student portal manifest anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/issue-571-nav-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared-types/src/plugins.ts .github/workflows/issue-571-nav-patch.yml
          git commit -m "feat(portfolio): add student navigation entry [skip ci]"
          git push origin HEAD:feat/issue-571-student-portfolio-foundation
