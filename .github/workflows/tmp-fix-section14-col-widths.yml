name: One-shot Section 14 column widths
on:
  push:
    branches: [fix/issue-766-inline-course-synopsis]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
          fetch-depth: 0
      - name: Fix all six Section 14 columns
        run: |
          python - <<'PY'
          from pathlib import Path
          theme = Path('apps/frontend/app/(shell)/courses/[id]/spec/themed-document-pages.tsx')
          text = theme.read_text()
          old = '''        .course-spec-theme-root #clos .section14-table {
          width: 100%;
          max-width: 100%;
          overflow: hidden;
        }

        .course-spec-theme-root #clos .section14-table > table {
          width: 100% !important;
          max-width: 100% !important;
          table-layout: fixed !important;
        }
'''
          new = '''        .course-spec-theme-root #clos .section14-table {
          width: 100%;
          max-width: 100%;
          box-sizing: border-box;
        }

        .course-spec-theme-root #clos .section14-table > table {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          table-layout: fixed !important;
          box-sizing: border-box !important;
        }

        .course-spec-theme-root #clos .section14-table colgroup col:nth-child(1) { width: 7% !important; }
        .course-spec-theme-root #clos .section14-table colgroup col:nth-child(2) { width: 58% !important; }
        .course-spec-theme-root #clos .section14-table colgroup col:nth-child(3) { width: 8% !important; }
        .course-spec-theme-root #clos .section14-table colgroup col:nth-child(4),
        .course-spec-theme-root #clos .section14-table colgroup col:nth-child(5),
        .course-spec-theme-root #clos .section14-table colgroup col:nth-child(6) { width: 9% !important; }
'''
          if old not in text:
              raise SystemExit('Section 14 CSS target not found')
          theme.write_text(text.replace(old, new, 1))

          test = Path('apps/frontend/app/(shell)/courses/[id]/spec/section14-preview-style.test.ts')
          t = test.read_text()
          marker = '    expect(source).toContain("font-size: 8.5pt !important");\n'
          insert = marker + '    expect(source).toContain("colgroup col:nth-child(6)");\n    expect(source).toContain("width: 9% !important");\n'
          if marker not in t:
              raise SystemExit('Section 14 test marker not found')
          test.write_text(t.replace(marker, insert, 1))
          PY
          rm .github/workflows/tmp-fix-section14-col-widths.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(course-spec): preserve all C A P columns"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
