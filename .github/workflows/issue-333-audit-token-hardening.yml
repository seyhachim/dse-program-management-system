name: Issue 333 audit hardening

on:
  push:
    branches:
      - agent/issue-333-finalized-result-corrections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-333-finalized-result-corrections
      - name: Apply hardening patch
        run: python scripts/issue-333-audit-token-hardening.py
      - name: Commit final hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-333-audit-token-hardening.yml scripts/issue-333-audit-token-hardening.py
          git add apps/backend/prisma/migrations/20260817003500_add_finalized_result_corrections/migration.sql
          git add apps/backend/src/plugins/student-portal/results-lifecycle.ts
          git add apps/backend/src/plugins/student-portal/results-lifecycle-db.test.ts
          git diff --cached --check
          git commit -m "fix(results): enforce audited finalized value changes"
          git push origin HEAD:agent/issue-333-finalized-result-corrections
