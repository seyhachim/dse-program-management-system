name: Apply issue 545 implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-545-bilingual-public-content
      - uses: oven-sh/setup-bun@v2
      - name: Apply implementation patch
        run: python scripts/issue-545-apply.py
      - name: Format touched TypeScript
        run: |
          bunx prettier --write packages/shared-types/src/public-programme-info.ts apps/backend/src/plugins/programme/public-programme-info-service.ts apps/backend/src/plugins/programme/public-programme-read-service.ts apps/backend/src/plugins/programme/public-programme-search-service.ts apps/backend/src/plugins/programme/public-programme-read-router.ts apps/backend/src/plugins/telegram/public-bot/router.ts apps/backend/src/plugins/telegram/public-bot/localized-router.ts apps/frontend/app/'(shell)'/public-information/public-information-client.tsx apps/backend/src/plugins/programme/public-programme-bilingual.test.ts
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(public-info): add bilingual Khmer content (#545)'
          git push origin HEAD:feat/issue-545-bilingual-public-content
