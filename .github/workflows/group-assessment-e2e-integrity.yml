name: Group Assessment E2E Integrity

on:
  pull_request:
    paths:
      - "apps/backend/src/plugins/student-portal/group-assessment-*.ts"
      - "apps/backend/src/plugins/student-portal/results-lifecycle.ts"
      - "apps/backend/src/plugins/student-portal/service.ts"
      - "apps/backend/prisma/**"
      - ".github/workflows/group-assessment-e2e-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "apps/backend/src/plugins/student-portal/group-assessment-*.ts"
      - "apps/backend/src/plugins/student-portal/results-lifecycle.ts"
      - "apps/backend/src/plugins/student-portal/service.ts"
      - "apps/backend/prisma/**"
      - ".github/workflows/group-assessment-e2e-integrity.yml"

permissions:
  contents: read

jobs:
  lifecycle:
    name: Group/Group+Individual lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_group_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_group_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_group_e2e?schema=public
      GROUP_ASSESSMENT_E2E_DB_TESTS: "1"
      JWT_SECRET: group-assessment-e2e-ci-secret-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Apply migrations
        run: bun run db:migrate:deploy

      - name: Seed clean database
        run: bun run seed

      - name: Run Group and Group + Individual lifecycle integrity sequence
        run: bun test apps/backend/src/plugins/student-portal/group-assessment-e2e-db.test.ts
