name: Apply issue 766 preview header fix

on:
  push:
    branches:
      - fix/issue-766-inline-course-synopsis

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
      - name: Apply preview header fix
        run: python scripts/issue766-preview-header-fix.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/app/\(shell\)/courses/\[id\]/spec/document-preview-pages.tsx apps/frontend/app/\(shell\)/courses/\[id\]/spec/themed-document-pages.tsx apps/frontend/app/\(shell\)/courses/\[id\]/spec/document-preview-pages-layout.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(course-spec): render CLO grouped header reliably"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
