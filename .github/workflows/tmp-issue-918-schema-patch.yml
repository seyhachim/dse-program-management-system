name: Temporary Issue 918 schema patch

on:
  push:
    branches:
      - feat/issue-918-public-info-archive-lifecycle

permissions:
  contents: write

jobs:
  patch-schema:
    if: ${{ !contains(github.event.head_commit.message, '[schema-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-918-public-info-archive-lifecycle
          fetch-depth: 0
      - name: Add Archived to Prisma publication status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/backend/prisma/schema.prisma')
          text = p.read_text()
          old = '''enum ProgrammePublicPublicationStatus {
            Draft
            Published
          }'''.replace('          ', '')
          new = '''enum ProgrammePublicPublicationStatus {
            Draft
            Published
            Archived
          }'''.replace('          ', '')
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('ProgrammePublicPublicationStatus block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit schema patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-issue-918-schema-patch.yml
          git add apps/backend/prisma/schema.prisma
          git commit -m "feat(public-info): add archived Prisma lifecycle [schema-patched]"
          git push origin HEAD:feat/issue-918-public-info-archive-lifecycle
