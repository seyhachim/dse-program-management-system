name: Temporary issue 204 patch

on:
  push:
    branches:
      - agent/issue-204-course-spec-locking

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement course-spec write locking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-204-course-spec-locking
          fetch-depth: 0
      - name: Apply backend locking patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          Path('apps/backend/src/plugins/courses/spec-lock.ts').write_text('''import type { CourseSpecReviewStatus } from "@prisma/client";

export const EDITABLE_COURSE_SPEC_STATUSES = [
  "Draft",
  "ChangesRequested",
] as const satisfies readonly CourseSpecReviewStatus[];

export class CourseSpecLockedError extends Error {
  readonly code = "COURSE_SPEC_LOCKED";

  constructor(readonly reviewStatus: CourseSpecReviewStatus) {
    super(
      `Course specification is locked while its review status is ${reviewStatus}`,
    );
    this.name = "CourseSpecLockedError";
  }
}

export function assertCourseSpecEditable(
  reviewStatus: CourseSpecReviewStatus,
): void {
  if (
    !EDITABLE_COURSE_SPEC_STATUSES.includes(
      reviewStatus as (typeof EDITABLE_COURSE_SPEC_STATUSES)[number],
    )
  ) {
    throw new CourseSpecLockedError(reviewStatus);
  }
}
''')

          Path('apps/backend/src/plugins/courses/spec-lock.test.ts').write_text('''import { describe, expect, test } from "bun:test";
import {
  CourseSpecLockedError,
  assertCourseSpecEditable,
} from "./spec-lock.ts";

describe("course specification write locking", () => {
  test("Draft and ChangesRequested remain editable", () => {
    expect(() => assertCourseSpecEditable("Draft")).not.toThrow();
    expect(() => assertCourseSpecEditable("ChangesRequested")).not.toThrow();
  });

  test.each(["Submitted", "UnderReview", "Resubmitted", "Approved"] as const)(
    "%s specifications are locked",
    (status) => {
      try {
        assertCourseSpecEditable(status);
        throw new Error("Expected specification to be locked");
      } catch (error) {
        expect(error).toBeInstanceOf(CourseSpecLockedError);
        expect((error as CourseSpecLockedError).reviewStatus).toBe(status);
        expect((error as CourseSpecLockedError).code).toBe(
          "COURSE_SPEC_LOCKED",
        );
      }
    },
  );
});
''')

