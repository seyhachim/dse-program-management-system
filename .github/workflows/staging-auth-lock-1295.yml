name: Staging Neon Auth pinned Bun lock refresh (one-shot)
on:
  push:
    branches:
      - feat/1295-neon-staging-auth
    paths:
      - .github/workflows/staging-auth-lock-1295.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1295-neon-staging-auth
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Resolve reviewed manifest and generate Prisma client
        run: bun install --no-progress
      - name: Commit Bun-generated lockfile without hand edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(staging-auth): regenerate Bun lockfile (#1295)"
            git push origin HEAD:feat/1295-neon-staging-auth
          fi
      - name: Validate typecheck
        run: bun run typecheck
      - name: Validate fail-closed production dependency policy
        run: |
          bun audit --production --json > dependency-audit.json || true
          bun scripts/verify-production-dependency-audit.ts dependency-audit.json
