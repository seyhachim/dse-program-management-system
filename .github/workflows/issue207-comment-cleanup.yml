name: Clean issue 207 comments

on:
  push:
    branches:
      - agent/issue-207-course-info-snapshot

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-207-course-info-snapshot
      - run: python .github/scripts/issue207_comment_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/plugins/courses/service.ts
          git commit -m "docs(course-spec): describe versioned CourseInfo snapshots (#207)"
          git push origin HEAD:agent/issue-207-course-info-snapshot
