name: Issue 1006 implementation bootstrap

on:
  push:
    branches:
      - feature/1006-final-project-supervisor-discovery

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_issue_1006
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_issue_1006"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_issue_1006?schema=public
      AUTH_MODE: dev
      JWT_SECRET: issue-1006-bootstrap-secret-at-least-32-characters
      BACKEND_INTEGRATION_TESTS: "1"
      NEXT_PUBLIC_AUTH_MODE: supabase
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Apply implementation and staging repair
        run: |
          python3 scripts/issue-1006-implement.py
          python3 scripts/issue-1006-postfix.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate schema and quality gates
        run: |
          bunx prisma validate --schema apps/backend/prisma/schema.prisma
          bun run typecheck
          bun run lint
          bun run test
          bun run test:backend
          bun run build

      - name: Prepare database roles
        run: |
          cat <<'SQL' | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END
          $$;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON FUNCTIONS TO anon, authenticated, service_role;
          CREATE SCHEMA IF NOT EXISTS telegram_security;
          GRANT USAGE, CREATE ON SCHEMA telegram_security TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA telegram_security GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA telegram_security GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA telegram_security GRANT ALL PRIVILEGES ON FUNCTIONS TO anon, authenticated, service_role;
          SQL

      - name: Verify migrations, seed, security, and authorization
        run: |
          bun run db:migrate:deploy
          bun run seed
          bun run --cwd apps/backend db:security:verify
          bun test apps/backend/src/integration/final-project-supervisor-discovery.integration.test.ts

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(final-project): add supervisor discovery MVP"
          git push origin HEAD:feature/1006-final-project-supervisor-discovery
