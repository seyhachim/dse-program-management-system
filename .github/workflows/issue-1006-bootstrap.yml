name: Issue 1006 implementation bootstrap

on:
  push:
    branches:
      - feature/1006-final-project-supervisor-discovery

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.head_commit.message == 'chore: run issue 1006 implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_issue_1006
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_issue_1006"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_issue_1006?schema=public
      AUTH_MODE: dev
      JWT_SECRET: issue-1006-bootstrap-secret-at-least-32-characters
      BACKEND_INTEGRATION_TESTS: '1'
      NEXT_PUBLIC_AUTH_MODE: supabase
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1006-final-project-supervisor-discovery
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Apply issue implementation
        run: python3 scripts/issue-1006-implement.py

      - name: Install dependencies and generate Prisma client
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate --schema apps/backend/prisma/schema.prisma

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit and backend tests
        run: |
          bun run test
          bun run test:backend

      - name: Build
        run: bun run build

      - name: Simulate Supabase Data API roles and defaults
        run: |
          cat <<'SQL' | bunx prisma db execute --schema apps/backend/prisma/schema.prisma --stdin
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END
          $$;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON FUNCTIONS TO anon, authenticated, service_role;
          CREATE SCHEMA IF NOT EXISTS telegram_security;
          GRANT USAGE, CREATE ON SCHEMA telegram_security TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA telegram_security GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA telegram_security GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA telegram_security GRANT ALL PRIVILEGES ON FUNCTIONS TO anon, authenticated, service_role;
          SQL

      - name: Apply migrations, seed, and verify database security
        run: |
          bun run db:migrate:deploy
          bun run seed
          bun run --cwd apps/backend db:security:verify

      - name: Final Project authorization integration test
        run: bun test apps/backend/src/integration/final-project-supervisor-discovery.integration.test.ts

      - name: Commit verified implementation
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(final-project): add supervisor discovery MVP'
          git push origin HEAD:feature/1006-final-project-supervisor-discovery
