name: Validate issue 228 existing evidence migration

on:
  push:
    branches: [agent/issue-228-reusable-qa-evidence]

permissions:
  contents: read

jobs:
  legacy-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dse_legacy
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dse_legacy?schema=public
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: bun run db:generate
      - name: Apply migration history before reusable evidence refactor
        run: |
          set -euo pipefail
          for migration in apps/backend/prisma/migrations/*/migration.sql; do
            case "$migration" in
              *20260815145500_refactor_qa_evidence_mappings*) break ;;
            esac
            psql -h localhost -U postgres -d dse_legacy -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Seed pre-refactor database
        run: bun run seed
      - name: Insert legacy requirement-owned evidence
        run: |
          psql -h localhost -U postgres -d dse_legacy -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "QaAssessmentCycle" (
            id, "programmeId", "frameworkId", title,
            "reportingStart", "reportingEnd", status, "createdAt", "updatedAt"
          ) VALUES (
            'legacy-cycle-228', 'dse', 'aun-qa-programme-v4', 'Legacy evidence migration check',
            '2025-01-01', '2025-12-31', 'Active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          );

          INSERT INTO "QaEvidence" (
            id, "programmeId", "cycleId", "requirementId", title, description,
            kind, "sourceUrl", "sourceRef", "reportingPeriod", status,
            "createdAt", "updatedAt"
          )
          SELECT
            'legacy-evidence-228', 'dse', 'legacy-cycle-228', r.id,
            'Employer Survey 2025', 'Legacy requirement-owned evidence',
            'ExternalLink', 'https://example.edu/employer-survey-2025', '', '2025', 'Ready',
            CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          FROM "QaRequirement" r
          JOIN "QaCriterion" c ON c.id = r."criterionId"
          WHERE r.code = '8.5' AND c."frameworkId" = 'aun-qa-programme-v4';
          SQL
      - name: Apply reusable evidence migration
        run: psql -h localhost -U postgres -d dse_legacy -v ON_ERROR_STOP=1 -f apps/backend/prisma/migrations/20260815145500_refactor_qa_evidence_mappings/migration.sql
      - name: Verify canonical evidence and mapping survived
        run: |
          psql -h localhost -U postgres -d dse_legacy -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            evidence_count integer;
            mapping_count integer;
            legacy_column_count integer;
          BEGIN
            SELECT count(*) INTO evidence_count FROM "QaEvidence" WHERE id = 'legacy-evidence-228';
            SELECT count(*) INTO mapping_count
            FROM "QaEvidenceMapping" m
            JOIN "QaRequirement" r ON r.id = m."requirementId"
            WHERE m."evidenceId" = 'legacy-evidence-228'
              AND m."cycleId" = 'legacy-cycle-228'
              AND r.code = '8.5';
            SELECT count(*) INTO legacy_column_count
            FROM information_schema.columns
            WHERE table_name = 'QaEvidence' AND column_name IN ('cycleId', 'requirementId');

            IF evidence_count <> 1 THEN RAISE EXCEPTION 'legacy evidence row was not preserved'; END IF;
            IF mapping_count <> 1 THEN RAISE EXCEPTION 'legacy evidence mapping was not backfilled'; END IF;
            IF legacy_column_count <> 0 THEN RAISE EXCEPTION 'legacy ownership columns still exist'; END IF;
          END $$;
          SQL
