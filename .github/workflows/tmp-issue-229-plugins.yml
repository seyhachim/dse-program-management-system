name: Patch issue 229 Evidence Library navigation

on:
  push:
    branches: [agent/issue-229-evidence-library-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-229-evidence-library-ui
      - run: python .github/patch-issue-229-plugins.py
      - name: Commit navigation patch if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared-types/src/plugins.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: add Evidence Library navigation"
          git push origin HEAD:agent/issue-229-evidence-library-ui
