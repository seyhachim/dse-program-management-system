name: Temporary PR 632 Scope Cleanup

on:
  push:
    branches:
      - fix/course-spec-part1-plo-row
    paths:
      - .github/workflows/temp-pr632-scope-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/course-spec-part1-plo-row
          fetch-depth: 0

      - name: Restore unrelated concurrent UI work from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            'apps/frontend/app/(shell)/aun-qa/aun-qa-section-nav.tsx' \
            'apps/frontend/app/(shell)/aun-qa/page.tsx' \
            'apps/frontend/app/(shell)/aun-qa/review/page.tsx' \
            'apps/frontend/app/(shell)/aun-qa/sar-preview/page.tsx' \
            'apps/frontend/app/(shell)/qa-dashboard/page.tsx' \
            'apps/frontend/lib/nav.ts'

      - name: Remove temporary patch helpers
        run: |
          git rm -f \
            '.github/workflows/temp-dashboard-grouping-patch.yml' \
            'scripts/temp_patch_dashboard_spec_progress.py' \
            '.github/workflows/temp-pr632-scope-cleanup.yml'

      - name: Validate whitespace
        run: git diff --check

      - name: Commit reconciled PR scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: keep PR 632 scoped to course spec and dashboard"
          git push origin HEAD:fix/course-spec-part1-plo-row
