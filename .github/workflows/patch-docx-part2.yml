name: Apply DOCX Part 2 layout patch

on:
  push:
    branches:
      - fix/course-spec-part1-plo-row
    paths:
      - .github/workflows/patch-docx-part2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/course-spec-part1-plo-row
          fetch-depth: 0

      - name: Apply deterministic DOCX patch
        run: python .github/patch-docx-part2.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'courseInformationTable(info, partTwoContinuationRows(document))' 'apps/frontend/app/(shell)/courses/[id]/spec/document-word-renderer.ts'

      - name: Commit patched renderer and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/frontend/app/(shell)/courses/[id]/spec/document-word-renderer.ts'
          git rm .github/patch-docx-part2.py .github/workflows/patch-docx-part2.yml
          git commit -m 'fix(course-spec): let Word paginate Part 2 rows'
          git push origin HEAD:fix/course-spec-part1-plo-row
