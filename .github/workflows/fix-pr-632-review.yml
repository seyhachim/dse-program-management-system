name: Fix PR 632 review findings

on:
  push:
    branches:
      - fix/course-spec-part1-plo-row
    paths:
      - .github/workflows/fix-pr-632-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/course-spec-part1-plo-row
      - uses: oven-sh/setup-bun@v2
      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              p = Path(path)
              s = p.read_text()
              if s.count(before) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {before[:80]!r}, found {s.count(before)}")
              p.write_text(s.replace(before, after, 1))

          service = "apps/backend/src/plugins/courses/service.ts"
          replace_once(
              service,
              'import { assertCourseSpecEditable } from "./spec-lock.ts";\n',
              'import { assertCourseSpecEditable } from "./spec-lock.ts";\nimport { uniqueActiveCurriculumPlacement } from "./course-spec-progress-placement.ts";\n',
          )
          replace_once(
              service,
              '    take: 1,\n    select: { yearLevel: true, semester: true, sortOrder: true },\n  },\n} satisfies Prisma.CourseSelect;',
              '    // Fetch at most two so multiple active curriculum roots are detected\n    // instead of silently choosing whichever placement sorts first.\n    take: 2,\n    select: { yearLevel: true, semester: true, sortOrder: true },\n  },\n} satisfies Prisma.CourseSelect;',
          )
          replace_once(
              service,
              '  const curriculumPlacement = course.curriculumPlacements[0] ?? null;\n',
              '  const curriculumPlacement = uniqueActiveCurriculumPlacement(course.curriculumPlacements);\n',
          )

          dashboard = "apps/frontend/app/(shell)/dashboard/dashboard-client.tsx"
          replace_once(
              dashboard,
              '  const groupedSpecProgress = buildCourseSpecProgressGroups(specProgress);\n',
              '  const groupedSpecProgress = buildCourseSpecProgressGroups(specProgress);\n  const visibleGroupedSpecProgress = buildCourseSpecProgressGroups(\n    visibleCourseSpecRows(specProgress, incompleteOnly),\n  );\n',
          )
          replace_once(
              dashboard,
              '                {groupedSpecProgress.years.map((year, yearIndex) => {\n                  const visibleSemesters = year.semesters\n                    .map((semester) => ({\n                      ...semester,\n                      visibleCourses: visibleCourseSpecRows(semester.courses, incompleteOnly),\n                    }))\n                    .filter((semester) => semester.visibleCourses.length > 0);\n                  if (visibleSemesters.length === 0) return null;\n',
              '                {visibleGroupedSpecProgress.years.map((year, yearIndex) => {\n                  const visibleSemesters = year.semesters.map((semester) => ({\n                    ...semester,\n                    visibleCourses: semester.courses,\n                  }));\n',
          )
          replace_once(
              dashboard,
              '                    groupedSpecProgress.unassigned.courses,\n                    incompleteOnly,\n',
              '                    visibleGroupedSpecProgress.unassigned.courses,\n                    false,\n',
          )
          replace_once(
              dashboard,
              '{groupedSpecProgress.unassigned.courseCount} courses · {groupedSpecProgress.unassigned.percent}%',
              '{visibleGroupedSpecProgress.unassigned.courseCount} courses · {visibleGroupedSpecProgress.unassigned.percent}%',
          )

          test_path = "apps/frontend/app/(shell)/dashboard/course-spec-progress-groups.test.ts"
          replace_once(
              test_path,
              '  test("uses section-weighted completion percentages", () => {\n',
              '  test("recalculates visible group counts and percentages after incomplete filtering", () => {\n    const rows = [\n      row("AAA101", 10, { programmeYear: 1, semester: "First", sortOrder: 0 }),\n      row("BBB101", 4, { programmeYear: 1, semester: "First", sortOrder: 1 }),\n    ];\n    const visible = buildCourseSpecProgressGroups(visibleCourseSpecRows(rows, true));\n    expect(visible.years[0]?.courseCount).toBe(1);\n    expect(visible.years[0]?.percent).toBe(40);\n    expect(visible.years[0]?.semesters[0]?.courseCount).toBe(1);\n    expect(visible.years[0]?.semesters[0]?.percent).toBe(40);\n  });\n\n  test("uses section-weighted completion percentages", () => {\n',
          )

          Path("apps/backend/src/plugins/courses/course-spec-progress-placement.ts").write_text('''export interface ActiveCurriculumPlacementCandidate {\n  yearLevel: number;\n  semester: "First" | "Second";\n  sortOrder: number;\n}\n\n/**\n * A dashboard without an explicit curriculum selector must never guess between\n * multiple active curriculum roots. Ambiguous placement is surfaced as null so\n * the course remains visible in the Unassigned / other group.\n */\nexport function uniqueActiveCurriculumPlacement<T extends ActiveCurriculumPlacementCandidate>(\n  placements: readonly T[],\n): T | null {\n  return placements.length === 1 ? placements[0] ?? null : null;\n}\n''')
          Path("apps/backend/src/plugins/courses/course-spec-progress-placement.test.ts").write_text('''import { describe, expect, test } from "bun:test";\nimport { uniqueActiveCurriculumPlacement } from "./course-spec-progress-placement.ts";\n\ndescribe("Course Specification dashboard curriculum placement", () => {\n  test("returns the only active placement", () => {\n    const placement = { yearLevel: 2, semester: "Second" as const, sortOrder: 3 };\n    expect(uniqueActiveCurriculumPlacement([placement])).toEqual(placement);\n  });\n\n  test("returns null when no active placement exists", () => {\n    expect(uniqueActiveCurriculumPlacement([])).toBeNull();\n  });\n\n  test("fails visible rather than guessing across multiple active curriculum roots", () => {\n    expect(uniqueActiveCurriculumPlacement([\n      { yearLevel: 1, semester: "First" as const, sortOrder: 0 },\n      { yearLevel: 3, semester: "Second" as const, sortOrder: 0 },\n    ])).toBeNull();\n  });\n});\n''')
          PY

          bun test apps/backend/src/plugins/courses/course-spec-progress-placement.test.ts "apps/frontend/app/(shell)/dashboard/course-spec-progress-groups.test.ts"
          rm .github/workflows/fix-pr-632-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/plugins/courses/service.ts \
            apps/backend/src/plugins/courses/course-spec-progress-placement.ts \
            apps/backend/src/plugins/courses/course-spec-progress-placement.test.ts \
            "apps/frontend/app/(shell)/dashboard/dashboard-client.tsx" \
            "apps/frontend/app/(shell)/dashboard/course-spec-progress-groups.test.ts" \
            .github/workflows/fix-pr-632-review.yml
          git commit -m "fix(dashboard): fail visible on ambiguous curriculum placement"
          git push origin HEAD:fix/course-spec-part1-plo-row
