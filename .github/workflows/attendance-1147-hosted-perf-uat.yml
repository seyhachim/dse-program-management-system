name: Attendance 1147 Hosted Perf UAT

on:
  push:
    branches:
      - ops/1147-hosted-perf-uat

permissions:
  contents: read

jobs:
  hosted-perf-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_URL: https://dse-pms-pr-1144-backend.onrender.com
      OFFERING_ID: 33333333-3333-4333-8333-333333333333
      UAT_DATE: "2099-12-01"
      JWT_SECRET: attendance-perf-1147-disposable-only-2026-09-24
      UAT_USER_ID: 11111111-1111-4111-8111-111111111111
      UAT_EMAIL: lecturer.pr1144@example.invalid

    steps:
      - name: Mint disposable dev token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python3 - <<'PY'
          import base64, hashlib, hmac, json, os, time
          def b64(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()
          header={"alg":"HS256","typ":"JWT"}
          now=int(time.time())
          payload={
              "email":os.environ["UAT_EMAIL"],
              "roles":["lecturer"],
              "programmeRoles":[{"role":"lecturer","programmeId":"dse"}],
              "sub":os.environ["UAT_USER_ID"],
              "iat":now,
              "exp":now+3600,
          }
          h=b64(json.dumps(header,separators=(",",":")).encode())
          p=b64(json.dumps(payload,separators=(",",":")).encode())
          s=b64(hmac.new(os.environ["JWT_SECRET"].encode(), f"{h}.{p}".encode(), hashlib.sha256).digest())
          print(f"{h}.{p}.{s}")
          PY
          )
          echo "::add-mask::$TOKEN"
          echo "UAT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Health and initial roster
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $UAT_TOKEN"
          HEALTH=$(curl -sS --retry 2 --retry-delay 3 --max-time 90 -o /tmp/health.json -w '%{http_code} %{time_total}' "$CANDIDATE_URL/health")
          echo "HEALTH $HEALTH"
          GET=$(curl -sS --max-time 90 -o /tmp/get0.json -D /tmp/get0.h -w '%{http_code} %{time_total}' -H "$AUTH" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          echo "INITIAL_GET $GET roster=$(jq '.records|length' /tmp/get0.json) unmarked=$(jq -r '.counts.Unmarked' /tmp/get0.json)"
          test "$(cut -d' ' -f1 <<<"$GET")" = "200"
          jq -e '.records|length == 43 and .updatedAt == null and .counts.Unmarked == 43' /tmp/get0.json >/dev/null

      - name: Full-class save latency and correctness
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $UAT_TOKEN"

          NOVERSION=$(jq '{records:[.records[0]|{studentId,status:"Present",permissionPending:false,note:""}]}' /tmp/get0.json)
          CODE428=$(curl -sS --max-time 90 -o /tmp/428.json -w '%{http_code}' -X PUT -H "$AUTH" -H 'Content-Type: application/json' --data "$NOVERSION" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          echo "PRECONDITION http=$CODE428"
          test "$CODE428" = "428"

          jq '{expectedUpdatedAt:null,records:(.records|to_entries|map(if .key < 5 then {studentId:.value.studentId,status:null,permissionPending:true,note:"perf pending"} elif .key < 25 then {studentId:.value.studentId,status:"Present",permissionPending:false,note:""} elif .key < 35 then {studentId:.value.studentId,status:"Late",permissionPending:false,note:""} elif .key < 40 then {studentId:.value.studentId,status:"Absent",permissionPending:false,note:""} else {studentId:.value.studentId,status:"Excused",permissionPending:false,note:""} end))}' /tmp/get0.json > /tmp/payload.json

          for RUN in 1 2 3; do
            META=$(curl -sS --max-time 90 -o /tmp/save.json -D /tmp/save.h -w '%{http_code} %{time_total}' -X PUT -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/payload.json "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
            CODE=$(cut -d' ' -f1 <<<"$META")
            TOTAL=$(cut -d' ' -f2 <<<"$META")
            ST=$(grep -i '^server-timing:' /tmp/save.h | tr -d '\r' | tail -1 | cut -d' ' -f2- || true)
            echo "SAVE run=$RUN http=$CODE total_s=$TOTAL server_timing=$ST counts=$(jq -c '{Present:.counts.Present,Late:.counts.Late,Absent:.counts.Absent,Excused:.counts.Excused,Pending:.counts.PermissionPending}' /tmp/save.json)"
            test "$CODE" = "200"
            jq -e '.counts.PermissionPending==5 and .counts.Present==20 and .counts.Late==10 and .counts.Absent==5 and .counts.Excused==3 and .counts.Unmarked==0' /tmp/save.json >/dev/null
            V=$(jq -r '.updatedAt' /tmp/save.json)
            jq --arg v "$V" '.expectedUpdatedAt=$v' /tmp/payload.json > /tmp/payload-next.json
            mv /tmp/payload-next.json /tmp/payload.json
          done

          READ=$(curl -sS --max-time 90 -o /tmp/read.json -w '%{http_code} %{time_total}' -H "$AUTH" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          echo "READBACK $READ"
          test "$(cut -d' ' -f1 <<<"$READ")" = "200"

          STALE=$(jq '.expectedUpdatedAt=null' /tmp/payload.json)
          STALE_CODE=$(curl -sS --max-time 90 -o /tmp/stale.json -w '%{http_code}' -X PUT -H "$AUTH" -H 'Content-Type: application/json' --data "$STALE" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          echo "STALE http=$STALE_CODE"
          test "$STALE_CODE" = "409"

          CURRENT=$(jq -r '.updatedAt' /tmp/read.json)
          BAD=$(jq --arg v "$CURRENT" '.expectedUpdatedAt=$v | .records[7].studentId="00000000-0000-4000-8000-000000000999"' /tmp/payload.json)
          BAD_CODE=$(curl -sS --max-time 90 -o /tmp/bad.json -w '%{http_code}' -X PUT -H "$AUTH" -H 'Content-Type: application/json' --data "$BAD" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          echo "INVALID http=$BAD_CODE"
          test "$BAD_CODE" = "400"

          AFTER=$(curl -sS --max-time 90 -H "$AUTH" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$(jq -r '.updatedAt' <<<"$AFTER")" = "$CURRENT"

          echo "UAT_SUMMARY roster=43 precondition=428 saves=3 readback=200 stale=409 invalid=400 rollback=pass"
