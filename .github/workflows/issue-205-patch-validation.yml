name: Issue 205 patch validation

on:
  push:
    branches:
      - agent/issue-205-academic-version-schema

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.head_commit.message != 'Apply academic-version schema and migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-205-academic-version-schema
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: python scripts/issue205_patch.py
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/backend db:generate
      - run: bunx prisma format --schema apps/backend/prisma/schema.prisma
      - run: bun run --cwd apps/backend typecheck
      - run: bun run --cwd apps/backend test
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/prisma apps/backend/src apps/backend/scripts
          git commit -m "Apply academic-version schema and migration"
          git push origin HEAD:agent/issue-205-academic-version-schema
