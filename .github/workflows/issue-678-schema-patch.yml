name: Issue 678 schema patch

on:
  push:
    branches:
      - agent/issue-678-staff-information-import

permissions:
  contents: write

jobs:
  patch-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-678-staff-information-import
      - name: Patch Prisma schema
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/backend/prisma/schema.prisma')
          text = path.read_text()
          old_user = '''  qualification String?\n  phone         String?\n  createdAt          DateTime @default(now())'''
          new_user = '''  qualification   String?\n  phone           String?\n  profileImageUrl String?\n  createdAt          DateTime @default(now())'''
          old_profile = '''  fieldOfSpecialization String?\n  yearsOfExperience     Int?\n  legacyCoursesTaught   String?\n  createdAt             DateTime @default(now())'''
          new_profile = '''  fieldOfSpecialization String?\n  yearsOfExperience     Int?\n  shortBio              String?\n  programmeStartDate    DateTime? @db.Date\n  legacyCoursesTaught   String?\n  createdAt             DateTime @default(now())'''
          if 'profileImageUrl String?' not in text:
              if old_user not in text:
                  raise SystemExit('User schema anchor not found')
              text = text.replace(old_user, new_user, 1)
          if 'programmeStartDate' not in text:
              if old_profile not in text:
                  raise SystemExit('LecturerProfile schema anchor not found')
              text = text.replace(old_profile, new_profile, 1)
          path.write_text(text)
      - name: Commit schema update
        run: |
          if git diff --quiet; then
            echo 'Schema already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/backend/prisma/schema.prisma
          git commit -m 'feat(staff-import): extend Prisma lecturer profile schema'
          git push origin HEAD:agent/issue-678-staff-information-import
