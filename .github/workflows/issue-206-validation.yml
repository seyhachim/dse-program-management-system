name: Issue 206 validation

on:
  push:
    branches:
      - agent/issue-206-deep-clone-course-spec-revision

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/backend db:generate
      - run: bun run --cwd apps/backend db:migrate:deploy
      - run: bun run --cwd apps/backend typecheck
      - run: bun run --cwd apps/backend test
      - run: bun .github/issue206-integration.ts
