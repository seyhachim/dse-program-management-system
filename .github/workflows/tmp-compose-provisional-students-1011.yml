name: TEMP Apply Provisional Roster Helper

on:
  push:
    branches:
      - feat/issue-1011-provisional-email-students

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip roster-helper-1011]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-1011-provisional-email-students
          fetch-depth: 0
      - name: Apply helper
        run: |
          python .github/tmp_patch_1011_roster.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/scripts/student-roster-import.ts apps/backend/scripts/student-roster-import.test.ts
          git commit -m "feat(student): import provisional roster by institutional email (#1011) [skip roster-helper-1011]"
          git push origin HEAD:feat/issue-1011-provisional-email-students
