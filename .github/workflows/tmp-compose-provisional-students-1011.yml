name: TEMP Finish Provisional Student Types

on:
  push:
    branches:
      - feat/issue-1011-provisional-email-students

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip types-1011]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-1011-provisional-email-students
          fetch-depth: 0
      - name: Patch remaining nullable ID boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          one(
              "packages/shared-types/src/offerings.ts",
              "  students: { id: string; name: string; studentId: string }[];",
              "  students: { id: string; name: string; studentId: string | null }[];",
          )

          one(
              "apps/backend/src/plugins/offerings/student-attendance-history-service.ts",
              "    if (!student?.studentId) return null;\n    const history = await historyForStudent(student, offeringId);",
              "    if (!student?.studentId) return null;\n    const history = await historyForStudent({ id: student.id, studentId: student.studentId }, offeringId);",
          )

          one(
              "apps/backend/src/plugins/student-portal/portfolio-profile.ts",
              "function toProfile(row: PortfolioStudentRow & { email: string }): StudentPortfolioProfileView {",
              "function toProfile(row: PortfolioStudentRow & { email: string; studentId: string }): StudentPortfolioProfileView {",
          )

          one(
              "apps/backend/src/plugins/student-portal/service.ts",
              "        studentId: rows.student.studentId,",
              "        studentId: student.studentId,",
          )
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared-types/src/offerings.ts apps/backend/src/plugins/offerings/student-attendance-history-service.ts apps/backend/src/plugins/student-portal/portfolio-profile.ts apps/backend/src/plugins/student-portal/service.ts
          git commit -m "fix(student): finish nullable student ID propagation (#1011) [skip types-1011]"
          git push origin HEAD:feat/issue-1011-provisional-email-students
