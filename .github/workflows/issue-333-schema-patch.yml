name: Issue 333 schema patch

on:
  push:
    branches:
      - agent/issue-333-finalized-result-corrections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-333-finalized-result-corrections
          fetch-depth: 0
      - name: Apply exact Prisma schema patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/backend/prisma/schema.prisma')
          text = path.read_text()

          replacements = [
              (
                  '  assessmentResultsFinalized       AssessmentResult[]               @relation("AssessmentResultFinalizedBy")\n',
                  '  assessmentResultsFinalized       AssessmentResult[]               @relation("AssessmentResultFinalizedBy")\n'
                  '  assessmentResultCorrections      AssessmentResultCorrection[]     @relation("AssessmentResultCorrectionActor")\n',
              ),
              (
                  '  criterionScores  AssessmentCriterionScore[]\n  createdAt        DateTime   @default(now())\n',
                  '  criterionScores  AssessmentCriterionScore[]\n  corrections      AssessmentResultCorrection[]\n  createdAt        DateTime   @default(now())\n',
              ),
              (
                  '/// Issue #282: per-student rubric criterion score evidence. Whole-assessment\nmodel AssessmentCriterionScore {\n',
                  '''/// Append-only, reasoned history for controlled changes to an official finalized result.\n/// Database triggers reject UPDATE/DELETE so every correction remains auditable.\nmodel AssessmentResultCorrection {\n  id                 String           @id @default(uuid())\n  assessmentResultId String\n  assessmentResult   AssessmentResult @relation(fields: [assessmentResultId], references: [id], onDelete: Restrict)\n  beforeScore        Float\n  beforeMaxScore     Float\n  beforeFeedback     String\n  afterScore         Float\n  afterMaxScore      Float\n  afterFeedback      String\n  reason             String\n  correctedById      String\n  correctedBy        User             @relation("AssessmentResultCorrectionActor", fields: [correctedById], references: [id], onDelete: Restrict)\n  createdAt          DateTime         @default(now())\n\n  @@index([assessmentResultId, createdAt])\n  @@index([correctedById])\n}\n\n/// Issue #282: per-student rubric criterion score evidence. Whole-assessment\nmodel AssessmentCriterionScore {\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one schema match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit schema patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-333-schema-patch.yml
          git add apps/backend/prisma/schema.prisma
          git diff --cached --check
          git commit -m "db(results): declare finalized correction history"
          git push origin HEAD:agent/issue-333-finalized-result-corrections
