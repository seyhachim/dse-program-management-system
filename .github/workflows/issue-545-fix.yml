name: Apply issue 545 compatibility fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-545-bilingual-public-content
      - uses: oven-sh/setup-bun@v2
      - name: Apply compatibility fix
        run: python scripts/issue-545-fix-keywords.py
      - name: Format touched files
        run: bunx prettier --write packages/shared-types/src/public-programme-info.ts apps/backend/src/plugins/programme/public-programme-info-service.ts apps/frontend/app/'(shell)'/public-information/public-information-client.tsx
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(public-info): keep Khmer keywords backward compatible (#545)'
          git push origin HEAD:feat/issue-545-bilingual-public-content
