name: Apply issue 766 course spec patch

on:
  push:
    branches:
      - fix/issue-766-inline-course-synopsis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-766-inline-course-synopsis
      - name: Apply narrow Course Specification rendering patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages.tsx")
          source = path.read_text()
          replacements = {
              'className="bg-[#E2EEDB] text-left font-normal">Description of the course learning outcomes – CLOs At the end of the course, students will be able to:':
                  'className="bg-[#E2EEDB] text-center font-normal">Description of the course learning outcomes – CLOs. At the end of the course, students will be able to:',
              'className="bg-[#E2EEDB] text-left font-normal">Levels in Learning Domain:<br />Knowledge (Cognitive-C), Attitude (Affective-A), Skills (Psychomotor-P)':
                  'className="bg-[#E2EEDB] text-center font-normal">Levels in Learning Domain:<br />Knowledge (Cognitive-C), Attitude (Affective-A), Skills (Psychomotor-P)',
              '<TD className="text-center align-middle">{domain.cognitive}</TD><TD className="text-center align-middle">{domain.affective}</TD><TD className="text-center align-middle">{domain.psychomotor}</TD>':
                  '<TD className="text-center align-middle">{domain.cognitive || " "}</TD><TD className="text-center align-middle">{domain.affective || " "}</TD><TD className="text-center align-middle">{domain.psychomotor || " "}</TD>',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Expected source fragment not found: {old[:100]}")
              source = source.replace(old, new, 1)
          path.write_text(source)

          test_path = Path("apps/frontend/app/(shell)/courses/[id]/spec/document-preview-pages-layout.test.ts")
          tests = test_path.read_text()
          tests = tests.replace(
              'Description of the course learning outcomes – CLOs At the end of the course, students will be able to:',
              'Description of the course learning outcomes – CLOs. At the end of the course, students will be able to:',
              1,
          )
          tests = tests.replace(
              "    expect(source).toContain('className=\"bg-[#E2EEDB] text-left font-normal\"');",
              "    expect(source).toContain('className=\"bg-[#E2EEDB] text-center font-normal\"');\n    expect(source).toContain('{domain.cognitive || \" \"}');\n    expect(source).toContain('{domain.affective || \" \"}');\n    expect(source).toContain('{domain.psychomotor || \" \"}');",
              1,
          )
          test_path.write_text(tests)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/app/\(shell\)/courses/\[id\]/spec/document-preview-pages.tsx apps/frontend/app/\(shell\)/courses/\[id\]/spec/document-preview-pages-layout.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(course-spec): restore official CLO table layout"
          git push origin HEAD:fix/issue-766-inline-course-synopsis
