name: Student Portal MVP Integrity

on:
  pull_request:
    paths:
      - "apps/backend/src/plugins/student-portal/**"
      - "apps/backend/prisma/**"
      - "apps/frontend/app/(shell)/portal/**"
      - "apps/frontend/lib/student-portal.ts"
      - "apps/frontend/lib/student-portfolio.ts"
      - "packages/shared-types/src/student-portal.ts"
      - "packages/shared-types/src/student-portfolio.ts"
      - "packages/shared-types/src/plugins.ts"
      - ".github/workflows/student-portal-mvp-integrity.yml"

permissions:
  contents: read

jobs:
  portal-integrity:
    name: Student authorization and publication boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dse_student_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d dse_student_portal_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dse_student_portal_ci?schema=public
      STUDENT_PORTAL_MVP_DB_TESTS: "1"
      STUDENT_PORTFOLIO_DB_TESTS: "1"
      JWT_SECRET: issue-169-student-portal-ci-secret-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Apply migrations
        run: bun run db:migrate:deploy

      - name: Seed database
        run: bun run seed

      - name: Verify Student Portal authorization and publication boundaries
        run: >-
          bun test
          apps/backend/src/plugins/student-portal/portal-mvp-db.test.ts
          apps/backend/src/plugins/student-portal/portfolio-evidence-db.test.ts
          apps/backend/src/plugins/student-portal/portfolio-complete-db.test.ts
