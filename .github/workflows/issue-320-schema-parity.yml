name: Issue 320 Prisma schema parity

on:
  push:
    branches:
      - feat/320-curriculum-course-spec-binding
    paths:
      - .github/workflows/issue-320-schema-parity.yml

permissions:
  contents: write

jobs:
  patch-schema:
    if: github.repository == 'thymadona/dse-program-management-system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/320-curriculum-course-spec-binding

      - name: Add exact CourseSpec relation to Prisma schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/backend/prisma/schema.prisma')
          text = path.read_text()

          pattern = r'(model ProgrammeCurriculumCourse \{.*?\n\s+courseId\s+String\n\s+course\s+Course\s+@relation\([^\n]+\)\n)(\s+yearLevel\s+Int)'
          replacement = r'\1  courseSpecVersionId String?\n  courseSpecVersion   CourseSpec?                 @relation("ProgrammeCurriculumCourseSpecVersion", fields: [courseSpecVersionId], references: [id], onDelete: Restrict)\n\2'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          assert count == 1, 'ProgrammeCurriculumCourse field anchor changed'

          pattern = r'(model ProgrammeCurriculumCourse \{.*?@@unique\(\[curriculumVersionId, courseId\]\)\n\s+@@index\(\[courseId\]\)\n)(\s+@@index\(\[curriculumVersionId, yearLevel, semester, sortOrder\]\))'
          replacement = r'\1  @@index([courseSpecVersionId])\n\2'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          assert count == 1, 'ProgrammeCurriculumCourse index anchor changed'

          pattern = r'(model CourseSpec \{.*?\n\s+reviewActions\s+CourseSpecReviewAction\[\]\n)(\n\s+approvedAt\s+DateTime\?)'
          replacement = r'\1  curriculumPlacements     ProgrammeCurriculumCourse[] @relation("ProgrammeCurriculumCourseSpecVersion")\n\2'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          assert count == 1, 'CourseSpec relation anchor changed'

          path.write_text(text)
          PY

      - name: Commit schema parity
        shell: bash
        run: |
          git config user.name "Seyha Chim"
          git config user.email "32429415+seyhachim@users.noreply.github.com"
          git add apps/backend/prisma/schema.prisma
          git diff --cached --check
          git commit -m "feat(curriculum): represent CourseSpec binding in Prisma schema"
          git push origin HEAD:feat/320-curriculum-course-spec-binding
