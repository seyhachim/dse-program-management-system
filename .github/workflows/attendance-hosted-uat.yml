name: Attendance Hosted UAT

on:
  push:
    branches:
      - ops/1145-attendance-hosted-uat

permissions:
  contents: read

jobs:
  hosted-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://dwiqdvxfmzklhrviuzem.supabase.co
      SUPABASE_KEY: sb_publishable_kGzTbbPovGtW37a9BUeJQA_W_028IFp
      CANDIDATE_URL: https://dse-pms-native-prod-candidate.onrender.com
      OFFERING_ID: 33333333-3333-4333-8333-333333333333
      UAT_DATE: "2099-11-14"
      UAT_EMAIL: seyhachim+pr1145-uat@gmail.com

    steps:
      - name: Candidate health and unauthenticated boundary
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_CODE=$(curl -sS --retry 2 --retry-delay 5 --max-time 90 -o /tmp/health.json -w '%{http_code}' "$CANDIDATE_URL/health")
          test "$HEALTH_CODE" = "200"
          jq -e '.ok == true' /tmp/health.json >/dev/null

          UNAUTH_CODE=$(curl -sS --max-time 60 -o /tmp/unauth.json -w '%{http_code}'             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$UNAUTH_CODE" = "401"

      - name: Supabase-authenticated read-only verification
        shell: bash
        run: |
          set -euo pipefail
          PW=$(openssl rand -base64 30 | tr -d '/+=' | head -c 32)

          SIGNUP_CODE=$(curl -sS --max-time 30 -o /tmp/signup.json -w '%{http_code}'             -X POST "$SUPABASE_URL/auth/v1/signup"             -H "apikey: $SUPABASE_KEY"             -H "Content-Type: application/json"             --data "$(jq -nc --arg email "$UAT_EMAIL" --arg password "$PW" '{email:$email,password:$password}')")
          if [ "$SIGNUP_CODE" != "200" ]; then
            echo "Signup HTTP $SIGNUP_CODE"
            jq '{code,error_code,msg,message}' /tmp/signup.json
            exit 20
          fi

          TOKEN=$(jq -r '.access_token // empty' /tmp/signup.json)
          if [ -z "$TOKEN" ]; then
            echo "Waiting for disposable account confirmation..."
            for attempt in $(seq 1 60); do
              sleep 5
              LOGIN_CODE=$(curl -sS --max-time 30 -o /tmp/login.json -w '%{http_code}'                 -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password"                 -H "apikey: $SUPABASE_KEY"                 -H "Content-Type: application/json"                 --data "$(jq -nc --arg email "$UAT_EMAIL" --arg password "$PW" '{email:$email,password:$password}')")
              if [ "$LOGIN_CODE" = "200" ]; then
                TOKEN=$(jq -r '.access_token // empty' /tmp/login.json)
                [ -n "$TOKEN" ] && break
              fi
              echo "Waiting for confirmation attempt $attempt"
            done
          fi
          test -n "$TOKEN"

          auth_header=(-H "Authorization: Bearer $TOKEN")

          ME_CODE=$(curl -sS --max-time 90 -o /tmp/me.json -w '%{http_code}'             "${auth_header[@]}" "$CANDIDATE_URL/api/auth/me")
          test "$ME_CODE" = "200"

          GET_CODE=$(curl -sS --max-time 90 -o /tmp/attendance.json -w '%{http_code}'             "${auth_header[@]}" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$GET_CODE" = "200"
          jq -e '.records|length == 43' /tmp/attendance.json >/dev/null
          jq -e '.counts.Unmarked == 43 and .updatedAt == null and .sessionId == null' /tmp/attendance.json >/dev/null

          echo "SUPABASE_READONLY_UAT health=200 unauthorized=401 me=200 attendance=200 records=43 unmarked=43 no_session=true"
