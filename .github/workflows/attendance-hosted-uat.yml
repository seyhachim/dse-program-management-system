name: Attendance Hosted UAT

on:
  push:
    branches:
      - ops/1145-attendance-hosted-uat

permissions:
  contents: read

jobs:
  hosted-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://dwiqdvxfmzklhrviuzem.supabase.co
      SUPABASE_KEY: sb_publishable_kGzTbbPovGtW37a9BUeJQA_W_028IFp
      CANDIDATE_URL: https://dse-pms-native-prod-candidate.onrender.com
      OFFERING_ID: 33333333-3333-4333-8333-333333333333
      UAT_DATE: "2099-11-14"
      UAT_EMAIL: seyhachim+pr1145-uat@gmail.com

    steps:
      - name: Candidate health and auth settings
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_CODE=$(curl -sS --retry 2 --retry-delay 5 --max-time 90 -o /tmp/health.json -w '%{http_code}' "$CANDIDATE_URL/health")
          test "$HEALTH_CODE" = "200"
          jq -e '.ok == true' /tmp/health.json >/dev/null

          curl -sS --max-time 30             -H "apikey: $SUPABASE_KEY"             "$SUPABASE_URL/auth/v1/settings" > /tmp/auth-settings.json
          jq '{mailer_autoconfirm, disable_signup, external}' /tmp/auth-settings.json

          UNAUTH_CODE=$(curl -sS --max-time 60 -o /tmp/unauth.json -w '%{http_code}'             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$UNAUTH_CODE" = "401"

      - name: Authenticate disposable lecturer and run attendance API UAT
        shell: bash
        run: |
          set -euo pipefail
          PW=$(openssl rand -base64 30 | tr -d '/+=' | head -c 32)
          SIGNUP_CODE=$(curl -sS --max-time 30 -o /tmp/signup.json -w '%{http_code}'             -X POST "$SUPABASE_URL/auth/v1/signup"             -H "apikey: $SUPABASE_KEY"             -H "Content-Type: application/json"             --data "$(jq -nc --arg email "$UAT_EMAIL" --arg password "$PW" '{email:$email,password:$password}')")
          if [ "$SIGNUP_CODE" != "200" ]; then
            echo "Signup HTTP $SIGNUP_CODE"
            jq '{code,error_code,msg,message}' /tmp/signup.json
            exit 20
          fi

          TOKEN=$(jq -r '.access_token // empty' /tmp/signup.json)
          if [ -z "$TOKEN" ]; then
            echo "Signup created no session; waiting for disposable email confirmation."
            jq '{user_id:(.user.id // null), email_confirmed_at:(.user.email_confirmed_at // null)}' /tmp/signup.json
            for attempt in $(seq 1 40); do
              sleep 10
              LOGIN_CODE=$(curl -sS --max-time 30 -o /tmp/login.json -w '%{http_code}' \
                -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
                -H "apikey: $SUPABASE_KEY" \
                -H "Content-Type: application/json" \
                --data "$(jq -nc --arg email "$UAT_EMAIL" --arg password "$PW" '{email:$email,password:$password}')")
              if [ "$LOGIN_CODE" = "200" ]; then
                TOKEN=$(jq -r '.access_token // empty' /tmp/login.json)
                [ -n "$TOKEN" ] && break
              fi
              echo "Waiting for confirmation attempt $attempt"
            done
          fi
          if [ -z "$TOKEN" ]; then
            echo "Disposable lecturer was not confirmed in time."
            exit 21
          fi

          auth_header=(-H "Authorization: Bearer $TOKEN")
          json_header=(-H "Content-Type: application/json")

          GET1_CODE=$(curl -sS --max-time 90 -o /tmp/get1.json -w '%{http_code}'             "${auth_header[@]}" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$GET1_CODE" = "200"
          jq -e '.records|length == 43' /tmp/get1.json >/dev/null
          jq -e '.counts.Unmarked == 43 and .updatedAt == null' /tmp/get1.json >/dev/null

          PAYLOAD_428=$(jq '{records:[.records[0] | {studentId,status:"Present",permissionPending:false,note:"UAT 428"}]}' /tmp/get1.json)
          CODE_428=$(curl -sS --max-time 90 -o /tmp/put428.json -w '%{http_code}'             -X PUT "${auth_header[@]}" "${json_header[@]}"             --data "$PAYLOAD_428"             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$CODE_428" = "428"

          GET2_CODE=$(curl -sS --max-time 90 -o /tmp/get2.json -w '%{http_code}'             "${auth_header[@]}" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$GET2_CODE" = "200"
          jq -e '.updatedAt == null and .counts.Unmarked == 43' /tmp/get2.json >/dev/null

          FULL_PAYLOAD=$(jq '{
            expectedUpdatedAt:null,
            records:(.records | to_entries | map(
              if .key < 5 then
                {studentId:.value.studentId,status:null,permissionPending:true,note:"UAT pending"}
              elif .key < 25 then
                {studentId:.value.studentId,status:"Present",permissionPending:false,note:""}
              elif .key < 35 then
                {studentId:.value.studentId,status:"Late",permissionPending:false,note:""}
              elif .key < 40 then
                {studentId:.value.studentId,status:"Absent",permissionPending:false,note:""}
              else
                {studentId:.value.studentId,status:"Excused",permissionPending:false,note:""}
              end
            ))
          }' /tmp/get2.json)

          START=$(date +%s)
          SAVE_CODE=$(curl -sS --max-time 90 -o /tmp/save1.json -w '%{http_code}'             -X PUT "${auth_header[@]}" "${json_header[@]}"             --data "$FULL_PAYLOAD"             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          ELAPSED=$(( $(date +%s) - START ))
          test "$SAVE_CODE" = "200"
          jq -e '.counts.PermissionPending == 5 and .counts.Present == 20 and .counts.Late == 10 and .counts.Absent == 5 and .counts.Excused == 3 and .counts.Unmarked == 0' /tmp/save1.json >/dev/null
          V1=$(jq -r '.updatedAt' /tmp/save1.json)
          test -n "$V1"

          READ_CODE=$(curl -sS --max-time 90 -o /tmp/read1.json -w '%{http_code}'             "${auth_header[@]}" "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$READ_CODE" = "200"
          jq -e '.counts.PermissionPending == 5 and .counts.Present == 20 and .counts.Late == 10 and .counts.Absent == 5 and .counts.Excused == 3 and .counts.Unmarked == 0' /tmp/read1.json >/dev/null

          STALE=$(jq '.expectedUpdatedAt=null' <<<"$FULL_PAYLOAD")
          STALE_CODE=$(curl -sS --max-time 90 -o /tmp/stale.json -w '%{http_code}'             -X PUT "${auth_header[@]}" "${json_header[@]}"             --data "$STALE"             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$STALE_CODE" = "409"

          TAB_A=$(jq --arg v "$V1" '{
            expectedUpdatedAt:$v,
            records:(.records | map({
              studentId,
              status:(if .permissionPending then null else .status end),
              permissionPending,
              note
            }) | .[5].status="Late")
          }' /tmp/read1.json)
          TAB_B=$(jq --arg v "$V1" '{
            expectedUpdatedAt:$v,
            records:(.records | map({
              studentId,
              status:(if .permissionPending then null else .status end),
              permissionPending,
              note
            }) | .[6].status="Absent")
          }' /tmp/read1.json)

          A_CODE=$(curl -sS --max-time 90 -o /tmp/tabA.json -w '%{http_code}'             -X PUT "${auth_header[@]}" "${json_header[@]}"             --data "$TAB_A"             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$A_CODE" = "200"
          V2=$(jq -r '.updatedAt' /tmp/tabA.json)
          test "$V2" != "$V1"

          B_CODE=$(curl -sS --max-time 90 -o /tmp/tabB.json -w '%{http_code}'             -X PUT "${auth_header[@]}" "${json_header[@]}"             --data "$TAB_B"             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$B_CODE" = "409"

          BAD=$(jq --arg v "$V2" '{
            expectedUpdatedAt:$v,
            records:(.records | map({
              studentId,
              status:(if .permissionPending then null else .status end),
              permissionPending,
              note
            }) | .[7].studentId="00000000-0000-4000-8000-000000000999")
          }' /tmp/tabA.json)
          BAD_CODE=$(curl -sS --max-time 90 -o /tmp/bad.json -w '%{http_code}'             -X PUT "${auth_header[@]}" "${json_header[@]}"             --data "$BAD"             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$BAD_CODE" = "400"

          VERIFY_FAIL=$(curl -sS --max-time 90 "${auth_header[@]}"             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$(jq -r '.updatedAt' <<<"$VERIFY_FAIL")" = "$V2"

          RETRY=$(jq --arg v "$V2" '{
            expectedUpdatedAt:$v,
            records:(.records | map({
              studentId,
              status:(if .permissionPending then null else .status end),
              permissionPending,
              note
            }) | .[7].status="Late")
          }' /tmp/tabA.json)
          RETRY_CODE=$(curl -sS --max-time 90 -o /tmp/retry.json -w '%{http_code}'             -X PUT "${auth_header[@]}" "${json_header[@]}"             --data "$RETRY"             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE")
          test "$RETRY_CODE" = "200"
          V3=$(jq -r '.updatedAt' /tmp/retry.json)

          STUDENT=$(jq -r '.records[5].studentId' /tmp/retry.json)
          RECHECK=$(jq -nc --arg s "$STUDENT" '{
            studentId:$s,
            observation:{status:"Late",permissionPending:false,note:"UAT Check 2"},
            final:{status:"Present",permissionPending:false,note:"UAT final"}
          }')
          RECHECK_CODE=$(curl -sS --max-time 90 -o /tmp/recheck.json -w '%{http_code}'             -X POST "${auth_header[@]}" "${json_header[@]}"             --data "$RECHECK"             "$CANDIDATE_URL/api/offerings/$OFFERING_ID/attendance/$UAT_DATE/recheck")
          test "$RECHECK_CODE" = "200"
          jq --arg s "$STUDENT" -e '.records[] | select(.studentId==$s) | (.checkpoints|length)==2 and .status=="Present"' /tmp/recheck.json >/dev/null

          echo "UAT_SUMMARY health=200 unauthorized=401 initial=43_unmarked precondition=428 full_save=200 full_save_seconds=$ELAPSED readback=200 stale=409 tabA=200 tabB=409 failed_save=400 retry=200 recheck=200"
